# Weekly private snapshots of green-coffee importers' public offer lists (src/coffeedata/importers.py): one pass a
# week, one public page per importer, into a private Hugging Face dataset of its own: each lot word for word (raw/:
# every cell of its row, and its URL) and the stated fields with our normalized values (offers/). No prices, page
# HTML or images. Backend-only: dbt, the release, the site and the public export never read it.
#
# Why GitHub Actions and not the Cloud Run jobs: two page fetches and one small upload a week need no NAT IP, no
# staging bucket and no crawl window, and a Cloud Run job would need new GCP resources (a job, a scheduler trigger,
# IAM), which this repo only adds through terraform. Here it needs nothing new but the schedule.
#
# Like eval-floors.yml, it holds a Hub token, so it never runs on pull requests, and its job runs only on main (a
# dispatch from another branch is skipped): no other branch's code (its scripts, or a package its uv.lock installs)
# runs with the token. It needs a write token (HF_TOKEN, the one site.yml and weekly.yml use), since it creates the
# private dataset on its first run and adds two files (raw and offers) per importer per week.
#
# Royal Coffee (royal_coffee) is fetched on the scheduled run only. Its terms restrict automated access and AI tools;
# the owner chose to include it, and no AI agent may ever access the site. So its address appears nowhere but here,
# and only a scheduled run gets it (COFFEEDATA_ROYAL_URL below is empty on a dispatch): an AI agent that can
# dispatch this workflow still can't make it fetch Royal. importers.royal_listing_url refuses the address under
# pytest, outside GitHub Actions, in another workflow and on any event but `schedule`.
#
# Nothing passes silently: no token, a fetch that fails, or a page whose layout changed (zero rows parsed) fails the
# run, and that importer's week stays unwritten, so a dispatch the same week (after a fix) fetches it again. A week
# already stored is never fetched again.
name: importers
on:
  schedule:
    - cron: "37 17 * * 3"  # Wednesdays 17:37 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: importers
  cancel-in-progress: false
jobs:
  snapshot:
    # main's code only: a dispatch from another branch would run that branch's scripts and lockfile with the token
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: {python-version: "3.12"}
      - run: uv sync --locked
      - name: snapshot this week's offer lists (private dataset)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Defaults to <owner>/coffee-data-importers; set the IMPORTERS_URL variable to use another private dataset.
          COFFEEDATA_IMPORTERS: ${{ vars.IMPORTERS_URL || format('hf://datasets/{0}/coffee-data-importers', github.repository_owner) }}
          # importers.ensure_private refuses to write to any of these
          COFFEEDATA_LAKE: ${{ vars.LAKE_URL }}
          PUBLIC_EXPORT_URL: ${{ vars.PUBLIC_EXPORT_URL }}
          # Royal's store, for the scheduled run alone (see the note at the top)
          COFFEEDATA_ROYAL_URL: ${{ github.event_name == 'schedule' && 'https://royalcoffee.com' || '' }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error title=Importer snapshots::HF_TOKEN is not set, so the private importers dataset can't be written."
            exit 1
          fi
          uv run coffeedata importer-snapshot
