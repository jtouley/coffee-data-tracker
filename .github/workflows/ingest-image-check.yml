# Build the ingestion jobs' image (ingest.Dockerfile) and check it starts, without pushing it, so a Dockerfile,
# lockfile or package change that breaks the image fails on the pull request and not after the merge, where
# deploy.yml's ingest-image job builds and pushes it for real. Nothing here is pushed, signed in to or deployed.
# - It runs only when something the image is built from changes. The run on main only fills the layer cache that
#   pull requests read (a pull request can't read another's cache).
# - It is its own workflow, not a job in ci: ci has no path filter, and deploy waits on ci.
name: ingest-image-check
on:
  pull_request:
    paths:
      - ingest.Dockerfile
      - ingest.Dockerfile.dockerignore
      - pyproject.toml
      - uv.lock
      - "src/**"
      - "!src/terraform/**"
      - marketplace/LISTING.md
      - .github/workflows/ingest-image-check.yml
  push:
    branches: [main]
    paths:
      - ingest.Dockerfile
      - ingest.Dockerfile.dockerignore
      - pyproject.toml
      - uv.lock
      - "src/**"
      - "!src/terraform/**"
      - marketplace/LISTING.md
      - .github/workflows/ingest-image-check.yml
permissions:
  contents: read
concurrency:
  group: ingest-image-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # BuildKit, so ingest.Dockerfile.dockerignore applies, as in Cloud Build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ingest.Dockerfile
          push: false
          load: true  # into the runner's Docker, for the step below
          tags: ingest:check
          cache-from: type=gha,scope=ingest-image
          cache-to: type=gha,scope=ingest-image,mode=max
      - name: Check the image starts (no network, no secrets)
        run: |
          for command in crawl merge enrich-week build; do  # commands the jobs run; --help imports the package
            docker run --rm --network none ingest:check "$command" --help > /dev/null
          done
