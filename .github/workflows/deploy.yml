# Build the app's image and deploy it to Cloud Run once ci has passed on a push to main. Pull requests only build
# the image and check the Terraform. Authentication is Workload Identity Federation (no keys); the variables come
# from `terraform output` (docs/app/RUNNING.md). Until they're set, the deploy jobs are skipped.
# The image carries the commit it was built from (--build-arg GIT_SHA: lineage.git_sha).
#
# - Main deploys start on workflow_run, when ci completes, and only if it succeeded on a push. That event has no path
#   filter, so a docs-only merge deploys too: the same app, rebuilt and restarted. A filter on the one commit that
#   triggered the run would miss app changes in an earlier commit whose own deploy was skipped (next point).
# - A run deploys only main's tip: ci runs for two quick pushes can finish out of order, and the older commit must
#   not replace the newer one in production. Deploys run one at a time and every waiting one keeps its place
#   (`queue: max`): with GitHub's default, a late older commit's job would replace the tip's and then skip itself.
# - workflow_dispatch from main deploys main's tip (a redeploy, or the first deploy once the variables are set), but
#   only if ci passed on it: a manual redeploy is most wanted when the tip is red. `force` deploys it anyway.
# - The image goes out by digest: to the app, then to the admin service once GCP_ADMIN_SERVICE is set, only while
#   the app still serves the revision this run made live. The two run the same image except when the admin's own
#   smoke test fails: then the app has the new image and the admin keeps the old one until a later deploy passes
#   (RUNNING.md, "A failed smoke test"). A required reviewer for the admin can be added to the `admin` environment
#   in the repository's settings.
# - Each service's new revision is deployed with no traffic, smoke-tested signed out at its own tagged URL, and given
#   the traffic only if that passes; then the live domain is checked, and moved back on a failure
#   (src/coffeedata/live_smoke.py). A failed check fails the run; the job summary says what failed and what serves.
# - A deploy while the app's traffic is pinned to an older revision (RUNNING.md, Rolling back) gets 0% of the
#   traffic: the run says so with a warning.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    paths: ["app/**", "admin/**", "src/**", "pyproject.toml", "uv.lock", "src/terraform/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy main's tip even if ci didn't pass on it"
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to a pull request cancels its older check. Other runs get a group of their own here, and only the
# deploy jobs queue (deploy-main, deploy-admin-main), so a run whose jobs skip (after a red ci, say) displaces none.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: Build the image
        run: docker build -f app/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t registry-coffee:check .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with: {terraform_version: "1.9.8"}
      - name: Check the Terraform
        working-directory: src/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
          terraform -chdir=bootstrap init -backend=false -input=false
          terraform -chdir=bootstrap validate

  deploy:
    # A green ci run on a push to main in this repository (a fork's pull request from its own branch named main
    # matches `branches` too, hence the event and repository checks), or a manual run from main.
    if: >-
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_IMAGE != '' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: deploy-main, cancel-in-progress: false, queue: max}
    permissions:
      contents: read
      actions: read  # ci's runs, for a manual deploy
      id-token: write  # for Workload Identity Federation
    outputs:
      image: ${{ steps.push.outputs.image }}  # <GCP_IMAGE>@sha256:<digest>; empty when the run skipped
      revision: ${{ steps.rollout.outputs.revision }}  # the app revision this run made live; empty if none
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.GCP_SERVICE || 'registry-coffee' }}
      # workflow_run's github.sha is main's tip when the event fired, not the commit ci passed.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Inside the deploy-main queue, so a newer commit's deploy can't slip in between this check and the deploy.
      - name: Is this commit still main's tip?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.force }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::Not deploying $HEAD_SHA: main has moved on to $tip, whose own run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MANUAL" = "true" ]; then  # workflow_run already requires ci's success
            ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "none" elif .status != "completed" then "running" else .conclusion end')
            if [ "$ci" = "running" ]; then
              echo "::error::ci on $HEAD_SHA hasn't finished yet. Wait for it (its success deploys this commit anyway), or run this again with force."
              exit 1
            elif [ "$ci" != "success" ]; then
              echo "::error::ci on $HEAD_SHA is '$ci', not success. Fix main, or run this again with force to deploy it anyway."
              exit 1
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - if: steps.tip.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - if: steps.tip.outputs.current == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: steps.tip.outputs.current == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - name: Build and push
        id: push
        if: steps.tip.outputs.current == 'true'
        env:
          IMAGE: ${{ vars.GCP_IMAGE }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f app/Dockerfile --build-arg GIT_SHA="$HEAD_SHA" -t "$IMAGE:$HEAD_SHA" .
          docker push "$IMAGE:$HEAD_SHA"
          # The registry's digest for what was just pushed: the tag can move, the digest can't.
          ref=$(docker inspect --format '{{join .RepoDigests "\n"}}' "$IMAGE:$HEAD_SHA" |
            awk -v p="$IMAGE@sha256:" 'index($0, p) == 1 {print; exit}')
          if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No registry digest for $IMAGE:$HEAD_SHA after the push."
            exit 1
          fi
          echo "image=$ref" >> "$GITHUB_OUTPUT"
      # The new revision gets no traffic until it answers (src/coffeedata/live_smoke.py): it's deployed with
      # --no-traffic and this run's tag, smoke-tested signed out at the tag's run.app URL, and only then given the
      # traffic; then app.registry.coffee is checked, and a failure there moves the traffic back. A failure fails
      # the run, and the job summary says which check failed and where production is. Pinned traffic stays pinned
      # (RUNNING.md, Rolling back): the new revision is still smoke-tested, gets 0%, and the run warns.
      - name: Deploy, smoke-test, then move the traffic
        id: rollout
        if: steps.tip.outputs.current == 'true'
        env:
          IMAGE_REF: ${{ steps.push.outputs.image }}
          TAG: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONPATH: src
        run: |
          python3 -m coffeedata.live_smoke rollout app "$SERVICE" --region "$REGION" --tag "$TAG" \
            --live https://app.registry.coffee -- --image "$IMAGE_REF"
      # The usage collector runs the app image ci.tfvars pins (usage_image, src/terraform/usage.tf); Terraform
      # deploys it, not this workflow. Tag that digest `pinned-usage-<12 hex>` so the registry's cleanup (keep the
      # pinned* tags, artifact_registry.tf) never deletes the image the collector's next cold start needs. Creating
      # the tag is within the deploy account's registry writer role (moving one isn't: that needs tags.delete); it
      # changes no service. It runs once the push (and so the sign-in) worked, whatever this deploy's smoke test found:
      # the collector's image isn't this one.
      - name: Keep the usage collector's pinned image
        if: ${{ !cancelled() && steps.tip.outputs.current == 'true' && steps.push.outcome == 'success' }}
        env:
          IMAGE: ${{ vars.GCP_IMAGE }}
        run: |
          usage=$(sed -n 's/^usage_image *= *"\(.*\)"$/\1/p' src/terraform/ci.tfvars)
          if [ -z "$usage" ]; then
            echo "usage_image isn't pinned in ci.tfvars: the collector runs Google's sample image. Nothing to keep."
            exit 0
          fi
          if ! [[ "$usage" =~ ^"$IMAGE"@sha256:([0-9a-f]{64})$ ]]; then
            echo "::error::ci.tfvars' usage_image isn't $IMAGE pinned by digest."
            exit 1
          fi
          digest="sha256:${BASH_REMATCH[1]}"
          tag="pinned-usage-${BASH_REMATCH[1]:0:12}"
          # Idempotent: a later deploy finds the tag already on this digest. Moving or re-adding an existing tag needs
          # artifactregistry.tags.delete, which the deploy account doesn't hold (and shouldn't). Only "not found" means
          # the tag is missing; any other describe error stops the run and shows its own message.
          if current=$(gcloud artifacts docker images describe "$IMAGE:$tag" \
              --format='value(image_summary.digest)' --quiet 2>describe.err); then
            if [ "$current" = "$digest" ]; then
              echo "$tag already points at $digest: nothing to do."
            else
              echo "::error::$tag points at $current, not $digest. Moving a tag needs a person (the deploy account can't delete tags)."
              exit 1
            fi
          elif grep -qiE 'not found|NOT_FOUND' describe.err; then
            gcloud artifacts docker tags add "$usage" "$IMAGE:$tag" --quiet
          else
            cat describe.err >&2
            echo "::error::Couldn't read $tag's digest (above). Not tagging blind."
            exit 1
          fi

  # The admin (admin.registry.coffee) runs the same image as its own service: the same digest, after the app.
  deploy-admin:
    needs: deploy
    if: vars.GCP_ADMIN_SERVICE != '' && needs.deploy.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: {group: deploy-admin-main, cancel-in-progress: false, queue: max}
    environment: {name: admin, url: "https://admin.registry.coffee"}
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      APP: ${{ vars.GCP_SERVICE || 'registry-coffee' }}
      IMAGE_REF: ${{ needs.deploy.outputs.image }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}  # the commit the deploy job built
    steps:
      # Before auth, whose credentials file a later checkout would delete (the auth action's README).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      # The admin follows the app, not main's tip: it deploys only while the app's traffic is all on the revision
      # this run made live. If a later run has made a newer one live, that run's admin job deploys it, and an older
      # image never replaces it, however approvals for the `admin` environment come in. A hold counts as still
      # serving it (a later deploy failed its smoke test and left the app here), so the admin catches up; a person's
      # pin (a rollback) doesn't, and the admin is left where it is too (live_smoke.app_serves).
      - name: Does the app still serve this run's revision?
        id: tip
        env:
          REVISION: ${{ needs.deploy.outputs.revision }}
          PYTHONPATH: src
        run: python3 -m coffeedata.live_smoke app-serves "$APP" --region "$REGION" --revision "$REVISION"
      # The image's CMD starts the app; the admin's entrypoint is set here with the image (Terraform's first apply
      # runs Google's sample image with no command, and leaves both to this step).
      # --args="..." in one word: the value starts with "-c", and only the = form never reads it as another flag.
      # As for the app: no traffic until its sign-in page answers at this run's tag, then admin.registry.coffee's.
      - name: Deploy
        if: steps.tip.outputs.current == 'true'
        env:
          SERVICE: ${{ vars.GCP_ADMIN_SERVICE }}
          ADMIN_ARGS: -c,exec uvicorn --factory admin.main:create_app --host 0.0.0.0 --port "$PORT" --no-proxy-headers
          TAG: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONPATH: src
        run: |
          python3 -m coffeedata.live_smoke rollout admin "$SERVICE" --region "$REGION" --tag "$TAG" \
            --live https://admin.registry.coffee -- --image "$IMAGE_REF" --command sh --args="$ADMIN_ARGS"

  # The ingestion jobs' image (ingest.Dockerfile), built from the same commit and under the same conditions as the
  # app's: it runs only when the deploy job pushed the app's image for this commit, so only for main's tip once ci
  # passed (or a forced manual run), and never for a pull request or a fork. It doesn't wait for the app's rollout
  # to succeed: the image depends on the commit, not on the app (`!cancelled()`, as for `attest`). It still runs
  # after the deploy job, not beside it, because that job holds the checks it relies on (is this main's tip, did ci
  # pass); a second copy of them here could drift. It is pushed beside the app's image, in the
  # same repository (<repository>/ingest, where the deploy identity can already push), tagged with the commit.
  # **It deploys nothing.** The Cloud Run jobs run the digest Terraform pins (`ingest_image`), and the owner applies
  # that by hand (docs/ingestion/RUNBOOK.md §1 and §4, which read this image's digest by its commit tag). No moving
  # tag such as `latest` is pushed. A failure here fails the run but changes neither the app nor the admin.
  # It signs the image's build provenance itself, as its last step, after the push (so the signing action runs in a
  # job already signed in to Google Cloud as the deploy account; RUNBOOK.md §1's check names this file as the
  # signer). If that step fails the image is in the registry without provenance, and RUNBOOK.md §1's script refuses
  # it: "Re-run failed jobs" builds, pushes and signs it again.
  ingest-image:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation, and the signing certificate (Sigstore)
      attestations: write  # store the attestation
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}  # the commit the deploy job built
      APP_IMAGE: ${{ vars.GCP_IMAGE }}  # <repository>/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      # Before any sign-in: build the image and run it, with no network and no secrets. This catches an image
      # whose CLI can't start, whose lockfile lost a package the jobs import, or that lacks DuckDB's httpfs; it
      # doesn't prove a crawl or a build works. BuildKit, so ingest.Dockerfile.dockerignore applies.
      # --provenance=false: one plain image per push, not an index with BuildKit's own attestation beside it, so
      # the registry's "5 most recent" counts commits. The provenance that counts is the signed one below.
      - name: Build, and check the image starts
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          image="${APP_IMAGE%/*}/ingest"
          docker build -f ingest.Dockerfile --provenance=false --build-arg GIT_SHA="$HEAD_SHA" \
            -t "$image:$HEAD_SHA" .
          docker run --rm --network none "$image:$HEAD_SHA" --help > /dev/null  # the image's default command
          docker run --rm --network none "$image:$HEAD_SHA" build --help > /dev/null
          docker run --rm --network none --entrypoint python "$image:$HEAD_SHA" -c \
            'import dbt, duckdb, coffeedata.quality; duckdb.sql("LOAD httpfs")'
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - name: Push
        id: push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$HEAD_SHA"
          # The registry's digest for what was just pushed: the tag can move, the digest can't.
          ref=$(docker inspect --format '{{join .RepoDigests "\n"}}' "$IMAGE:$HEAD_SHA" |
            awk -v p="$IMAGE@sha256:" 'index($0, p) == 1 {print; exit}')
          if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No registry digest for $IMAGE:$HEAD_SHA after the push."
            exit 1
          fi
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$ref\` (not deployed: pin it in Terraform, RUNBOOK.md §4)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:  # no predicate: SLSA build provenance
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}

  # Signed build provenance (SLSA) for the app's image: which workflow run and commit made the digest the deploy job
  # pushed. It is stored with the repository's attestations, not in the registry; check an image with the command in
  # docs/app/RUNNING.md (its signer is attest.yml; images signed before that file existed name deploy.yml).
  # - A job of its own, beside deploy-admin, so it can't hold back the app's or the admin's deploy. It can turn the
  #   run red after production has been updated (Sigstore or GitHub's attestations API down): "Re-run failed jobs"
  #   signs the same digest again and deploys nothing (docs/app/RUNNING.md, "A red run after a deploy").
  # - It runs whenever the deploy job pushed an image, even if the deploy step then failed, so every pushed image
  #   has provenance (one may be deployed by hand later).
  # - Its steps are in attest.yml, a reusable workflow, so once the owner has applied deploy.tf's provider change its
  #   `id-token: write` (the signing certificate) can't sign in to Google Cloud: that condition accepts only jobs
  #   written in this file, by the token's job_workflow_ref (until the apply, the old condition reads only
  #   workflow_ref, which is this file for attest too). It is still this run, so the attestation names this run and
  #   commit, and its build config is this file (RUNNING.md's check pins both).
  attest:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.image != '' }}
    permissions:
      id-token: write  # the signing certificate (Sigstore), in attest.yml
      attestations: write  # store the attestation
    uses: ./.github/workflows/attest.yml
    with:
      image: ${{ needs.deploy.outputs.image }}  # <GCP_IMAGE>@sha256:<digest>
