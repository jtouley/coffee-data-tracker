# Build the app's image and deploy it to Cloud Run once ci has passed on a push to main. Pull requests only build
# the image and check the Terraform. Authentication is Workload Identity Federation (no keys); the variables come
# from `terraform output` (docs/app/RUNNING.md). Until they're set, the deploy jobs are skipped.
# The image carries the commit it was built from (--build-arg GIT_SHA: lineage.git_sha), once app/Dockerfile reads
# it (#124); until then Docker ignores the argument.
#
# - Main deploys start on workflow_run, when ci completes, and only if it succeeded on a push. That event has no path
#   filter, so a docs-only merge deploys too: the same app, rebuilt and restarted. A filter on the one commit that
#   triggered the run would miss app changes in an earlier commit whose own deploy was skipped (next point).
# - A run deploys only main's tip: ci runs for two quick pushes can finish out of order, and the older commit must
#   not replace the newer one in production. Deploys run one at a time and every waiting one keeps its place
#   (`queue: max`): with GitHub's default, a late older commit's job would replace the tip's and then skip itself.
# - workflow_dispatch from main deploys main's tip (a redeploy, or the first deploy once the variables are set), but
#   only if ci passed on it: a manual redeploy is most wanted when the tip is red. `force` deploys it anyway.
# - The image goes out by digest: to the app, then to the admin service once GCP_ADMIN_SERVICE is set, only while
#   the app still runs that image (so the two never stay on different ones). A required reviewer for the admin can
#   be added to the `admin` environment in the repository's settings.
# - A deploy while the app's traffic is pinned to an older revision (RUNNING.md, Rolling back) gets 0% of the
#   traffic: the run says so with a warning.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    paths: ["app/**", "admin/**", "src/**", "pyproject.toml", "uv.lock", "src/terraform/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy main's tip even if ci didn't pass on it"
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to a pull request cancels its older check. Other runs get a group of their own here, and only the
# deploy jobs queue (deploy-main, deploy-admin-main), so a run whose jobs skip (after a red ci, say) displaces none.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: Build the image
        run: docker build -f app/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t registry-coffee:check .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with: {terraform_version: "1.9.8"}
      - name: Check the Terraform
        working-directory: src/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    # A green ci run on a push to main in this repository (a fork's pull request from its own branch named main
    # matches `branches` too, hence the event and repository checks), or a manual run from main.
    if: >-
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_IMAGE != '' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: deploy-main, cancel-in-progress: false, queue: max}
    permissions:
      contents: read
      actions: read  # ci's runs, for a manual deploy
      id-token: write  # for Workload Identity Federation
    outputs:
      image: ${{ steps.push.outputs.image }}  # <GCP_IMAGE>@sha256:<digest>; empty when the run skipped
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.GCP_SERVICE || 'registry-coffee' }}
      # workflow_run's github.sha is main's tip when the event fired, not the commit ci passed.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Inside the deploy-main queue, so a newer commit's deploy can't slip in between this check and the deploy.
      - name: Is this commit still main's tip?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.force }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::Not deploying $HEAD_SHA: main has moved on to $tip, whose own run deploys it."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MANUAL" = "true" ]; then  # workflow_run already requires ci's success
            ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "none" elif .status != "completed" then "running" else .conclusion end')
            if [ "$ci" = "running" ]; then
              echo "::error::ci on $HEAD_SHA hasn't finished yet. Wait for it (its success deploys this commit anyway), or run this again with force."
              exit 1
            elif [ "$ci" != "success" ]; then
              echo "::error::ci on $HEAD_SHA is '$ci', not success. Fix main, or run this again with force to deploy it anyway."
              exit 1
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - if: steps.tip.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - if: steps.tip.outputs.current == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - if: steps.tip.outputs.current == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - name: Build and push
        id: push
        if: steps.tip.outputs.current == 'true'
        env:
          IMAGE: ${{ vars.GCP_IMAGE }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f app/Dockerfile --build-arg GIT_SHA="$HEAD_SHA" -t "$IMAGE:$HEAD_SHA" .
          docker push "$IMAGE:$HEAD_SHA"
          # The registry's digest for what was just pushed: the tag can move, the digest can't.
          ref=$(docker inspect --format '{{join .RepoDigests "\n"}}' "$IMAGE:$HEAD_SHA" |
            awk -v p="$IMAGE@sha256:" 'index($0, p) == 1 {print; exit}')
          if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No registry digest for $IMAGE:$HEAD_SHA after the push."
            exit 1
          fi
          echo "image=$ref" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.tip.outputs.current == 'true'
        env:
          IMAGE_REF: ${{ steps.push.outputs.image }}
        run: |
          set -o pipefail
          gcloud run deploy "$SERVICE" --image "$IMAGE_REF" --region "$REGION" --quiet
          # Pinned traffic stays pinned: this revision then gets 0%, and nothing else would say so.
          latest=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
            jq '[.spec.traffic[]? | select(.latestRevision == true) | .percent // 0] | add // 0') || latest=""
          if ! [[ "$latest" =~ ^[0-9]+$ ]]; then
            echo "::warning::Couldn't read $SERVICE's traffic split after the deploy; check it with gcloud run services describe."
          elif [ "$latest" != "100" ]; then
            echo "::warning::$SERVICE's traffic is pinned (${latest}% to the newest revision), so this deploy serves no one. After a rollback, move it back: RUNNING.md, Rolling back."
          fi

  # The admin (admin.registry.coffee) runs the same image as its own service: the same digest, after the app.
  deploy-admin:
    needs: deploy
    if: vars.GCP_ADMIN_SERVICE != '' && needs.deploy.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: {group: deploy-admin-main, cancel-in-progress: false, queue: max}
    environment: {name: admin, url: "https://admin.registry.coffee"}
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      APP: ${{ vars.GCP_SERVICE || 'registry-coffee' }}
      IMAGE_REF: ${{ needs.deploy.outputs.image }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      # The admin follows the app, not main's tip: if the app has a newer image now (a later run deployed it), that
      # run's admin job deploys it, and an older image never replaces it, however approvals for the `admin`
      # environment come in. While the app still runs this image (main moved on, but its ci failed), the admin
      # gets it too, so the two never stay on different images. While the app's traffic is pinned to an older
      # revision (a rollback), the newest revision serves no one, so the admin is left where it is too.
      - name: Does the app still run this image?
        id: tip
        run: |
          set -o pipefail
          svc=$(gcloud run services describe "$APP" --region "$REGION" --format=json)
          app=$(jq -r '.spec.template.spec.containers[0].image' <<< "$svc")
          latest=$(jq '[.spec.traffic[]? | select(.latestRevision == true) | .percent // 0] | add // 0' <<< "$svc")
          if [ "$latest" != "100" ]; then
            echo "::warning::Not deploying $IMAGE_REF to the admin: the app's traffic is pinned (${latest}% to its newest revision). Roll the admin back or forward with the app: RUNNING.md, Rolling back."
            echo "current=false" >> "$GITHUB_OUTPUT"
          elif [ "$app" = "$IMAGE_REF" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying $IMAGE_REF to the admin: the app runs $app now, and its own run deploys that."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.tip.outputs.current == 'true'
        env:
          SERVICE: ${{ vars.GCP_ADMIN_SERVICE }}
        run: gcloud run deploy "$SERVICE" --image "$IMAGE_REF" --region "$REGION" --quiet

  # Signed build provenance (SLSA) for the image the deploy job built and pushed: which workflow run and commit made
  # this digest. It is stored with the repository's attestations, not in the registry; check an image with
  #   gh attestation verify oci://<image>@sha256:<digest> --repo jtouley/coffee-data-tracker
  # A job of its own, after the deploy and beside deploy-admin, so a failure here never holds back or fails a
  # deploy, and the deploy jobs don't get `attestations: write`. It doesn't sign in to Google Cloud: `id-token` here
  # is for the signing certificate. The ingestion image is built by Cloud Build (docs/ingestion/RUNBOOK.md), not by
  # a workflow, so it has no attestation from here.
  attest:
    needs: deploy
    if: needs.deploy.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # the signing certificate (Sigstore)
      attestations: write  # store the attestation
    env:
      IMAGE_REF: ${{ needs.deploy.outputs.image }}  # <GCP_IMAGE>@sha256:<digest>
    steps:
      - name: Split the image reference
        id: ref
        run: |
          if ! [[ "$IMAGE_REF" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Not an image reference with a digest: $IMAGE_REF"
            exit 1
          fi
          echo "name=${IMAGE_REF%@*}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_REF#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.name }}
          subject-digest: ${{ steps.ref.outputs.digest }}
