# The Terraform plan, on pull requests that touch the infrastructure and on main: init, validate, plan, the guards
# (scripts/tf_plan_guard.py), then one PR comment, updated in place, listing the guard verdicts and the resource
# addresses that change with their actions. Read-only: it never applies. The apply is a separate workflow behind
# the terraform-apply environment's approval. docs/ingestion/RUNBOOK.md section 9 says how to read the comment.
#
# - Signs in as the read-only plan identity (repository variables GCP_TF_PLAN_PROVIDER and GCP_TF_PLAN_SA). Until
#   both are set, the plan is skipped with a notice. A pull request from a fork never signs in: it gets no
#   OIDC token or secrets anyway, and deploy.yml's check job still runs fmt and validate on it.
# - This repository is public, and a plan holds every variable in clear. Nothing from the plan is printed or
#   uploaded: plan output is discarded, a failed plan shows only its error headlines, the plan file and its JSON
#   stay in the runner's temp folder and are deleted, and the comment is the guard script's `render`, which prints
#   addresses and actions only and fails closed (no comment text at all) if it can't scrub them.
# - The PR's plan is advisory: `-lock=false`, and the plan that gets applied is the one made on main.
# - One plan at a time per pull request: a newer push cancels the older run. Runs on main queue.
name: terraform-plan
on:
  pull_request:
    paths: ["src/terraform/**", "scripts/tf_plan_guard.py", ".github/workflows/terraform-plan.yml"]
  push:
    branches: [main]
    paths: ["src/terraform/**", "scripts/tf_plan_guard.py", ".github/workflows/terraform-plan.yml"]
permissions: {}
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Sign in, or skip?
        id: gate
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PROVIDER: ${{ vars.GCP_TF_PLAN_PROVIDER }}
          SA: ${{ vars.GCP_TF_PLAN_SA }}
        run: |
          if [ "$FORK" = "true" ]; then
            echo "::notice::Pull request from a fork: no sign-in and no plan. deploy.yml's check job runs fmt and validate."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$PROVIDER" ] || [ -z "$SA" ]; then
            echo "::notice::No plan: set the GCP_TF_PLAN_PROVIDER and GCP_TF_PLAN_SA repository variables (the read-only plan identity) first."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation, as the read-only plan identity
    outputs:
      comment: ${{ steps.render.outputs.comment }}  # base64 of the scrubbed Markdown; empty if it couldn't be made
      guards: ${{ steps.guards.outputs.result }}  # pass, fail or error
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false  # the wrapper copies stdout into step outputs and the log
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_TF_PLAN_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - name: Format, init, validate
        working-directory: src/terraform
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET || 'coffee-data-tracker-tfstate' }}
        run: |
          terraform fmt -check -recursive
          terraform init -input=false -lockfile=readonly -no-color -backend-config="bucket=$BUCKET"
          terraform validate -no-color
      - name: Plan
        working-directory: src/terraform
        env:
          TF_VAR_billing_account: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
          TF_VAR_owner_email: ${{ secrets.TF_VAR_OWNER_EMAIL }}
        run: |
          if [ -z "$TF_VAR_billing_account" ] || [ -z "$TF_VAR_owner_email" ]; then
            echo "::error::Set the TF_VAR_BILLING_ACCOUNT and TF_VAR_OWNER_EMAIL repository secrets: the plan needs both."
            exit 1
          fi
          # stdout is discarded: it would print attribute values. A failure shows only its "Error:" headlines, with
          # any IPv4 address masked; the details below a headline can quote values, so they stay hidden.
          if ! terraform plan -input=false -lock=false -no-color -out="$RUNNER_TEMP/tfplan" \
              >/dev/null 2>"$RUNNER_TEMP/plan.err"; then
            echo "::error::terraform plan failed. Only the error headlines are shown; run the plan in a shell for the details."
            { grep -E '^(│ )?Error: ' "$RUNNER_TEMP/plan.err" || true; } | sed -E 's/^│ //; s/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g' | cut -c1-200
            rm -f "$RUNNER_TEMP/plan.err" "$RUNNER_TEMP/tfplan"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/plan.err"
          terraform show -json -no-color "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          rm -f "$RUNNER_TEMP/tfplan"
      - name: Change list (scrubbed)
        id: render
        run: |
          python3 -I scripts/tf_plan_guard.py render "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan.md"
          cat "$RUNNER_TEMP/plan.md" >> "$GITHUB_STEP_SUMMARY"
          echo "comment=$(base64 -w0 "$RUNNER_TEMP/plan.md")" >> "$GITHUB_OUTPUT"
      - name: Guards
        id: guards
        run: |
          rc=0
          python3 -I scripts/tf_plan_guard.py check "$RUNNER_TEMP/plan.json" || rc=$?
          case "$rc" in 0) result=pass ;; 1) result=fail ;; *) result=error ;; esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::The plan breaks a guard (above). The apply would refuse it: change the PR, or make the change by hand as RUNBOOK section 9 says."
            exit 1
          fi
      - name: Delete the plan
        if: always()
        run: rm -f "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/plan.md" "$RUNNER_TEMP/tfplan" "$RUNNER_TEMP/plan.err"

  comment:
    # Runs no Terraform and holds no cloud identity: it only posts what the plan job rendered. It also runs when the
    # plan failed, so an older green comment never stays up over a red run.
    needs: plan
    if: always() && github.event_name == 'pull_request' && (needs.plan.result == 'success' || needs.plan.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_B64: ${{ needs.plan.outputs.comment }}
          GUARDS: ${{ needs.plan.outputs.guards }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- terraform-plan -->'
          body="$RUNNER_TEMP/body.md"
          {
            echo "$marker"
            echo "## Terraform plan"
            echo
            echo "Commit $HEAD_SHA, [run]($RUN_URL). Guards: **${GUARDS:-not run}**. Advisory: the plan that is applied is made again on main and approved there."
            echo
            if [ -n "$COMMENT_B64" ]; then
              base64 -d <<< "$COMMENT_B64"
            else
              echo "No change list: the plan or its scrubbing failed ($PLAN_RESULT). Nothing from the plan is shown; see the run."
            fi
          } > "$body"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" >/dev/null
          fi
