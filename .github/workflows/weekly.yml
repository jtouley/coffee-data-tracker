# The manual fallback. The scheduled weekly crawl now runs on Cloud Run (docs/ingestion/RUNBOOK.md, and
# src/terraform/ingestion.tf), and site.yml deploys the site, the public export and the Snowflake load each Tuesday
# at 11:17 UTC. This workflow has no schedule: it runs only when dispatched, for one week as a fallback, and its crawl
# is removed after one good week on Cloud Run (RUNBOOK.md §4).
#
# The weekly run: discover (first week of the month), probe stale roasters, fetch every catalog, enrich,
# build, publish to the lake, deploy the site. Nothing is committed to git; data lives in the lake.
name: weekly
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Only N roasters (blank = all)"
        required: false
      run_date:
        description: "Run date YYYY-MM-DD (blank = today, UTC). To resume a week, give its Monday"
        required: false
      rollback_to:
        description: "Instead of a weekly run: serve an earlier release ('previous', or a build id from build-diff); 'served' re-exports the current one"
        required: false
      snowflake_migrate:
        description: "After a public contract change: migrate Snowflake (alone: no crawl, re-exports the served release)"
        type: boolean
        default: false
      accept_volume_change:
        description: "Let this run through the catalog volume check (after reviewing `coffeedata build-diff`)"
        type: boolean
        default: false
# The run job handles the secrets and third-party pages, so it gets read-only access; only deploy can publish.
permissions:
  contents: read
concurrency:
  group: lake
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # The site deploys whenever this job built it, even if a later step (Snowflake) fails; a run whose release
    # failed its checks builds no site, so the served one stays up.
    outputs:
      site: ${{ steps.site.outputs.built }}
      smoke: ${{ steps.expect.outputs.site }}
    # Secrets are set on the steps that run the coffeedata command needing them, never here: job-level env is in
    # scope for every step, setup-uv and uv sync included (tests/test_workflow_secrets.py).
    env:
      COFFEEDATA_LAKE: ${{ vars.LAKE_URL }}          # e.g. hf://datasets/<you>/coffee-data
      # Claude's coffee-or-not verdicts are required: without VERDICT_MODEL and the Anthropic key the run fails at
      # its start (coffeedata weekly), before crawling. There is no rules-only opt-out here: this run publishes
      # to a remote lake, where coffeedata refuses it (docs/ingestion/RUNBOOK.md, verdicts).
      COFFEEDATA_VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}
      # Optional: facts-only public export (marketplace/README.md), e.g. hf://datasets/<you>/us-coffee-market
      # or s3://<bucket>/coffee-data/ (then also set AWS credentials as secrets).
      PUBLIC_EXPORT_URL: ${{ vars.PUBLIC_EXPORT_URL }}
      SITE_URL: ${{ vars.SITE_URL }}                 # canonical URL of the site; unset = https://registry.coffee
      APP_URL: ${{ vars.APP_URL }}                   # the app the site's Sign in links point to; unset = https://app.registry.coffee
      GOVERNING_STATE: ${{ vars.GOVERNING_STATE }}   # US state named in the Terms of Use; unset = Michigan
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}       # contact on the legal pages; unset = support@registry.coffee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: {python-version: "3.12"}
      - run: uv sync --locked --extra snowflake
      - name: Check lake config
        run: test -n "$COFFEEDATA_LAKE" || { echo "Set the LAKE_URL repository variable (see docs/USAGE.md, Run it on GitHub)"; exit 1; }
      - name: Weekly run
        env:
          # The lake, the Claude verdicts and an s3:// public export (Snowflake has its own step below).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COFFEEDATA_ANTHROPIC_API_KEY: ${{ secrets.COFFEEDATA_ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SAMPLE: ${{ inputs.sample }}  # passed via env, never interpolated into the script
          RUN_DATE: ${{ inputs.run_date }}  # validated by the CLI's --run-date
          ACCEPT_VOLUME_CHANGE: ${{ inputs.accept_volume_change && '1' || '' }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          MIGRATE: ${{ inputs.snowflake_migrate && '1' || '' }}
        run: |
          # snowflake_migrate on its own re-exports the served release for the Snowflake step, without a crawl.
          if [ -n "$MIGRATE" ] && [ -z "$ROLLBACK_TO" ]; then
            if [ -n "$SAMPLE$ACCEPT_VOLUME_CHANGE$RUN_DATE" ]; then
              echo "snowflake_migrate runs no crawl, so sample, run_date and accept_volume_change would be ignored: unset them"
              exit 1
            fi
            ROLLBACK_TO=served
          fi
          if [ "$ROLLBACK_TO" = served ]; then
            uv run coffeedata rollback --to served --reason "re-export for Snowflake migration ($GITHUB_ACTOR)"
          elif [ -n "$ROLLBACK_TO" ]; then
            if [ "$ROLLBACK_TO" = previous ]; then uv run coffeedata rollback --reason "manual rollback ($GITHUB_ACTOR)"
            else uv run coffeedata rollback --to "$ROLLBACK_TO" --reason "manual rollback ($GITHUB_ACTOR)"; fi
          else
            uv run coffeedata weekly ${SAMPLE:+--sample "$SAMPLE"} ${RUN_DATE:+--run-date "$RUN_DATE"} \
              ${ACCEPT_VOLUME_CHANGE:+--accept-volume-change}
          fi
      - name: Site built
        id: site
        run: test -f build/site/index.html && echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        # include-hidden-files: v5 leaves out dot folders by default, and the site has /.well-known/security.txt.
        with: {path: build/site, include-hidden-files: true}
      # What the live site must serve once this build is deployed (the smoke job checks it). After the upload, and
      # continue-on-error, so a failure here holds back neither the deploy nor the steps below; the output is then
      # empty, and the smoke job fails on it (a build that can't be read is the broken site it looks for).
      - name: Note what the smoke test expects
        id: expect
        if: steps.site.outputs.built == 'true'
        env:
          PYTHONPATH: src
        continue-on-error: true
        run: |
          expect=$(python3 -m coffeedata.live_smoke expect-site build/site)
          echo "site=$expect" >> "$GITHUB_OUTPUT"
      # Last, so a Snowflake problem (a contract change needing --migrate) turns the run red without holding back
      # the site. It loads the export of the served release that the weekly run just wrote to build/public.
      - name: Load Snowflake
        if: vars.SNOWFLAKE_ACCOUNT != ''
        timeout-minutes: 30  # the deploy job waits for this one, so a hung load mustn't hold the site for hours
        env:
          # Optional: load the public tables into Snowflake each week (marketplace/snowflake/README.md).
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          MIGRATE: ${{ inputs.snowflake_migrate && '1' || '' }}
        run: uv run coffeedata load-snowflake ${MIGRATE:+--migrate}
  deploy:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  # The live site, once Pages has it (src/coffeedata/live_smoke.py): the home, catalog and privacy pages, the
  # catalog download and the 404, each by its status and by something only this build has (its titles, data key,
  # release and one coffee, from the built folder). Pages has no traffic to move, so a failure fails the run and the
  # summary says how to put the previous site back (runbook/github-pages.md, "When the smoke test fails"). Its own
  # job: it reads public pages only, so it holds no Pages or id token.
  smoke:
    needs: [run, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.run.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - name: Smoke-test the live site
        env:
          SITE: ${{ vars.SITE_URL || 'https://registry.coffee' }}
          EXPECT: ${{ needs.run.outputs.smoke }}
          NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONPATH: src
        run: python3 -m coffeedata.live_smoke check site "$SITE" --expect "$EXPECT" --nonce "$NONCE"
