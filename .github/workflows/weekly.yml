# The weekly run: discover (first week of the month), probe stale roasters, fetch every catalog, enrich,
# build, publish to the lake, deploy the site. Nothing is committed to git; data lives in the lake.
name: weekly
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays
  workflow_dispatch:
    inputs:
      sample:
        description: "Only N roasters (blank = all)"
        required: false
      rollback_to:
        description: "Instead of a weekly run: serve an earlier release ('previous', or a build id from build-diff)"
        required: false
      snowflake_migrate:
        description: "After a public contract change: recreate the changed Snowflake tables and share views"
        type: boolean
        default: false
      accept_volume_change:
        description: "Let this run through the catalog volume check (after reviewing `coffeedata build-diff`)"
        type: boolean
        default: false
# The run job handles the secrets and third-party pages, so it gets read-only access; only deploy can publish.
permissions:
  contents: read
concurrency:
  group: lake
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # The site deploys whenever this job built it, even if a later step (Snowflake) fails; a run whose release
    # failed its checks builds no site, so the served one stays up.
    outputs:
      site: ${{ steps.site.outputs.built }}
    env:
      COFFEEDATA_LAKE: ${{ vars.LAKE_URL }}          # e.g. hf://datasets/<you>/coffee-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      COFFEEDATA_ANTHROPIC_API_KEY: ${{ secrets.COFFEEDATA_ANTHROPIC_API_KEY }}
      COFFEEDATA_VERDICT_MODEL: ${{ vars.VERDICT_MODEL }}  # Claude model for coffee-or-not verdicts; unset = rules only
      # Optional: facts-only public export (marketplace/README.md), e.g. hf://datasets/<you>/us-coffee-market
      # or s3://<bucket>/coffee-data/ (then also set AWS credentials as secrets).
      PUBLIC_EXPORT_URL: ${{ vars.PUBLIC_EXPORT_URL }}
      SITE_URL: ${{ vars.SITE_URL }}                 # canonical URL of the site; unset = https://registry.coffee
      GOVERNING_STATE: ${{ vars.GOVERNING_STATE }}   # US state named in the Terms of Use; unset = Michigan
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}       # contact on the legal pages; unset = support@registry.coffee
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Optional: load the public tables into Snowflake each week (marketplace/snowflake/README.md).
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with: {python-version: "3.12"}
      - run: uv sync --locked --extra snowflake
      - name: Check lake config
        run: test -n "$COFFEEDATA_LAKE" || { echo "Set the LAKE_URL repository variable (see README)"; exit 1; }
      - name: Weekly run
        env:
          SAMPLE: ${{ inputs.sample }}  # passed via env, never interpolated into the script
          ACCEPT_VOLUME_CHANGE: ${{ inputs.accept_volume_change && '1' || '' }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          if [ -n "$ROLLBACK_TO" ]; then
            if [ "$ROLLBACK_TO" = previous ]; then uv run coffeedata rollback --reason "manual rollback ($GITHUB_ACTOR)"
            else uv run coffeedata rollback --to "$ROLLBACK_TO" --reason "manual rollback ($GITHUB_ACTOR)"; fi
          else
            uv run coffeedata weekly ${SAMPLE:+--sample "$SAMPLE"} ${ACCEPT_VOLUME_CHANGE:+--accept-volume-change}
          fi
      - name: Site built
        id: site
        run: test -f build/site/index.html && echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with: {path: build/site}
      # Last, so a Snowflake problem (a contract change needing --migrate) turns the run red without holding back
      # the site. It loads the export of the served release that the weekly run just wrote to build/public.
      - name: Load Snowflake
        if: env.SNOWFLAKE_ACCOUNT != ''
        env:
          MIGRATE: ${{ inputs.snowflake_migrate && '1' || '' }}
        run: uv run coffeedata load-snowflake ${MIGRATE:+--migrate}
  deploy:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
