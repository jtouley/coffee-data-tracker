# Log a shot or add/opt out a roaster from your phone via GitHub issue forms. Only the repo owner's issues are
# processed. Results go to the lake (one new file each); nothing is committed to git.
name: issue-forms
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
concurrency:
  group: lake
  cancel-in-progress: false
jobs:
  handle:
    if: github.actor == github.repository_owner && (contains(github.event.issue.labels.*.name, 'shot') || contains(github.event.issue.labels.*.name, 'roaster'))
    runs-on: ubuntu-latest
    env:
      COFFEEDATA_LAKE: ${{ vars.LAKE_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with: {python-version: "3.12"}
      - run: uv sync --locked
      - name: Process issue
        id: run
        env:
          BODY: ${{ github.event.issue.body }}
          KIND: ${{ contains(github.event.issue.labels.*.name, 'shot') && 'shot' || 'roaster' }}
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          if [ "$KIND" = shot ]; then cmd="uv run coffeedata shot from-issue --file /tmp/body.md"
          else cmd="uv run coffeedata add-roaster --file /tmp/body.md"; fi
          if $cmd > /tmp/reply.md 2> /tmp/err.txt; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else { echo "Couldn't process this:"; echo; echo '```'; tail -5 /tmp/err.txt; echo '```'; } > /tmp/reply.md; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Reply
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file /tmp/reply.md
          if [ "${{ steps.run.outputs.ok }}" = true ]; then gh issue close "$N" --repo "$GITHUB_REPOSITORY"; fi
