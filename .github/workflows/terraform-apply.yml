# Apply src/terraform/ from main, only after the owner's second account approves it (docs/app/RUNNING.md, "Changing
# the infrastructure").
#
# - `plan` (read-only account): plans main, runs the guard (scripts/tf_plan_guard.py), writes the list of changes to
#   the run's summary, and saves the plan file to the private plans bucket with its SHA-256. No changes: the run ends.
# - `apply` (write account) runs in the `terraform-apply` environment, so GitHub holds it until `jtouleyrou` approves.
#   It then checks the environment's protection and the approval, refuses a plan that is stale (older than a day,
#   superseded by a newer commit, or made before the state changed), downloads that exact plan and checks its hash,
#   re-runs the guard, and applies the saved plan. Never a fresh one.
# - The apply account's Workload Identity condition (src/terraform/bootstrap/main.tf) accepts only this file, on main,
#   in a job of the `terraform-apply` environment: no other workflow, branch or job can apply.
#
# The repository is public. A plan file and its JSON hold every variable in clear, so they stay on the runner and in
# the private bucket; nothing Terraform prints reaches the log except error headings and the final count.
name: terraform-apply
on:
  push:
    branches: [main]
    paths:
      - "src/terraform/**"
      - "!src/terraform/bootstrap/**"  # applied by the owner only, from Cloud Shell
      - "scripts/tf_plan_guard.py"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:
permissions: {}
# One at a time, and never cancelled: a run waiting for its approval holds the group. Terraform's state lock also
# covers the owner's shell.
concurrency:
  group: terraform-apply
  cancel-in-progress: false
env:
  TF_ROOT: src/terraform
  TF_IN_AUTOMATION: "1"
  TF_STATE_PREFIX: registry-coffee  # the main root's backend prefix (provider.tf)
  ENVIRONMENT: terraform-apply
  APPROVER: jtouleyrou
jobs:
  plan:
    if: github.repository == 'jtouley/coffee-data-tracker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation, the plan account
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      planned_at: ${{ steps.plan.outputs.planned_at }}
      state_generation: ${{ steps.state.outputs.generation }}
      object: ${{ steps.save.outputs.object }}
      generation: ${{ steps.save.outputs.generation }}
      sha256: ${{ steps.save.outputs.sha256 }}
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_PLANS_BUCKET: ${{ vars.TF_PLANS_BUCKET }}
      # The two values that aren't in src/terraform/ci.auto.tfvars. Never printed: the plan's output goes to a file.
      TF_VAR_billing_account: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
      TF_VAR_owner_email: ${{ secrets.TF_VAR_OWNER_EMAIL }}
    steps:
      - name: Settings present
        env:
          PROVIDER: ${{ vars.GCP_TF_PLAN_PROVIDER }}
          SA: ${{ vars.GCP_TF_PLAN_SA }}
        run: |
          missing=""
          for v in PROVIDER SA TF_STATE_BUCKET TF_PLANS_BUCKET TF_VAR_billing_account TF_VAR_owner_email; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing. Set the repository variables and secrets from the bootstrap (docs/app/RUNNING.md, \"Changing the infrastructure\")."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_TF_PLAN_PROVIDER }}
          service_account: ${{ vars.GCP_TF_PLAN_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false  # the wrapper copies stdout into step outputs
      - name: Init
        run: |
          if ! terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" > "$RUNNER_TEMP/init.log" 2>&1; then
            grep -E '^(│ )?Error: ' "$RUNNER_TEMP/init.log" | sort -u | head -20
            echo "::error::terraform init failed (error headings above)."
            exit 1
          fi
      # Before the plan: any state write after this point makes the apply job refuse the plan.
      - name: State version
        id: state
        run: |
          gen=$(gcloud storage objects describe "gs://$TF_STATE_BUCKET/$TF_STATE_PREFIX/default.tfstate" --format='value(generation)')
          [[ "$gen" =~ ^[0-9]+$ ]] || { echo "::error::Couldn't read the state's generation."; exit 1; }
          echo "generation=$gen" >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        run: |
          set +e
          terraform -chdir="$TF_ROOT" plan -input=false -lock=false -no-color -detailed-exitcode \
            -out="$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.log" 2>&1
          rc=$?
          set -e
          echo "planned_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          case $rc in
            0) echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes: nothing to approve." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            2) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) grep -E '^(│ )?Error: ' "$RUNNER_TEMP/plan.log" | sort -u | head -20
               echo "::error::terraform plan failed (error headings above; values are not printed)."
               exit 1 ;;
          esac
      - name: Guard and list the changes
        if: steps.plan.outputs.changed == 'true'
        run: |
          terraform -chdir="$TF_ROOT" show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          python3 -I scripts/tf_plan_guard.py check "$RUNNER_TEMP/plan.json"
          {
            echo "## Plan for ${GITHUB_SHA::12}, waiting for ${APPROVER}'s approval"
            python3 -I scripts/tf_plan_guard.py render "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
      # Create-only (ifGenerationMatch=0): the plan account can't read, list or overwrite a saved plan.
      - name: Save the plan
        id: save
        if: steps.plan.outputs.changed == 'true'
        run: |
          object="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfplan"
          sha=$(sha256sum "$RUNNER_TEMP/tfplan" | cut -d' ' -f1)
          token=$(gcloud auth print-access-token)
          echo "::add-mask::$token"
          resp=$(curl -fsS -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/octet-stream" \
            --data-binary @"$RUNNER_TEMP/tfplan" \
            "https://storage.googleapis.com/upload/storage/v1/b/$TF_PLANS_BUCKET/o?uploadType=media&ifGenerationMatch=0&name=$object")
          gen=$(jq -r '.generation' <<<"$resp")
          [[ "$gen" =~ ^[0-9]+$ ]] || { echo "::error::The upload returned no generation."; exit 1; }
          { echo "object=$object"; echo "generation=$gen"; echo "sha256=$sha"; } >> "$GITHUB_OUTPUT"
          echo "Saved plan: gs://$TF_PLANS_BUCKET/$object, generation $gen, sha256 $sha" | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: terraform-apply  # waits here for the approval
    permissions:
      contents: read
      actions: read    # the run's approvals; the environment's settings, where this token may read them
      id-token: write  # Workload Identity Federation, the apply account (its condition requires this environment)
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_PLANS_BUCKET: ${{ vars.TF_PLANS_BUCKET }}
      OBJECT: ${{ needs.plan.outputs.object }}
      GENERATION: ${{ needs.plan.outputs.generation }}
      SHA256: ${{ needs.plan.outputs.sha256 }}
      STATE_GENERATION: ${{ needs.plan.outputs.state_generation }}
      PLANNED_AT: ${{ needs.plan.outputs.planned_at }}
      GH_TOKEN: ${{ github.token }}
      # Not used: referenced so that the runner masks them in this job's log, should an error heading quote one.
      MASKED_BILLING_ACCOUNT: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
      MASKED_OWNER_EMAIL: ${{ secrets.TF_VAR_OWNER_EMAIL }}
    steps:
      - name: The environment's protection is as expected
        run: |
          fail() { echo "::error::The $ENVIRONMENT environment isn't protected as expected: $*. Fix it in Settings, Environments; nothing was applied."; exit 1; }
          if ! env_json=$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT" 2>/dev/null); then
            echo "::warning::This token can't read the environment's settings; checking the approval itself instead."
            exit 0
          fi
          jq -e '.can_admins_bypass == false' <<<"$env_json" >/dev/null || fail "administrators can bypass it"
          jq -e '.deployment_branch_policy.custom_branch_policies == true and .deployment_branch_policy.protected_branches == false' \
            <<<"$env_json" >/dev/null || fail "deployments aren't limited to selected branches"
          jq -e --arg who "$APPROVER" '[.protection_rules[] | select(.type == "required_reviewers")]
            | length == 1 and .[0].prevent_self_review == true
            and ([.[0].reviewers[] | "\(.type):\(.reviewer.login)"] == ["User:\($who)"])' <<<"$env_json" >/dev/null \
            || fail "the required reviewer isn't $APPROVER alone, with self-review prevented"
          if branches=$(gh api "repos/$GITHUB_REPOSITORY/environments/$ENVIRONMENT/deployment-branch-policies" \
               --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | sort | join(",")' 2>/dev/null); then
            [ "$branches" = "branch:main" ] || fail "its deployment branches are '$branches', not main only"
          else
            echo "::warning::This token can't read the environment's branch policies."
          fi
          echo "Protection as expected: reviewer $APPROVER, self-review prevented, main only, no admin bypass."
      - name: Approved by the second account
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          who=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" --jq \
            "[.[] | select(.state == \"approved\" and any(.environments[]; .name == \"$ENVIRONMENT\")) | .user.login] | unique | join(\",\")")
          case ",$who," in
            *",$APPROVER,"*) ;;
            *) echo "::error::No approval by $APPROVER on this run (approved by: '${who:-nobody}'). Nothing was applied."; exit 1 ;;
          esac
          [ "$ACTOR" != "$APPROVER" ] || { echo "::error::$APPROVER started this run and approved it. Nothing was applied."; exit 1; }
          echo "Approved by $APPROVER."
      - name: The plan is still the one to apply
        run: |
          age=$(( $(date -u +%s) - PLANNED_AT ))
          [ "$age" -le 86400 ] || { echo "::error::The plan is $((age / 3600)) hours old. Run the workflow again for a fresh plan. Nothing was applied."; exit 1; }
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            newer=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$tip" --jq '.files[].filename' \
              | grep -E '^(src/terraform/|scripts/tf_plan_guard\.py$|\.github/workflows/terraform-apply\.yml$)' \
              | grep -v '^src/terraform/bootstrap/' || true)
            if [ -n "$newer" ]; then
              echo "::error::main has moved to ${tip::12}, which changes the Terraform again; that commit's run owns the apply. Nothing was applied."
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_TF_APPLY_PROVIDER }}
          service_account: ${{ vars.GCP_TF_APPLY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      # The ingestion timing rules (docs/ingestion/RUNBOOK.md): crawls run on Monday, the release on Tuesday morning.
      - name: Not during the weekly run
        env:
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
        run: |
          dow=$(date -u +%u); hr=$(date -u +%H)
          [ "$dow" != 1 ] || { echo "::error::It's Monday (UTC): the crawls run today. Run the workflow again from Tuesday 12:00 UTC. Nothing was applied."; exit 1; }
          if [ "$dow" = 2 ] && [ "$hr" -lt 12 ]; then
            echo "::error::The Tuesday release runs until about 12:00 UTC. Run the workflow again after it. Nothing was applied."; exit 1
          fi
          # Fails closed: a job or execution list that can't be read stops the run.
          jobs=$(gcloud run jobs list --region "$REGION" --format='value(name)')
          for j in $jobs; do
            ends=$(gcloud run jobs executions list --job "$j" --region "$REGION" --limit 5 --format='csv[no-heading](name,status.completionTime)')
            # "<execution>," : no completion time, still running
            if grep -q ',$' <<<"$ends"; then
              echo "::error::$j has a running execution. Run the workflow again when it ends. Nothing was applied."; exit 1
            fi
          done
          echo "No job is running."
      - name: Init
        run: |
          if ! terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" > "$RUNNER_TEMP/init.log" 2>&1; then
            grep -E '^(│ )?Error: ' "$RUNNER_TEMP/init.log" | sort -u | head -20
            echo "::error::terraform init failed (error headings above). Nothing was applied."
            exit 1
          fi
      - name: Download the approved plan and check its hash
        run: |
          token=$(gcloud auth print-access-token)
          echo "::add-mask::$token"
          curl -fsS -o "$RUNNER_TEMP/tfplan" -H "Authorization: Bearer $token" \
            "https://storage.googleapis.com/storage/v1/b/$TF_PLANS_BUCKET/o/$OBJECT?alt=media&generation=$GENERATION"
          got=$(sha256sum "$RUNNER_TEMP/tfplan" | cut -d' ' -f1)
          [ "$got" = "$SHA256" ] || { echo "::error::The saved plan's SHA-256 is $got, not the $SHA256 the plan job recorded. Nothing was applied."; exit 1; }
          echo "Plan gs://$TF_PLANS_BUCKET/$OBJECT (generation $GENERATION), sha256 matches."
      - name: The state hasn't changed since the plan
        run: |
          gen=$(gcloud storage objects describe "gs://$TF_STATE_BUCKET/$TF_STATE_PREFIX/default.tfstate" --format='value(generation)')
          [ "$gen" = "$STATE_GENERATION" ] || { echo "::error::The state changed after this plan was made (generation $STATE_GENERATION, now $gen). Run the workflow again for a new plan. Nothing was applied."; exit 1; }
      - name: Guard the saved plan again
        run: |
          terraform -chdir="$TF_ROOT" show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          python3 -I scripts/tf_plan_guard.py check "$RUNNER_TEMP/plan.json"
      # The saved plan only. Terraform also refuses it if the state moved after it was made (a stale plan).
      - name: Apply
        run: |
          if terraform -chdir="$TF_ROOT" apply -input=false -no-color "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/apply.log" 2>&1; then
            grep -E '^Apply complete!' "$RUNNER_TEMP/apply.log" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          grep -E '^(│ )?Error: ' "$RUNNER_TEMP/apply.log" | sort -u | head -20
          msg="The apply failed (error headings above). Terraform kept what it finished in the state and nothing else runs. Don't re-run this job: fix the cause, then run the workflow again from main; its new plan shows what is left and waits for a new approval. A lock left behind is cleared by the owner (docs/app/RUNNING.md, \"Changing the infrastructure\")."
          echo "::error title=Apply failed::$msg"
          echo "**Apply failed.** $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
