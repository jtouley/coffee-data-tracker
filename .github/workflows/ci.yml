name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with: {python-version: "3.12"}
      - run: uv sync --locked  # fails if uv.lock is out of date
      # Playwright and axe for the browser test (tests/test_app_browser.py), which must run here, not skip.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: make test           # pre-commit hooks on every file, then the tests
        env:
          REQUIRE_BROWSER: "1"
