name: daily
on:
  schedule:
    - cron: "17 11 * * *"   # once a day
  workflow_dispatch:
    inputs:
      sample:
        description: "Only ingest N random roasters (blank = all)"
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv sync
      - name: Collect finished enrichment batches
        if: env.ANTHROPIC_API_KEY != ''
        run: make collect
      - name: Ingest catalogs
        run: make ingest SAMPLE=${{ inputs.sample }}
      - name: Commit data
        run: |
          git config user.name "coffee-data-bot"
          git config user.email "coffee-data-bot@users.noreply.github.com"
          git add data config/roasters.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          msg=$(uv run python -c "import json;c=json.load(open('data/coverage.json'));print(f\"catalog: {c['coffees_this_run']} coffees, {c['events_this_run']} changes\")")
          git commit -m "$msg"
          git pull --rebase origin ${{ github.ref_name }}
          git push
      - name: Build models and site
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with: {path: build/site}
  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
