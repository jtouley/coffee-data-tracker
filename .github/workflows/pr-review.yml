# An advisory PR review by a free OpenCode Zen model, posted as one comment that's updated on each push. It never
# blocks merge. It signs in to OpenCode with the job's GitHub OIDC token, exchanged for a short-lived API key, so no
# key is stored. OPENCODE_CLIENT_ID below is the OpenCode service account credential "Pull requests", pinned to this
# repository: it isn't a secret, and only this repo's pull request workflows can sign in with it.
# Models are tried in order until one answers; set the repository variable PR_REVIEW_MODELS to change them (the eval
# in eval/pr_review/ is how to choose).
#
# Trust: the reviewer's config (.opencode/agents/pr-reviewer.md) and script come from the base branch, never from
# the PR, and the model gets no tools. The PR's checkout is only diffed, never run.
name: pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # Fork and Dependabot PRs get no secrets, so skip them; drafts wait until they're ready.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # to sign in to OpenCode
    env:
      MODELS: ${{ vars.PR_REVIEW_MODELS || 'opencode/big-pickle,opencode/deepseek-v4.1-flash-free' }}
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OPENCODE_CLIENT_ID: sk_09e86e31-fd75-4a00-bbe6-a539a8586741
    steps:
      - name: Check out the base branch (the trusted reviewer config)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: "${{ github.event.pull_request.base.sha }}", path: trusted, persist-credentials: false}
      - name: Check out the PR (only diffed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {ref: "${{ github.event.pull_request.head.sha }}", path: pr, fetch-depth: 0, persist-credentials: false}
      - name: Prepare the diff
        run: |
          git -C pr diff --no-color --no-ext-diff -M -U3 --src-prefix=a/ --dst-prefix=b/ "$BASE_SHA...$HEAD_SHA" \
            | python3 trusted/tools/pr_review/pr_review.py prep > diff.txt
          wc -c diff.txt
      - name: Install OpenCode
        run: npm install -g opencode-ai@1.19.5
      - name: Review
        run: |
          python3 trusted/tools/pr_review/pr_review.py review diff.txt --models "$MODELS" --pr "$PR" \
            --workdir trusted --timeout 300 --out result.json || echo "::warning::No model gave a review."
          python3 trusted/tools/pr_review/pr_review.py comment result.json > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- opencode-pr-review -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file body.md
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with: {name: pr-review-result, path: result.json, if-no-files-found: ignore}
