name: registry
on:
  schedule:
    - cron: "41 9 * * 1"     # weekly: re-probe platforms
    - cron: "23 8 3 * *"     # monthly: discover new roasters, then probe them
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv sync
      - name: Discover
        if: github.event.schedule == '23 8 3 * *' || github.event_name == 'workflow_dispatch'
        run: make discover
      - name: Probe
        run: make probe
      - name: Commit registry
        run: |
          git config user.name "coffee-data-bot"
          git config user.email "coffee-data-bot@users.noreply.github.com"
          git add config/roasters.csv
          git diff --cached --quiet && exit 0
          git commit -m "registry: discover/probe $(date -u +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
