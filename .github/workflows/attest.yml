# Signed build provenance (SLSA) for the app's image, called by deploy.yml's `attest` job, in the same run, once the
# deploy job has pushed an image. It runs only as a reusable workflow: it has no trigger of its own, and only
# deploy.yml calls it (tests/test_deploy_identity.py).
#
# Why a file of its own: GitHub's OIDC token names the workflow file a job is written in (job_workflow_ref), never the
# job. Once the provider change in src/terraform/deploy.tf is applied (by the owner, by hand), the deploy account's
# Workload Identity condition accepts only jobs written in deploy.yml, so this job, which needs `id-token: write` for
# its signing certificate, can't sign in to Google Cloud as the deploy account, and neither can the action it runs.
# Until that apply, the old condition reads only workflow_ref, which is deploy.yml here too. It never signs in.
#
# The attestation records the run and the commit that built the image: its build config is deploy.yml (the workflow
# that ran), its signer this file. Check an image with docs/app/RUNNING.md's command, which pins both (and --repo:
# this file is public, so another repository could call it; --repo refuses those attestations).
name: attest
on:
  workflow_call:
    inputs:
      image:
        description: "<GCP_IMAGE>@sha256:<digest>: what the deploy job pushed"
        type: string
        required: true
permissions: {}
jobs:
  attest:
    if: github.repository == 'jtouley/coffee-data-tracker'  # a call from another repository does nothing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write  # the signing certificate (Sigstore); not accepted by the deploy account's condition
      attestations: write  # store the attestation
    env:
      IMAGE_REF: ${{ inputs.image }}
    steps:
      - name: Split the image reference
        id: ref
        run: |
          if ! [[ "$IMAGE_REF" =~ ^[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Not an image reference with a digest: $IMAGE_REF"
            exit 1
          fi
          echo "name=${IMAGE_REF%@*}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_REF#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:  # no predicate: SLSA build provenance
          subject-name: ${{ steps.ref.outputs.name }}
          subject-digest: ${{ steps.ref.outputs.digest }}
