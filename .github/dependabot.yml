# Keeps the SHA-pinned actions and the uv lockfile current; security fixes arrive as PRs that CI checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
