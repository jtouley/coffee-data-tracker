# Keeps the SHA-pinned actions, the uv lockfile and the digest-pinned base images current; security fixes arrive as
# PRs that CI checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
  # The base images pinned by digest in ingest.Dockerfile (/) and app/Dockerfile (/app).
  - package-ecosystem: docker
    directories: ["/", "/app"]
    schedule: {interval: monthly}
    groups:
      docker: {patterns: ["*"]}
