[project]
name = "coffeedata"
version = "0.1.0"
description = "A daily US specialty-coffee catalog plus a personal shot log, modeled with dbt + DuckDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "anthropic>=0.70",
    "mcp>=2.3,<3",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "pyarrow>=17",
    "huggingface_hub>=0.26",
]

[project.scripts]
coffeedata = "coffeedata.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
