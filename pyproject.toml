[project]
name = "coffeedata"
version = "0.1.0"
description = "A weekly US specialty-coffee catalog plus a personal shot log, modeled with dbt + DuckDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "anthropic>=0.70",
    "mcp>=2.3,<3",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "pyarrow>=17",
    "huggingface_hub>=0.26",
]

[project.scripts]
coffeedata = "coffeedata.cli:main"

[project.optional-dependencies]
snowflake = [
    "cryptography>=42",
    "snowflake-connector-python>=3.12",
]

# The shot-logging app in app/ (a Hugging Face Space later).
app = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "pillow>=11",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.13",
    "respx>=0.21",
    "anyio>=4",
    "snowflake-connector-python>=3.12",
    "cryptography>=42",
    "pre-commit>=4.7.0",
    "argon2-cffi>=23.1",
    "uvicorn>=0.30",
    "pillow>=11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-exclude = ["eval/sealed"]  # sealed test set: kept byte-for-byte (SHA256SUMS)
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "app"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
