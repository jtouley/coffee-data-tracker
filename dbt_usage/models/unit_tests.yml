  - name: a_source_shows_its_campaign_only_when_the_combination_passes
    description: >
      With 2 days: a newsletter on 2 days with the 'fall' campaign on both is shown whole; a newsletter campaign
      'spring' on one day keeps the source but hides medium and campaign; a referrer on one day is '(rare)'.
    model: mart_usage_sources_weekly
    overrides:
      vars: {usage_min_days: 2}
    given:
      - input: ref('int_usage_events')
        rows:
          - {week: 2026-09-07, received_date: 2026-09-07, source_kind: utm, source: news, utm_medium: email, utm_campaign: fall, bot: false}
          - {week: 2026-09-07, received_date: 2026-09-08, source_kind: utm, source: news, utm_medium: email, utm_campaign: fall, bot: false}
          - {week: 2026-09-07, received_date: 2026-09-08, source_kind: utm, source: news, utm_medium: email, utm_campaign: spring, bot: false}
          - {week: 2026-09-07, received_date: 2026-09-08, source_kind: referrer, source: once.example, utm_medium: null, utm_campaign: null, bot: false}
    expect:
      rows:
        - {source_kind: utm, source: news, utm_medium: email, utm_campaign: fall, landings: 2}
        - {source_kind: utm, source: news, utm_medium: (rare), utm_campaign: (rare), landings: 1}
        - {source_kind: referrer, source: (rare), utm_medium: (rare), utm_campaign: (rare), landings: 1}

  - name: click_context_counts_days_with_that_roaster
    description: >
      With 2 days: 'kenya' led to roaster a's clicks on 2 days (shown) but to b's on one (rare for b); the filters
      behind a's clicks are shown as text.
    model: mart_click_context_weekly
    overrides:
      vars: {usage_min_days: 2, usage_min_days_unknown_word: 3}
    given:
      - input: ref('int_usage_events')
        rows:
          - {week: 2026-09-07, received_date: 2026-09-07, event: click_out, roaster_id: a, query_norm: kenya, query_words_known: true, cities: [], states: [], bot: false}
          - {week: 2026-09-07, received_date: 2026-09-08, event: click_out, roaster_id: a, query_norm: kenya, query_words_known: true, cities: [], states: [], bot: false}
          - {week: 2026-09-07, received_date: 2026-09-08, event: click_out, roaster_id: b, query_norm: kenya, query_words_known: true, cities: [], states: [], bot: false}
    expect:
      rows:
        - {roaster_id: a, context_kind: query, context_value: kenya, click_outs: 2}
        - {roaster_id: a, context_kind: filters, context_value: "origin=any; process=any; state=any; in_stock=any; sort=default", click_outs: 2}
        - {roaster_id: b, context_kind: query, context_value: (rare), click_outs: 1}
        - {roaster_id: b, context_kind: filters, context_value: (rare), click_outs: 1}

  - name: roaster_clicks_carry_region_and_a_passing_source_only
    description: >
      With 2 days: a click that was its load's first event from a referrer seen on 2 days shows the referrer; one from
      a referrer seen once shows '(rare)'; a later click shows 'not recorded'. Region, never city.
    model: mart_roaster_clicks_weekly
    overrides:
      vars: {usage_min_days: 2}
    given:
      - input: ref('int_usage_events')
        rows:
