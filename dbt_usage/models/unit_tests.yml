          - {event_id: e20, week: 2026-09-07, received_date: 2026-09-07, event: search, surface: catalog, device: phone, origin: Bolivia, source_kind: null, bot: false}
          - {event_id: e21, week: 2026-09-07, received_date: 2026-09-07, event: search, surface: catalog, device: phone, origin: Bolivia, source_kind: null, bot: false}
          - {event_id: e22, week: 2026-09-07, received_date: 2026-09-07, event: search, surface: catalog, device: phone, origin: Bolivia, source_kind: null, bot: false}
