# Production-run health thresholds (coffeedata.prod_health; what each alert means: docs/TRIAGE.md).
# Generated by `python -m coffeedata.prod_health baseline` from the release history in the lake, then
# reviewed. Change a bound by regenerating from a longer history (and bump `revision`), never to silence an
# alert; an intended shift goes in config/prod_health_expected.toml.
# Bounds centre on the history's median. Margin: the largest of a relative drop (0.03 / 0.1),
# 4 / 8 binomial standard errors at the platform's n, and 3 / 6 x 1.4826 x MAD, capped at
# 0.25 / 0.45 of the median (fill and coverage shares, low side). Abstain and changed shares: median + 0.02 / 0.05 at least;
# volume ratios: 1 +/- 0.1 / 0.25 at least; median shifts: 0 +/- 0.05 / 0.15 at least.
# Claude's coverage leaves out releases with no Claude row at all (from before the enrichment ran).
# Without history: a warn-only dbt band test warns on any failure, the classifier's coverage is judged
# on the build's own gate (min_verdict_share 0.85), the served release's age on the weekly
# cadence (above 7 days: a missed week; above 14: two).
# `flagged`: history values outside their own warning band, possible regressions to look at.
# The crawl success SLO (rule crawl-slo, #96; docs/TRIAGE.md): fixed bounds, warnings only. met is 1 when
# the run fetched more than dbt's crawl_slo_target of the known roasters; burn_rate above 4: one run
# spent about a whole window's budget; budget_remaining below 0: the window is overspent. `report_only`:
# listed in an alert another metric of its rule opened, never opening one itself (the per-platform met).
version = 2
revision = "2026-11-12"
releases = ["lake@c3f7595 marts (2026-10-27)", "lake@41b68c6 marts (2026-10-28)", "release 20261104T041920-5060ad (run 2026-11-02)", "release 20261110T061836-971bfe (run 2026-11-09)"]
builds = ["20261104T041920-5060ad", "20261110T061836-971bfe"]

