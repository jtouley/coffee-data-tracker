change = "up"
by = 0.35
from_run = "2026-11-16"
until_run = "2026-11-16"
pr = 136
why = "bag_sizes_g changes for 10,175 of 45,857 coffees (22%), once"

[[expected]]
metric = "shift:changed:price_per_100g"
change = "up"
by = 0.25
from_run = "2026-11-16"
until_run = "2026-11-16"
pr = 136
why = "price_per_100g changes for 6,668 coffees (15%), once"

[[expected]]
metric = "shift:median:*"
change = "either"
by = 0.15
from_run = "2026-11-16"
until_run = "2026-11-16"
pr = 136
why = "bag weights re-read: the median bag size and price per 100 g may move once (the PR saw market medians move 0)"
