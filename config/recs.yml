# "Your Next Bag" experiment: the frozen settings (eval/recs/README.md is the pre-registration).
# The rec models (dbt models/recs/) read these; the seal (eval/recs/SHA256SUMS) covers this file.
# Change nothing here after the seal. A change after the pilot is made on pilot aggregates only, then re-sealed.
version: 1

# The pinned catalog release every slate is built from (dbt var rec_release). Set at the seal.
catalog_release: null  # SEAL: fill in

slate:
  size: 6
  per_arm: 2
  arms: [C, P, R]  # content, popular, random
  max_per_roaster: 1
  interleaving: team_draft

content:
  # Each coffee is a sparse (feature, weight) vector in five blocks; every block is L2-normalised to equal weight,
  # so a coffee missing a block isn't penalised. Multi-valued blocks are IDF-weighted.
  blocks:
    origin: {fields: [origin_country, origin_region], region_weight: 0.5, idf: true}
    process: {fields: [process], idf: false}
    roast: {fields: [roast_level], idf: false}
    varietals: {fields: [varietals], idf: true}
    flavor: {fields: [flavor_categories], idf: true}
  block_weight: 1.0
  # profile = sum over the five seed ratings of (rating - the user's mean rating) x vector; plain sum if all equal.
  # score = cosine(profile, coffee); ties broken by coffee_id ascending.

popular:
  # At the seal: site click-outs over the trailing 8 weeks if analytics exists and has at least 300 of them;
  # otherwise the fallback. The seal records which, and pins the snapshot file and its sha256 in config/recs.lock.
  primary_source: site_click_outs
  window_weeks: 8
  min_click_outs: 300
  fallback_source: weeks_listed  # longest-listed in-stock coffees in the pinned release
  # ranking: click-outs (or weeks_listed) descending, then first_seen ascending, then coffee_id ascending
  source_chosen: null  # SEAL: site_click_outs or weeks_listed

random:
  # uniform over eligible coffees, ordered by sha256(salt || '|' || user_id || '|R|' || coffee_id) ascending
  seeded_by: salt

eligibility:
  is_coffee: true
  retail_only: true  # is_wholesale false
  in_stock_at_freeze: true  # in_stock in the pinned release, never live stock
  min_blocks: 2  # at least two of the five content blocks present
  exclude_rated_by_user: true
  decaf_only_if_user_rated_decaf: true

responses:
  interest: {want_to_try: 2, maybe: 1, not_for_me: 0}
  buy_next_picks: 1
