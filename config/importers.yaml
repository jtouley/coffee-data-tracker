# The importers whose public offer lists are snapshotted each week (src/coffeedata/importers.py).
#
# Kill switch: set a source's `enabled` to false and the next run neither fetches nor stores it. For a stop that
# can't wait for a merge to main, set the repository variable IMPORTERS_DISABLED to a comma-separated list of
# source names (e.g. "cafe_imports"); the weekly workflow passes it on, and it wins over this file.
#
# Every source in importers.IMPORTERS must be listed here (tests/test_importers.py), so none is on by default.
cafe_imports:
  enabled: true
interamerican:
  enabled: true
