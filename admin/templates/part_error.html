<div class="state error" role="alert" data-state="error">
  <h2 class="section group-title">Couldn’t read the lake</h2>
  <p class="body">Couldn’t read <code>{{ files }}</code>: {{ error }}.</p>
  <p class="meta">Nothing was changed: the admin only reads the lake.</p>
  <button class="btn secondary inline mt12" type="button" data-retry>Retry</button>
</div>
