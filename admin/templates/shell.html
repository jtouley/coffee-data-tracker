{% extends "base.html" %}
{% from "_macros.html" import cup %}
{% block main %}
<div class="titlebar"><h1 class="serif title mt16">{{ on | capitalize }}</h1><div class="title-actions" data-title-actions></div></div>
<section class="part" data-part="{{ part }}" data-slow="{{ slow_s }}" aria-busy="true">
  <div class="state loading" data-loading>
    <div class="brewing">{{ cup("cup-page") }}<p class="body">Reading <code>{{ reading }}</code> from the lake…</p></div>
    <p class="meta" data-slow-note hidden>The lake is slow. Still reading; this gives up after 25 seconds.</p>
  </div>
  <noscript><p class="body">This page loads its data with JavaScript. <a class="ev" href="{{ part }}">Open the data on its own</a>.</p></noscript>
</section>
{% endblock %}
