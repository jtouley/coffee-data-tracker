# Install once with `make hooks`. CI runs the same hooks on every file.
# Recorded storefront responses stay byte-for-byte as captured.
# Hook repositories are pinned by commit, the tag kept in the `# frozen:` comment (review 2026-11-21, F14): a tag can
# be moved, a commit can't. `uv run pre-commit autoupdate --freeze` updates both.
exclude: ^(tests/fixtures/|eval/(.+/)?sealed/|contracts/schemas/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files  # data belongs in the lake, not git
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: eeca16c54e09b4d9a848259e46bae14737944348  # frozen: 0.13.5
    hooks:
      - id: uv-lock  # keeps uv.lock in step with pyproject.toml

  # ruff and mypy run from the project environment (uv.lock), so the hooks, `make lint` and CI use the same
  # versions and mypy sees the real dependencies.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
