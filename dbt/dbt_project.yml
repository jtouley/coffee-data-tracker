name: coffeedata
version: "0.1.0"
config-version: 2
profile: coffeedata

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

vars:
  # Lake roots to read: the local lake/staging dir, plus the remote dataset when publishing (see lake.py).
  lake_roots: ["lake"]
  config_dir: "config"
  # Failed weekly runs in a row before a roaster is unreachable. The weekly run passes registry.MAX_FAILURES.
  max_failures: 3
  # A roaster with more stores than this is a chain (the owner's rule: "a chain is anything with over 20 stores").
  # The store count is stg_registry.locations; seeds/chain_overrides.csv decides over it, either way, with a reason.
  # A chain is still crawled and stays in the internal marts; public_roaster leaves it out of every public output.
  chain_store_threshold: 20
  # chain_flags (not set here): the build's snapshot's chain flags, [{roaster_id, chain}], from the admin's Sources
  # page. `coffeedata build` passes them once a published snapshot carries them; they then replace the seed.
  # Who owns shots logged before accounts existed (their user_id is null). The build passes the real id.
  owner_user_id: "owner"
  # Claude's verdicts to use (verdict.py); empty means the rules alone. The build passes the configured ones.
  verdict_model: ""
  verdict_definition: ""
  # verdicts_cover_catalog: with require_verdicts (what `coffeedata build` passes, unless rules only is explicitly
  # allowed: --allow-rules-only or COFFEEDATA_ALLOW_RULES_ONLY=1), the build fails without a verdict model, or when
  # fewer than min_verdict_share of listed coffees are classified_by claude. Off here, for dbt run by hand and the
  # tests' synthetic lakes.
  # Why 0.85: a listed coffee falls back to the rules for two expected reasons.
  # (1) Lag. The build job's classify submits this week's new or changed product versions and doesn't wait, so
  #     they get verdicts at next week's build. In release 956abd (run 2026-11-02, a week after the first full
  #     run), 1,114 of 44,593 listed coffees (2.5%, Wilson 95% 2.4-2.6%) had a latest version first seen that run.
  # (2) No usable verdict. On the validation set (eval/validation, pred_haiku_*), 7 of the 254 products kept as
  #     coffee (2.8%, 1.3-5.6%) were left to the rules: 5 unsure, 2 without a verdict.
  # So about 95% is expected, and about 92% at the upper bounds of both. 0.85 leaves 7 points under that (about
  # 3,000 more listed coffees without a verdict, nearly 3x that week's new versions: a big discovery, stores
  # rewriting their copy) before a legitimate release fails. A build whose verdicts never ran is near 0%, and so is
  # the first build after verdicts are switched on until the backfill is collected (RUNBOOK, verdicts). If
  # classify stops after verdicts have run, the share falls only by the lag each week (about 4 weeks to trip
  # this); classify's non-zero exit and the empty-model check catch that at once.
  require_verdicts: false
  min_verdict_share: 0.85
  # Data quality. A roaster-week whose product count falls below suspect_drop_ratio x the median of its previous
  # 4 weeks (when that median is at least suspect_min_products) is held out of history until accepted.
  suspect_drop_ratio: 0.5
  suspect_min_products: 20
  # The build fails if listed coffees, in-stock coffees or roasters move more than this from the last passing
  # build (`coffeedata build --accept-volume-change` lets one build through and makes it the new baseline).
  volume_tolerance: 0.2
  # Set by `coffeedata build --accept-volume-change`: this build skips the anomaly bands (below) and their history
  # starts again at it (the volume check gets volume_tolerance 1e9 for it).
  accept_volume_change: false
  # The build fails if the newest counted run is older than this many days before as_of_run (empty: no check).
  as_of_run: ""
  max_run_age_days: 8
  # The day of the build, for freshness (empty: no check), and the served release the volume check compares with.
  today: ""
  baseline_build: ""
  # The served release's public tables ({table: parquet path}), set by `coffeedata build`; release_changes
  # reconciles this build's public tables against them (empty: nothing served, nothing to reconcile).
  previous_release: {}
  # The build this run is (release_build_id on every release table); set by `coffeedata build`.
  build_id: ""
  # Completeness of the as_of_run run (checked only when as_of_run is set): the share of expected roasters it
  # tried (a skipped roaster is a hole, not a failure) and the share it fetched successfully.
  # The ok share counts only roasters that have a catalog (run_completeness has_catalog: no_catalog stores, which
  # "succeed" with 0 products, are left out), and a success must bring back products. On the real runs: 2026-10-26
  # (a full run that should pass) 96.5% of 1,923; 2026-10-28 (mass Shopify 429s) 50.0%.
  min_attempted_share: 1.0
  min_ok_share: 0.9
  # Per adapter, over its roasters with a catalog, for adapters with at least min_adapter_roasters of them: one
  # platform's total outage fails the run. 0.5 sits between the worst healthy adapter seen (Square Online 71.7%
  # of 205 on 2026-10-26, Wilson 95% 65.2-77.4%) and the outages seen (Shopify 14.1% of 1,062 on 2026-10-28; a
  # total outage is 0%). The smallest real adapter had 168 such roasters; under 20 one roaster moves the share 5+
  # points, so those are left to run_ok_rate.
  min_adapter_ok_share: 0.5
  min_adapter_roasters: 20
  # Set only by `coffeedata fetch-health` (the fetch-health check, before the merge): run_ok_rate and adapter_ok_rate
  # count only the roasters a crawl pass has reached (run_completeness attempted), with the same thresholds. The
  # weekly build leaves it false, so a roaster the week never reached still counts against the run.
  attempted_only: false
  # The crawl success SLO (#96, mart_crawl_slo): more than crawl_slo_target of the known roasters fetched ok each
  # run, and its error budget over the last crawl_slo_window_runs recorded runs (4 weekly runs: about 28 days).
  # The owner's target, a benchmark: no test reads these, and nothing here blocks a build (min_ok_share does).
  crawl_slo_target: 0.99
  crawl_slo_window_runs: 4
  # Anomaly bands (build_metrics_in_band) on the ok shares (overall and per adapter, low side only) and the three
  # volume metrics (both sides): median +/- band_k x 1.4826 x MAD over the latest passing build of each of the last
  # band_window runs since the last accepted change, or band_min_*_halfwidth when that is wider (share: absolute;
  # volume: a fraction of the median). CUTOVER: a metric is banded only once it has band_min_builds passing builds
  # in its window; until then only the fixed thresholds above apply, and they stay hard floors after. As of
  # 2026-10-28 the lake has 1 passing real build, so the bands are not active on real data yet. band_k 1.5 is the
  # owner's starting value, and the band test only warns (severity warn) until band_k is recalibrated on 8-12
  # weeks of real history; only then may it block. 1.5 is tight (under a normal model, about 13% of normal builds fall outside on each
  # two-sided metric), so expect to revisit it once the history exists. The minimum half-widths (for a flat
  # history, MAD 0): 0.05 for a share, as at the smallest judged adapter (20 roasters) one roaster is 5 points;
  # 5% of the median for a volume, as the one real change between full runs (2026-10-26 to 10-28) was about +2%.
  # fill_and_freshness_in_band uses the same bands, low side only and always warn-only, on the filled shares
  # (filled_share:<column>) and listed_seen_this_run_share. Over the real runs 2026-10-26 to 10-30 the filled
  # shares moved under 0.012 (origin 0.497-0.498, process 0.167-0.168, roast level 0.401-0.403, price per 100 g
  # 0.608-0.619); the share last seen in the run was 1.0 on 10-26, but only because it was the lake's first run,
  # with no earlier week to carry over, then 0.40 on 10-28 (mass Shopify 429s) and 0.37 on 10-30 (1,000 of 2,545
  # roasters fetched). A normal full week with a prior week in the lake reads roughly the coffee-weighted fetch
  # success rate (about 0.95-0.99), not 1.0: coffees whose roaster's fetch failed, hit the deadline or was parked
  # stay listed with last week's last_seen. With the 0.05 minimum half-width, an ordinary week can warn while the
  # band history builds.
  # adapter_volume_in_band (warn only) bands three per-adapter metrics with the same mechanism, low side only, at
  # least band_min_adapter_halfwidth below the median: the attempted-ok share and the same-store product and priced
  # ratios. 0.10 was chosen on the validation cells of eval/dq (README, #11): at 0.05 one cell labelled normal
  # warned, at 0.10 none did; 0.10 is also the size of a collapse in the labelling definition (eval/dq/GUIDE.md).
  band_min_adapter_halfwidth: 0.10
  band_k: 1.5
  band_min_builds: 6
  band_window: 12
  band_min_share_halfwidth: 0.05
  band_min_volume_halfwidth: 0.05
  # The coverage claims in marketplace/LISTING.md (set by `coffeedata build` from the file; empty: no check) and
  # how far a claim may sit from this build's metric, as a fraction of the metric, before
  # coverage_claims_match_build warns. A claim naming no metric fails the build (coverage_claims_name_metrics).
  coverage_claims: []
  # near_duplicate_roasters (warn): two roasters whose listed titles overlap this much are one catalog listed twice.
  # Chosen on eval/dq's train and validation pairs (README, #12).
  near_duplicate_min_shared: 3
  near_duplicate_min_containment: 0.9
  near_duplicate_min_rare_containment: 0.3
  near_duplicate_rare_roasters: 3
  # price_per_100g_outliers (warn): robust z of ln(price per 100 g) within origin x process (or origin, or all,
  # below price_outlier_min_group coffees). Chosen on eval/dq's validation sample (README, #7).
  price_outlier_low_z: 3
  price_outlier_high_z: 6
  price_outlier_min_group: 30
  claim_tolerance: 0.15
  # The name dim_coffee.origin_country_display (and so the site) gives an origin country: `common` takes
  # seeds/origin_display_name.csv where it has one ("Tanzania" for "Tanzania, United Republic of"), `iso` the ISO
  # 3166-1 short name. Display only: origin_country and origin_country_code stay ISO's in every table. The owner's
  # one switch; `coffeedata build` (the weekly run) and the site, which reads the served release, both follow it.
  origin_names: common
  # The rule settings (coffeedata.rules.dbt_var: the flag_* models and readiness in int_catalog_decided).
  # `coffeedata build` always passes them, from the build's snapshot or rules.DEFAULTS; these are those defaults,
  # for dbt run by hand and the unit tests (tests/test_flags.py checks they match).
  rules:
    rules:
      verdict_flip: {family: classifier, params: {}, polarity: {added: supports, removed: restore}}
      shared_body: {family: catalog, params: {min_products: 3, min_chars: 60}, polarity: {"": doubts}}
      non_coffee_type: {family: listing, params: {types: [drink mix, nuts, books, parts]}, polarity: {"": supports}}
    readiness: {supports_min: 2, distinct_families: true, live_check: required, blocked_by: [doubts, coverage]}

models:
  coffeedata:
    staging:
      +materialized: view
      # Tables for staging read more than once, so each build reads the lake for them once (every read sees the
      # same lake) and stg_run_quality's walk runs once.
      stg_fetches: {+materialized: table}
      stg_snapshots: {+materialized: table}
      stg_run_quality: {+materialized: table}
      stg_runs: {+materialized: table}
      stg_run_overrides: {+materialized: table}
      stg_registry: {+materialized: table}
      stg_bags: {+materialized: table}
    intermediate:
      # Results more than one model reads, computed once.
      +materialized: table
    marts:
      +materialized: table
    public:
      # Facts-only tables for public release (Hugging Face public dataset, Snowflake, Databricks).
      +materialized: table
