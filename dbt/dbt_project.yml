name: coffeedata
version: "0.1.0"
config-version: 2
profile: coffeedata

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

vars:
  # Lake roots to read: the local lake/staging dir, plus the remote dataset when publishing (see lake.py).
  lake_roots: ["lake"]
  config_dir: "config"

models:
  coffeedata:
    staging:
      +materialized: view
    marts:
      +materialized: table
