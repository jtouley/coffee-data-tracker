        - {coffee_id: "r:P6", price_per_100g: 100.0, min_price_usd: 150.0, bag_sizes_g: "[150]", in_stock: true}
        - {coffee_id: "r:P7", price_per_100g: null, min_price_usd: 400.0, bag_sizes_g: "[340]", in_stock: true}
        - {coffee_id: "r:P8", price_per_100g: 4.0, min_price_usd: 10.0, bag_sizes_g: "[340, 1000]", in_stock: true}
        - {coffee_id: "r:P9", price_per_100g: null, min_price_usd: 20.0, bag_sizes_g: "[340]", in_stock: true}
        - {coffee_id: "r:P10", price_per_100g: null, min_price_usd: null, bag_sizes_g: "[340, 454]", in_stock: true}
        - {coffee_id: "r:P11", price_per_100g: 5.0, min_price_usd: 17.0, bag_sizes_g: "[340]", in_stock: true}
        - {coffee_id: "r:P12", price_per_100g: null, min_price_usd: 20.0, bag_sizes_g: "[340]", in_stock: false}

  - name: flavor_categories_come_from_the_lexicon
    description: >-
      dim_coffee.flavor_categories: each tasting note looked up in the flavor_lexicon seed (rows copied from it),
      the distinct categories sorted. A note the seed doesn't list adds nothing; no notes, or none known, is an
      empty list, never null. (The lookup is case-sensitive today: flavor_lookup_ignores_case, a suspected bug.)
    model: dim_coffee
    given:
      - input: ref('stg_snapshots')
        format: sql
        rows: |
          select coffee_id, 'r' as roaster_id, split_part(coffee_id, ':', 2) as product_id,
                 date '2026-10-19' as run_date, 'h' as handle, 'https://r.example/p' as url, null::varchar as image,
                 'shopify' as platform, []::varchar[] as tags, null::timestamptz as published_at,
                 coffee_id as input_hash, 'b' as body_hash, coffee_id as grams_key,
                 [{'variant_id': 'a', 'title': '12 oz', 'price_usd': 20.0, 'grams': 340, 'available': true}] as variants
          from (values ('r:F1'), ('r:F2'), ('r:F3'), ('r:F4')) t(coffee_id)
      - input: ref('stg_products')
        rows:
          - {input_hash: "r:F1", is_coffee: true, is_wholesale: false, tasting_notes: "['milk chocolate', 'blackberry', 'chocolate', 'lemon', 'not a note']"}
          - {input_hash: "r:F2", is_coffee: true, is_wholesale: false, tasting_notes: "['lemon', 'jasmine']"}
          - {input_hash: "r:F3", is_coffee: true, is_wholesale: false, tasting_notes: "[]"}
          - {input_hash: "r:F4", is_coffee: true, is_wholesale: false, tasting_notes: null}
      - input: ref('stg_enrichments')
        rows: []
      - input: ref('stg_runs')
        rows:
          - {roaster_id: r, run_date: 2026-10-19, is_current: true}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: r, roaster_name: R, country: US}
      - input: ref('int_roaster_state')
        format: sql
        rows: select null::varchar as roaster_id, null::varchar as canonical_roaster_id, null::boolean as is_chain where false
      - input: ref('stg_variant_grams')  # no row: every variant keeps its stored grams
        format: sql
        rows: select null::varchar as grams_key, null::integer as options, null::integer[] as grams where false
      - input: ref('int_origin_country')  # no origins in these cases
        format: sql
        rows: >-
          select null::varchar as raw_value, null::varchar as kind, null::varchar as alpha2, null::varchar as alpha3,
                 null::varchar as iso_short_name, null::varchar as region, null::varchar as display_name where false
      - input: ref('flavor_lexicon')  # rows as in seeds/flavor_lexicon.csv
        rows:
          - {note: blackberry, category: berry}
          - {note: chocolate, category: chocolate}
          - {note: milk chocolate, category: chocolate}
          - {note: lemon, category: citrus}
          - {note: jasmine, category: floral}
    expect:
      rows:
        - {coffee_id: "r:F1", flavor_categories: "['berry', 'chocolate', 'citrus']"}
        - {coffee_id: "r:F2", flavor_categories: "['citrus', 'floral']"}
        - {coffee_id: "r:F3", flavor_categories: "[]"}
        - {coffee_id: "r:F4", flavor_categories: "[]"}

