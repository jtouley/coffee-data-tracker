  - name: coffee_prices_use_the_rules_grams_by_position
    description: >-
      dim_coffee prices bags with stg_variant_grams's grams, matched to the variants by position (1-based): the
      crawler stored 907 g for a "1/2 lb" option and none for a 5 lb one; the rules read 227 g and 2268 g. A coffee
      whose version has no stg_variant_grams row keeps its stored grams (variant_grams_are_valid fails that build).
    model: dim_coffee
    given:
      - input: ref('stg_snapshots')
        format: sql
        rows: |
          select * from (values
              ('r:A', 'A', 'kA', [{'variant_id': 'a1', 'title': '1/2 lb', 'price_usd': 10.0, 'grams': 907, 'available': true},
                                  {'variant_id': 'a2', 'title': '5-lb-bag', 'price_usd': 70.0, 'grams': null, 'available': true}]),
              ('r:B', 'B', 'kB', [{'variant_id': 'b1', 'title': '12 oz', 'price_usd': 17.0, 'grams': 340, 'available': true}])
          ) t(coffee_id, product_id, grams_key, variants)
          cross join (select 'r' as roaster_id, date '2026-10-19' as run_date, 'h' as input_hash, 'b' as body_hash,
              'h' as handle, 'https://r/p' as url, null::varchar as image, 'shopify' as platform,
              []::varchar[] as tags, null::timestamptz as published_at)
      - input: ref('stg_variant_grams')
        format: sql
        rows: select 'kA' as grams_key, 2 as options, [227, 2268]::integer[] as grams
      - input: ref('stg_products')
        rows:
          - {input_hash: h, is_coffee: true, classified_by: rules, is_wholesale: false, clean_title: Kenya}
      - input: ref('stg_enrichments')
        rows: []
      - input: ref('stg_runs')
        rows:
          - {roaster_id: r, run_date: 2026-10-19, is_current: true}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: r, roaster_name: R, country: US}
      - input: ref('int_roaster_state')
        format: sql
        rows: select null::varchar as roaster_id, null::varchar as canonical_roaster_id, null::boolean as is_chain where false
      - input: ref('int_origin_country')  # no origins in these cases
        format: sql
        rows: >-
          select null::varchar as raw_value, null::varchar as kind, null::varchar as alpha2, null::varchar as alpha3,
                 null::varchar as iso_short_name, null::varchar as region, null::varchar as display_name where false
      - input: ref('flavor_lexicon')
        rows: []
    expect:
      rows:
        - {coffee_id: "r:A", price_per_100g: 3.09, bag_sizes_g: "[227, 2268]"}
        - {coffee_id: "r:B", price_per_100g: 5.0, bag_sizes_g: "[340]"}

  # --- Rules pinned by the rules audit (docs/RULES.md) ---------------------------------------------------------------

  - name: price_per_100g_band_size_window_and_availability
    description: >-
      dim_coffee's prices. price_per_100g is the lowest of a coffee's variants that are retail, 150-2,500 g, priced
      above 0, available (null counts as available) and $0.50-$100 per 100 g, all bounds inclusive; else null.
      min_price_usd is the lowest price above 0 over every variant, sold out or wholesale included; bag_sizes_g
      every distinct size. P1 in band; P2 under 150 g; P3 2,500 g exactly; P4 over 2,500 g; P5 under $0.50/100 g;
      P6 $100/100 g exactly; P7 over $100/100 g; P8 its cheaper-per-gram bag ($2.94/100 g) is sold out, so the
      available one ($4.00) counts; P9 wholesale; P10 priced 0 and unpriced; P11 availability unknown; P12 sold out.
    model: dim_coffee
    given:
      - input: ref('stg_snapshots')
        format: sql
        rows: |
          select coffee_id, roaster_id, split_part(coffee_id, ':', 2) as product_id, date '2026-10-19' as run_date,
                 'h' as handle, 'https://r.example/p' as url, null::varchar as image, 'shopify' as platform,
                 []::varchar[] as tags, null::timestamptz as published_at, coffee_id as input_hash, 'b' as body_hash,
                 coffee_id as grams_key,
                 variants::struct(variant_id varchar, title varchar, price_usd double, grams integer,
                                  available boolean)[] as variants
          from (values
              ('r:P1', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 20.0, 'grams': 340, 'available': true}]),
              ('r:P2', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 10.0, 'grams': 100, 'available': true}]),
              ('r:P3', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 50.0, 'grams': 2500, 'available': true}]),
              ('r:P4', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 60.0, 'grams': 2600, 'available': true}]),
              ('r:P5', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 0.7, 'grams': 150, 'available': true}]),
              ('r:P6', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 150.0, 'grams': 150, 'available': true}]),
              ('r:P7', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 400.0, 'grams': 340, 'available': true}]),
              ('r:P8', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 10.0, 'grams': 340, 'available': false},
                             {'variant_id': 'b', 'title': 'Bag', 'price_usd': 40.0, 'grams': 1000, 'available': true}]),
              ('r:P9', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 20.0, 'grams': 340, 'available': true}]),
              ('r:P10', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 0.0, 'grams': 340, 'available': true},
                              {'variant_id': 'b', 'title': 'Bag', 'price_usd': null, 'grams': 454, 'available': true}]),
              ('r:P11', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 17.0, 'grams': 340, 'available': null}]),
              ('r:P12', 'r', [{'variant_id': 'a', 'title': 'Bag', 'price_usd': 20.0, 'grams': 340, 'available': false}])
          ) t(coffee_id, roaster_id, variants)
      - input: ref('stg_products')
        rows:
          - {input_hash: "r:P1", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P2", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P3", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P4", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P5", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P6", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P7", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P8", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P9", is_coffee: true, is_wholesale: true}
          - {input_hash: "r:P10", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P11", is_coffee: true, is_wholesale: false}
          - {input_hash: "r:P12", is_coffee: true, is_wholesale: false}
      - input: ref('stg_enrichments')
        rows: []
      - input: ref('stg_runs')
        rows:
          - {roaster_id: r, run_date: 2026-10-19, is_current: true}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: r, roaster_name: R, country: US}
      - input: ref('int_roaster_state')
        format: sql
        rows: select null::varchar as roaster_id, null::varchar as canonical_roaster_id, null::boolean as is_chain where false
      - input: ref('stg_variant_grams')  # no row: every variant keeps its stored grams
        format: sql
        rows: select null::varchar as grams_key, null::integer as options, null::integer[] as grams where false
      - input: ref('int_origin_country')  # no origins in these cases
        format: sql
        rows: >-
          select null::varchar as raw_value, null::varchar as kind, null::varchar as alpha2, null::varchar as alpha3,
                 null::varchar as iso_short_name, null::varchar as region, null::varchar as display_name where false
      - input: ref('flavor_lexicon')
        rows: []
    expect:
      rows:
        - {coffee_id: "r:P1", price_per_100g: 5.88, min_price_usd: 20.0, bag_sizes_g: "[340]", in_stock: true}
