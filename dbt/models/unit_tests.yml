  - name: flavor_lookup_ignores_case
    description: >-
      A tasting note matches the flavor lexicon whatever its case ('Lemon' is lemon). Today the lookup is exact, so a
      capitalised note (Claude's or a tag's) gets no category.
    model: dim_coffee
    config:
      tags: [suspected_bug]
    given:
      - input: ref('stg_snapshots')
        format: sql
        rows: |
          select 'r:F1' as coffee_id, 'r' as roaster_id, 'F1' as product_id, date '2026-10-19' as run_date,
                 'h' as handle, 'https://r.example/p' as url, null::varchar as image, 'shopify' as platform,
                 []::varchar[] as tags, null::timestamptz as published_at, 'r:F1' as input_hash, 'b' as body_hash,
                 'r:F1' as grams_key,
                 [{'variant_id': 'a', 'title': '12 oz', 'price_usd': 20.0, 'grams': 340, 'available': true}] as variants
      - input: ref('stg_products')
        rows:
          - {input_hash: "r:F1", is_coffee: true, is_wholesale: false, tasting_notes: "['Lemon', 'Jasmine']"}
      - input: ref('stg_enrichments')
        rows: []
      - input: ref('stg_runs')
        rows:
          - {roaster_id: r, run_date: 2026-10-19, is_current: true}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: r, roaster_name: R, country: US}
      - input: ref('int_roaster_state')
        format: sql
        rows: select null::varchar as roaster_id, null::varchar as canonical_roaster_id, null::boolean as is_chain where false
      - input: ref('stg_variant_grams')  # no row: every variant keeps its stored grams
        format: sql
        rows: select null::varchar as grams_key, null::integer as options, null::integer[] as grams where false
      - input: ref('int_origin_country')  # no origins in these cases
        format: sql
        rows: >-
          select null::varchar as raw_value, null::varchar as kind, null::varchar as alpha2, null::varchar as alpha3,
                 null::varchar as iso_short_name, null::varchar as region, null::varchar as display_name where false
      - input: ref('flavor_lexicon')
        rows:
          - {note: lemon, category: citrus}
          - {note: jasmine, category: floral}
    expect:
      rows:
        - {coffee_id: "r:F1", flavor_categories: "['citrus', 'floral']"}

  - name: a_bag_with_no_shots_has_none_in_window
    description: >-
      A bag with no shots has shots_in_window 0, as its shot_count is 0. Today it is null: shot_count is coalesced
      and shots_in_window isn't.
    model: mart_bag
    config:
      tags: [suspected_bug]
    given:
      - input: ref('stg_bags')
        rows:
          - {bag_id: b2, user_id: u}
      - input: ref('fct_shot')
        rows: []
      - input: ref('dim_coffee')
        rows: []
      - input: ref('int_roaster_state')
        rows: []
    expect:
      rows:
        - {bag_id: b2, shot_count: 0, shots_in_window: 0}

  # --- Chains: more than chain_store_threshold (20) stores, or a hand-checked override; never public. -------------

  - name: a_chain_has_more_than_20_stores_unless_overridden
    description: >-
      The owner's rule: a chain is anything with over 20 stores (stg_registry.locations). 20 stores is not a chain;
      21 is. seeds/chain_overrides.csv decides over the count either way: a chain of cafes whose count reads 1 (the
      count reads roastery places only), and a roaster the count calls a chain that isn't one.
    model: int_roaster_state
    given:
      - input: ref('shared_hosts')
        rows: []
      - input: ref('chain_overrides')
        rows:
          - {roaster_id: cafes.com, is_chain: true, reason: "hundreds of cafes, one roastery place"}
          - {roaster_id: notachain.com, is_chain: false, reason: "a wholesaler's warehouses, not stores"}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: twenty.com, locations: 20, sources: overture, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: twentyone.com, locations: 21, sources: overture, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: one.com, locations: 1, sources: curated, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: cafes.com, locations: 1, sources: curated, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: notachain.com, locations: 62, sources: overture, seed_platform: shopify, opted_out: false, country: US}
      - input: ref('stg_probes')
        format: sql
        rows: select null::varchar as roaster_id, null::varchar as status, null::timestamptz as probed_at, null::varchar as final_host, null::varchar as platform where false
      - input: ref('int_roaster_runs')
        rows: []
      - input: ref('int_fetches')
        rows: []
    expect:
      rows:
        - {roaster_id: twenty.com, locations: 20, is_chain: false}
        - {roaster_id: twentyone.com, locations: 21, is_chain: true}
        - {roaster_id: one.com, locations: 1, is_chain: false}
        - {roaster_id: cafes.com, locations: 1, is_chain: true}
        - {roaster_id: notachain.com, locations: 62, is_chain: false}

  - name: a_snapshots_chain_flags_replace_the_seed
    description: >-
      Once the build's snapshot carries chain flags (var chain_flags, the admin's Sources page), they are the
      overrides and the seed is not read: peets.com, a chain only by the seed, is decided by its count again, and a
      flag either way decides over the count.
    model: int_roaster_state
    overrides:
      vars:
        chain_flags:
          - {roaster_id: one.com, chain: true}
          - {roaster_id: notachain.com, chain: false}
    given:
      - input: ref('shared_hosts')
        rows: []
      - input: ref('chain_overrides')
        rows:
          - {roaster_id: peets.com, is_chain: true, reason: "the seed's override"}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: peets.com, locations: 1, sources: curated, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: one.com, locations: 1, sources: curated, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: notachain.com, locations: 62, sources: overture, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: twentyone.com, locations: 21, sources: overture, seed_platform: shopify, opted_out: false, country: US}
      - input: ref('stg_probes')
        format: sql
        rows: select null::varchar as roaster_id, null::varchar as status, null::timestamptz as probed_at, null::varchar as final_host, null::varchar as platform where false
      - input: ref('int_roaster_runs')
        rows: []
      - input: ref('int_fetches')
        rows: []
    expect:
      rows:
        - {roaster_id: peets.com, is_chain: false}
        - {roaster_id: one.com, is_chain: true}
        - {roaster_id: notachain.com, is_chain: false}
        - {roaster_id: twentyone.com, is_chain: true}

  - name: an_empty_chain_flags_list_means_no_override
    description: >-
      chain_flags is [] when the owner has cleared every chain flag and published it: no override at all, so the
      store count decides every roaster. It is not "no snapshot": the seed is not read (peets.com, a chain only by
      the seed, is not a chain).
    model: int_roaster_state
    overrides:
      vars:
        chain_flags: []
    given:
      - input: ref('shared_hosts')
        rows: []
      - input: ref('chain_overrides')
        rows:
          - {roaster_id: peets.com, is_chain: true, reason: "the seed's override"}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: peets.com, locations: 1, sources: curated, seed_platform: shopify, opted_out: false, country: US}
          - {roaster_id: twentyone.com, locations: 21, sources: overture, seed_platform: shopify, opted_out: false, country: US}
      - input: ref('stg_probes')
        format: sql
        rows: select null::varchar as roaster_id, null::varchar as status, null::timestamptz as probed_at, null::varchar as final_host, null::varchar as platform where false
      - input: ref('int_roaster_runs')
        rows: []
      - input: ref('int_fetches')
        rows: []
    expect:
      rows:
        - {roaster_id: peets.com, is_chain: false}
        - {roaster_id: twentyone.com, is_chain: true}

  - name: public_roaster_leaves_out_chains
    description: >-
      public_roaster is the one place that decides "public": a chain (dim_roaster.is_chain) is left out however
      publishable it is otherwise, next to the opted-out, OSM-only and non-US roasters it already left out. Every
      other public table follows it.
    model: public_roaster
    given:
      - input: ref('dim_roaster')
        rows:
          - {roaster_id: indie.com, roaster_name: Indie, is_chain: false, opted_out: false, sources: overture, country: US}
          - {roaster_id: chain.com, roaster_name: Chain, is_chain: true, opted_out: false, sources: curated+overture, country: US}
          - {roaster_id: optedout.com, roaster_name: Opted, is_chain: false, opted_out: true, sources: overture, country: US}
          - {roaster_id: osmonly.com, roaster_name: OSM, is_chain: false, opted_out: false, sources: osm, country: US}
      - input: ref('dim_coffee')
        rows:
          - {roaster_id: indie.com}
          - {roaster_id: chain.com}
          - {roaster_id: optedout.com}
          - {roaster_id: osmonly.com}
    expect:
      rows:
        - {roaster_id: indie.com, roaster_name: Indie}

  - name: public_coffee_follows_public_roaster
    description: >-
      public_coffee holds the public roasters' coffees only (it joins public_roaster), so a coffee of a roaster
      public_roaster leaves out (a chain here) is not published. It tests that the table follows its parent, which
      decides chains (public_roaster_leaves_out_chains); it holds on main too.
    model: public_coffee
    given:
      - input: ref('dim_coffee')
        rows:
          - {coffee_id: "indie.com:1", roaster_id: indie.com, title: Kenya, url: "https://indie.com/p/1", is_chain: false}
          - {coffee_id: "chain.com:1", roaster_id: chain.com, title: Kenya, url: "https://chain.com/p/1", is_chain: true}
      - input: ref('public_roaster')
        rows:
          - {roaster_id: indie.com, roaster_name: Indie}
    expect:
      rows:
        - {coffee_id: "indie.com:1", roaster_id: indie.com, roaster_name: Indie, coffee_name: Kenya}

  - name: public_price_event_follows_public_coffee
    description: >-
      public_price_event holds public coffees' events only, so the events of a coffee public_coffee leaves out (a
      chain's here) are not published. It tests that the table follows its parent; it holds on main too.
    model: public_price_event
    given:
      - input: ref('fct_price_event')
        rows:
          - {run_date: 2026-11-09, coffee_id: "indie.com:1", roaster_id: indie.com, variant_id: v1, event: new, price_usd: 20.0}
          - {run_date: 2026-11-09, coffee_id: "chain.com:1", roaster_id: chain.com, variant_id: v1, event: new, price_usd: 18.0}
      - input: ref('public_coffee')
        rows:
          - {coffee_id: "indie.com:1", roaster_id: indie.com}
    expect:
      rows:
        - {run_date: 2026-11-09, coffee_id: "indie.com:1", roaster_id: indie.com, variant_id: v1, event: new, price_usd: 20.0}

  - name: origin_spellings_resolve_to_iso_3166_1
    description: >-
      Tricky origin spellings from the 2026-11-09 release (eval/origin_iso), resolved by the real origin_country_iso
      seed: a spelling and its accented or Portuguese form are one country; the ISO short name is ISO's, however
      awkward; Puerto Rico is its own country; a list of several countries is multiple, never its first; a list naming
      one country twice is that country, keeping the sub-national place; a continent, alone or in a list, has no
      country; a country whose name has "and" in it isn't split; New Guinea, shared by two countries, has none; an unknown spelling is unmapped, never title-cased into a
      country. With var origin_names common (the default), display_name is the origin_display_name
      seed's name where it has one, else the ISO short name. Only Claude's rows (method llm) count from stg_enrichments.
    model: int_origin_country
    given:
      - input: ref('stg_products')
        rows:
          - {origin_country: Brazil}
          - {origin_country: Puerto Rico}
          - {origin_country: New Guinea}
          - {origin_country: Tanzania}
          - {origin_country: Trinidad and Tobago}
          - {origin_country: null}
      - input: ref('stg_enrichments')
        rows:
          - {method: llm, origin_country: Brasil}
          - {method: llm, origin_country: Democratic Republic Of Congo}
          - {method: llm, origin_country: Việt Nam}
          - {method: llm, origin_country: "Hawaii, Usa"}
          - {method: llm, origin_country: "Kenya, Hawaii (Usa)"}
          - {method: llm, origin_country: "Colombia & Peru"}
          - {method: llm, origin_country: "Colombia/Costa Rica"}
          - {method: llm, origin_country: "Central America And Indonesia"}
          - {method: llm, origin_country: "Uganda, Kenya, Rwanda, Burundi"}
          - {method: llm, origin_country: East Africa}
          - {method: llm, origin_country: "Peru, Atlantis"}
          - {method: llm, origin_country: Narnia}
          - {method: rules, origin_country: Wakanda}
      - input: ref('origin_country_iso')  # rows as in seeds/origin_country_iso.csv
        rows:
          - {raw_value: Brazil, kind: country, alpha2: BR, alpha3: BRA, iso_short_name: Brazil, region: null}
          - {raw_value: Brasil, kind: country, alpha2: BR, alpha3: BRA, iso_short_name: Brazil, region: null}
          - {raw_value: Colombia, kind: country, alpha2: CO, alpha3: COL, iso_short_name: Colombia, region: null}
          - {raw_value: Costa Rica, kind: country, alpha2: CR, alpha3: CRI, iso_short_name: Costa Rica, region: null}
          - {raw_value: Democratic Republic of Congo, kind: country, alpha2: CD, alpha3: COD, iso_short_name: "Congo, The Democratic Republic of the", region: null}
          - {raw_value: Hawaii, kind: country, alpha2: US, alpha3: USA, iso_short_name: United States, region: Hawaii}
          - {raw_value: Indonesia, kind: country, alpha2: ID, alpha3: IDN, iso_short_name: Indonesia, region: null}
          - {raw_value: Kenya, kind: country, alpha2: KE, alpha3: KEN, iso_short_name: Kenya, region: null}
          - {raw_value: Peru, kind: country, alpha2: PE, alpha3: PER, iso_short_name: Peru, region: null}
          - {raw_value: Puerto Rico, kind: country, alpha2: PR, alpha3: PRI, iso_short_name: Puerto Rico, region: null}
          - {raw_value: Rwanda, kind: country, alpha2: RW, alpha3: RWA, iso_short_name: Rwanda, region: null}
          - {raw_value: Burundi, kind: country, alpha2: BI, alpha3: BDI, iso_short_name: Burundi, region: null}
          - {raw_value: Tanzania, kind: country, alpha2: TZ, alpha3: TZA, iso_short_name: "Tanzania, United Republic of", region: null}
          - {raw_value: Trinidad and Tobago, kind: country, alpha2: TT, alpha3: TTO, iso_short_name: Trinidad and Tobago, region: null}
          - {raw_value: Uganda, kind: country, alpha2: UG, alpha3: UGA, iso_short_name: Uganda, region: null}
          - {raw_value: Usa, kind: country, alpha2: US, alpha3: USA, iso_short_name: United States, region: null}
          - {raw_value: Việt Nam, kind: country, alpha2: VN, alpha3: VNM, iso_short_name: Viet Nam, region: null}
          - {raw_value: Central America, kind: not_a_country, alpha2: null, alpha3: null, iso_short_name: null, region: null}
          - {raw_value: East Africa, kind: not_a_country, alpha2: null, alpha3: null, iso_short_name: null, region: null}
          - {raw_value: New Guinea, kind: ambiguous, alpha2: null, alpha3: null, iso_short_name: null, region: null}
      - input: ref('origin_display_name')  # rows as in seeds/origin_display_name.csv
        rows:
          - {alpha2: CD, display_name: DR Congo}
          - {alpha2: TZ, display_name: Tanzania}
          - {alpha2: VN, display_name: Vietnam}
    expect:
      rows:
        - {raw_value: Brazil, kind: country, alpha2: BR, alpha3: BRA, iso_short_name: Brazil, region: null, display_name: Brazil}
        - {raw_value: Brasil, kind: country, alpha2: BR, alpha3: BRA, iso_short_name: Brazil, region: null, display_name: Brazil}
        - {raw_value: Puerto Rico, kind: country, alpha2: PR, alpha3: PRI, iso_short_name: Puerto Rico, region: null, display_name: Puerto Rico}
        - {raw_value: New Guinea, kind: ambiguous, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: Tanzania, kind: country, alpha2: TZ, alpha3: TZA, iso_short_name: "Tanzania, United Republic of", region: null, display_name: Tanzania}
        - {raw_value: Trinidad and Tobago, kind: country, alpha2: TT, alpha3: TTO, iso_short_name: Trinidad and Tobago, region: null, display_name: Trinidad and Tobago}
        - {raw_value: Democratic Republic Of Congo, kind: country, alpha2: CD, alpha3: COD, iso_short_name: "Congo, The Democratic Republic of the", region: null, display_name: DR Congo}
        - {raw_value: Việt Nam, kind: country, alpha2: VN, alpha3: VNM, iso_short_name: Viet Nam, region: null, display_name: Vietnam}
        - {raw_value: "Hawaii, Usa", kind: country, alpha2: US, alpha3: USA, iso_short_name: United States, region: Hawaii, display_name: United States}
        - {raw_value: "Kenya, Hawaii (Usa)", kind: multiple, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: "Colombia & Peru", kind: multiple, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: "Colombia/Costa Rica", kind: multiple, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: "Central America And Indonesia", kind: multiple, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: "Uganda, Kenya, Rwanda, Burundi", kind: multiple, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: East Africa, kind: not_a_country, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: "Peru, Atlantis", kind: unmapped, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}
        - {raw_value: Narnia, kind: unmapped, alpha2: null, alpha3: null, iso_short_name: null, region: null, display_name: null}

  - name: origin_display_name_follows_the_origin_names_var
    description: >-
      With var origin_names iso, the display name is the ISO short name even where the origin_display_name seed has a
      common one.
    model: int_origin_country
    overrides:
      vars: {origin_names: iso}
    given:
      - input: ref('stg_products')
        rows:
          - {origin_country: Tanzania}
      - input: ref('stg_enrichments')
        rows: []
      - input: ref('origin_country_iso')
        rows:
          - {raw_value: Tanzania, kind: country, alpha2: TZ, alpha3: TZA, iso_short_name: "Tanzania, United Republic of", region: null}
      - input: ref('origin_display_name')
        rows:
          - {alpha2: TZ, display_name: Tanzania}
    expect:
      rows:
        - {raw_value: Tanzania, alpha2: TZ, iso_short_name: "Tanzania, United Republic of", display_name: "Tanzania, United Republic of"}

  - name: registry_values_come_from_open_sources
    description: >-
      Field-level provenance (#90). A roaster known from an open source (Overture, the curated seed, a manual add)
      takes its name, city and state from open sources only: a later OpenStreetMap record (ODbL) never replaces
      them, and a value only OpenStreetMap gave stays null. These columns pass unchanged through int_roaster_state
      and dim_roaster to public_roaster and public_coffee. A roaster known only from OpenStreetMap, which
      public_roaster leaves out, keeps the newest values, as before.
    model: stg_registry
    given:
      - input: ref('stg_roaster_seed')
        rows:
          # curated in the seed, then found by OpenStreetMap: the seed's values stay
          - {roaster_id: seeded.coffee, name: Seeded Roasters, city: Durham, state: NC, sources: curated, locations: 1, opted_out: false}
      - input: ref('stg_registry_records')
        rows:
          - {roaster_id: seeded.coffee, source: osm, added_at: "2026-10-08 06:00:00+00", name: Seeded OSM, city: Raleigh, state: VA, is_open_source: false}
          # Overture first, OpenStreetMap a week later: Overture's name and state; its city was empty, so none
          - {roaster_id: overture.coffee, source: overture-2026-09-17.0, added_at: "2026-10-01 06:00:00+00", name: Overture Roasters, city: null, state: OR, locations: 2, is_open_source: true}
          - {roaster_id: overture.coffee, source: osm, added_at: "2026-10-08 06:00:00+00", name: OSM Roasters, city: Portland, state: WA, locations: 1, is_open_source: false}
          # a manual add between two OpenStreetMap records: the manual one's values, whatever came before or after
          - {roaster_id: manual.coffee, source: osm, added_at: "2026-10-01 06:00:00+00", name: Old OSM, city: Bangor, state: ME, is_open_source: false}
          - {roaster_id: manual.coffee, source: manual, added_at: "2026-10-08 06:00:00+00", name: Manual Roasters, city: null, state: NH, is_open_source: true}
          - {roaster_id: manual.coffee, source: osm, added_at: "2026-10-15 06:00:00+00", name: New OSM, city: Concord, state: VT, is_open_source: false}
          # OpenStreetMap only (never public): the newest record's values
          - {roaster_id: osmonly.coffee, source: osm, added_at: "2026-10-01 06:00:00+00", name: OSM Old Name, city: Augusta, state: ME, is_open_source: false}
          - {roaster_id: osmonly.coffee, source: osm, added_at: "2026-10-08 06:00:00+00", name: OSM Only, city: null, state: ME, is_open_source: false}
    expect:
      rows:
        - {roaster_id: seeded.coffee, roaster_name: Seeded Roasters, city: Durham, state: NC, sources: curated+osm}
        - {roaster_id: overture.coffee, roaster_name: Overture Roasters, city: null, state: OR, sources: osm+overture-2026-09-17.0}
        - {roaster_id: manual.coffee, roaster_name: Manual Roasters, city: null, state: NH, sources: manual+osm}
        - {roaster_id: osmonly.coffee, roaster_name: OSM Only, city: Augusta, state: ME, sources: osm}
