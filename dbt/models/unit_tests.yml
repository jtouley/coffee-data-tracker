      (10-26), so it keeps the store and its history. Parked domains (expireddomains.com, a shared host) never group,
      whatever their status. A hand-checked alias_of (a rebrand that doesn't redirect) decides over the host. An
      OSM-only id equal to the key never hides a publishable one (L2). A seed-only id (first_added null: the oldest)
      is canonical before one the lake added later (L1).
