version: 2

models:
  - name: stg_runs
    description: One row per (roaster, run_date) that counts in history; re-runs of a week collapse here.
  - name: stg_run_quality
    description: Every roaster-week with a successful fetch, the batch that counts, and whether it looks broken.
    data_tests:
      - unique:
          arguments: {column_name: "roaster_id || '|' || run_date"}
    columns:
      - name: override_action
        data_tests:
          - accepted_values: {arguments: {values: [accept, reject, use_batch]}}
  - name: stg_run_walk
    description: Each roaster-week in order, whether it counts, and the counted weeks it was judged against.
  - name: stg_builds
    description: One row per recorded build and whether it passed; the one definition of a passing build.
  - name: stg_products
    description: The classifier and extraction rules, run once per distinct product version (input_hash).
    columns:
      - name: input_hash
        data_tests: [unique, not_null]
  - name: mart_market
    data_tests:
      - unique:
          arguments: {column_name: "coalesce(origin_country, '') || '|' || coalesce(process, '')"}
  - name: run_completeness
    description: One row per roaster the latest (or as_of_run) run should have tried, and whether it did.
    columns:
      - name: roaster_id
        data_tests: [unique, not_null]
  - name: mart_build_profile
    description: This build's catalog and run metrics; appended to the lake's builds table, where the next builds'
      volume check and anomaly bands read them.
    columns:
      - name: metric
        data_tests: [unique, not_null]
  - name: dim_coffee
    description: Every coffee ever seen, with its latest listing; delisted coffees stay with is_listed = false.
    columns:
      - name: coffee_id
        data_tests: [unique, not_null]
      - name: process
        data_tests:
          - accepted_values: {arguments: {values: [washed, natural, honey, anaerobic, other]}}
      - name: roast_level
        data_tests:
          - accepted_values: {arguments: {values: [light, medium, dark]}}
      - name: catalog_status
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [available, preorder, sold_out, archived, delisted]}}
      - name: enrichment_method
        data_tests:
          - accepted_values: {arguments: {values: [rules, llm]}}
  - name: dim_roaster
    columns:
      - name: roaster_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [opted_out, unreachable, pending, active, no_coffee, no_catalog]}}
  - name: mart_bag
    columns:
      - name: bag_id
        data_tests: [unique, not_null]
  - name: fct_shot
    columns:
      - name: shot_id
        data_tests: [unique, not_null]
      - name: coffee_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_coffee'), field: coffee_id}
              config: {severity: warn}
      - name: rating
        data_tests:
          - accepted_values: {arguments: {values: [1, 2, 3, 4, 5], quote: false}}
      - name: user_id
        data_tests: [not_null]
      - name: grinder_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_equipment'), field: equipment_id}
              config: {severity: warn}
  - name: dim_equipment
    description: Current grinders, machines and baskets per user; retired ones are kept so old shots resolve.
    columns:
      - name: equipment_id
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - accepted_values: {arguments: {values: [grinder, machine, basket]}}
  - name: stg_bags
    columns:
      - name: bag_id
        data_tests: [unique, not_null]
  - name: fct_price_event
    columns:
      - name: coffee_id
        data_tests:
          - not_null
          # A product later reclassified as not coffee leaves dim_coffee but keeps its past events.
          - relationships:
              arguments: {to: ref('dim_coffee'), field: coffee_id}
              config: {severity: warn}
      - name: event
        data_tests:
          - accepted_values: {arguments: {values: [new, relisted, price, availability, removed]}}

  - name: public_coffee
    description: "One row per coffee ever seen from a public roaster, with its latest listing. Delisted and archived coffees stay, marked by catalog_status."
    # Defined by contracts/public-catalog.odcs.yaml (tests/test_contracts.py keeps the two in step). A required
    # column is a not_null constraint too, so DuckDB refuses a null while building the table.
    config:
      contract: {enforced: true}
    columns:
      - name: coffee_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: roaster_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: roaster_name
        data_type: varchar
      - name: roaster_state
        data_type: varchar
      - name: coffee_name
        data_type: varchar
      - name: source_url
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: is_listed
        data_type: boolean
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: in_stock
        data_type: boolean
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: catalog_status
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [available, preorder, sold_out, archived, delisted]}}
      - name: published_at
        data_type: timestamp with time zone
      - name: first_seen
        data_type: date
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: last_seen
        data_type: date
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: weeks_listed
        data_type: bigint
      - name: origin_country
        data_type: varchar
      - name: origin_region
        data_type: varchar
      - name: process
        data_type: varchar
      - name: varietals
        data_type: varchar[]
      - name: elevation_masl_min
        data_type: integer
      - name: elevation_masl_max
        data_type: integer
      - name: roast_level
        data_type: varchar
      - name: tasting_notes
        data_type: varchar[]
      - name: flavor_categories
        data_type: varchar[]
      - name: is_blend
        data_type: boolean
      - name: is_decaf
        data_type: boolean
      - name: min_price_usd
        data_type: double
      - name: price_per_100g
        data_type: double
      - name: bag_sizes_g
        data_type: integer[]
      - name: attributes_source
        data_type: varchar
        data_tests:
          - accepted_values: {arguments: {values: [rules, llm]}}
      - name: is_wholesale
        data_type: boolean
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: release_build_id
        data_type: varchar
      - name: release_run_date
        data_type: date
  - name: public_roaster
    description: "One row per roaster in the registry."
    # Defined by contracts/public-catalog.odcs.yaml (tests/test_contracts.py keeps the two in step).
    config:
      contract: {enforced: true}
    columns:
      - name: roaster_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: roaster_name
        data_type: varchar
      - name: city
        data_type: varchar
      - name: state
        data_type: varchar
      - name: platform
        data_type: varchar
      - name: status
        data_type: varchar
        data_tests:
          - accepted_values: {arguments: {values: [opted_out, unreachable, pending, active, no_coffee, no_catalog]}}
      - name: coffees_listed
        data_type: bigint
      - name: coffees_in_stock
        data_type: bigint
      - name: last_ok_run
        data_type: date
      - name: release_build_id
        data_type: varchar
      - name: release_run_date
        data_type: date
  - name: public_price_event
    description: "Price, availability and listing changes between consecutive successful weekly fetches, per bag size."
    # Defined by contracts/public-catalog.odcs.yaml (tests/test_contracts.py keeps the two in step).
    config:
      contract: {enforced: true}
    data_tests:
      - unique:
          arguments: {column_name: "coffee_id || '|' || variant_id || '|' || run_date || '|' || event"}
    columns:
      - name: run_date
        data_type: date
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: coffee_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('public_coffee'), field: coffee_id}
      - name: roaster_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: variant_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: event
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [new, relisted, price, availability, removed]}}
      - name: price_usd
        data_type: double
      - name: previous_price_usd
        data_type: double
      - name: available
        data_type: boolean
      - name: release_build_id
        data_type: varchar
      - name: release_run_date
        data_type: date
  - name: public_market_weekly
    description: "The current catalog by origin and process: breadth and price spread."
    # Defined by contracts/public-catalog.odcs.yaml (tests/test_contracts.py keeps the two in step).
    config:
      contract: {enforced: true}
    data_tests:
      - unique:
          arguments: {column_name: "coalesce(origin_country, '') || '|' || coalesce(process, '')"}
    columns:
      - name: as_of_run
        data_type: date
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: origin_country
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: process
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: coffees
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: roasters
        data_type: bigint
      - name: in_stock
        data_type: bigint
      - name: median_price_per_100g
        data_type: double
      - name: p10_price_per_100g
        data_type: double
      - name: p90_price_per_100g
        data_type: double
      - name: release_build_id
        data_type: varchar
      - name: release_run_date
        data_type: date

seeds:
  - name: flavor_lexicon
    description: Tasting note -> SCA flavor-wheel-style category. Unknown notes stay uncategorized.
    columns:
      - name: note
        data_tests: [unique]
