version: 2

models:
  - name: stg_runs
    description: One row per successful (roaster, run_date); re-runs of a week collapse here.
  - name: dim_coffee
    description: Every coffee ever seen, with its latest listing; delisted coffees stay with is_listed = false.
    columns:
      - name: coffee_id
        data_tests: [unique, not_null]
      - name: process
        data_tests:
          - accepted_values: {arguments: {values: [washed, natural, honey, anaerobic, other]}}
      - name: roast_level
        data_tests:
          - accepted_values: {arguments: {values: [light, medium, dark]}}
      - name: catalog_status
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [available, preorder, sold_out, archived, delisted]}}
  - name: dim_roaster
    columns:
      - name: roaster_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [opted_out, unreachable, pending, active, no_coffee, no_catalog]}}
  - name: mart_bag
    columns:
      - name: bag_id
        data_tests: [unique, not_null]
  - name: fct_shot
    columns:
      - name: shot_id
        data_tests: [unique, not_null]
      - name: coffee_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_coffee'), field: coffee_id}
              config: {severity: warn}
      - name: rating
        data_tests:
          - accepted_values: {arguments: {values: [1, 2, 3, 4, 5], quote: false}}
      - name: user_id
        data_tests: [not_null]
      - name: grinder_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_equipment'), field: equipment_id}
              config: {severity: warn}
  - name: dim_equipment
    description: Current grinders, machines and baskets per user; retired ones are kept so old shots resolve.
    columns:
      - name: equipment_id
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - accepted_values: {arguments: {values: [grinder, machine, basket]}}
  - name: stg_bags
    columns:
      - name: bag_id
        data_tests: [unique, not_null]
  - name: fct_price_event
    columns:
      - name: coffee_id
        data_tests: [not_null]
      - name: event
        data_tests:
          - accepted_values: {arguments: {values: [new, relisted, price, availability, removed]}}

  - name: public_coffee
    description: Facts-only coffee table for public release. No descriptions, images or personal data.
    columns:
      - name: coffee_id
        data_tests: [unique, not_null]
      - name: source_url
        data_tests: [not_null]
  - name: public_roaster
    columns:
      - name: roaster_id
        data_tests: [unique, not_null]
  - name: public_price_event
    columns:
      - name: coffee_id
        data_tests:
          - relationships:
              arguments: {to: ref('public_coffee'), field: coffee_id}

seeds:
  - name: flavor_lexicon
    description: Tasting note -> SCA flavor-wheel-style category. Unknown notes stay uncategorized.
    columns:
      - name: note
        data_tests: [unique]
