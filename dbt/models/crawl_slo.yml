# The crawl success SLO (#96): its two models' properties and unit tests, kept apart from schema.yml and
# unit_tests.yml. The definition in words: docs/TRIAGE.md, "The crawl success SLO".
version: 2

models:
  - name: crawl_slo_roasters
    description: >-
      The crawl success SLO's population: one row per stored run (up to the run being built) and roaster known when
      that run started, whether it counts in the SLO and how the run left it. Built from the stored runs alone (no
      clock, no earlier build), so the same raw gives the same rows. Read by mart_crawl_slo only; no gate reads it.
    data_tests:
      - unique:
          arguments: {column_name: "run_date || '|' || roaster_id"}
    columns:
      - name: run_date
        description: A stored weekly run, no later than the run being built (as_of_run, else the latest).
        data_tests: [not_null]
      - name: roaster_id
        description: A roaster the run listed or tried, or one the registry listed before the run's first fetch.
        data_tests: [not_null]
      - name: platform
        description: >-
          Its connector, as run_completeness.adapter: the run's latest attempt's, else its latest earlier run's,
          else the one its platform maps to (shopify, woocommerce, squarespace, square_online, else generic).
        data_tests: [not_null]
      - name: status
        description: Its status as this build's raw gives it (dim_roaster.status), not as it was at the run; null
          for a roaster the run tried that the registry lacks.
      - name: counted
        description: It is in the SLO's denominator (excluded_reason is null).
        data_tests: [not_null]
      - name: excluded_reason
        description: >-
          Why it isn't counted. opted_out: no run is expected to fetch it. alias: the same store as its canonical
          roaster, which is counted. no_platform: no connector can be named for it, and the run didn't list or try
          it. Null when counted.
        data_tests:
          - accepted_values:
              arguments: {values: [opted_out, alias, no_platform]}
      - name: expected_by_run
        description: The run listed it (run_manifests) or tried it. False for a roaster the crawl no longer tries
          (unreachable) and any other the run left out; those count as not fetched.
        data_tests: [not_null]
      - name: attempted
        description: The run has a fetch for it (int_roaster_runs), as run_completeness.attempted.
        data_tests: [not_null]
      - name: ok
        description: >-
          The SLO's success: an attempt in the run was ok (int_roaster_runs.ok, as run_completeness.ok). A retry that fixed a failure, a
          partial read and an ok fetch that found no products all count; nothing else does.
        data_tests: [not_null]
      - name: outcome
        description: >-
          ok, or why not: unavailable (found closed, password-protected or disallowed this run), quarantined
          (crashed its crawl twice), challenged (an edge's anti-bot page), failed (any other failed fetch, a parked
          or rate-limited store among them), not_attempted (the run never reached it).
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [ok, unavailable, quarantined, challenged, failed, not_attempted]}
  - name: mart_crawl_slo
    description: >-
      The crawl success SLO per run: the share of known roasters fetched ok, overall (platform 'all', the SLO) and
      per connector, with its Wilson 95% interval, whether it met the target (var crawl_slo_target, 0.99) and the
      error budget left over the window that ends at that run (it and the stored runs before it,
      crawl_slo_window_runs in all). Counted from crawl_slo_roasters, so from the stored runs alone: the same raw
      gives the same rows, and an older run built again gives its numbers again. A benchmark: nothing fails a
      build on it.
    data_tests:
      - unique:
          arguments: {column_name: "run_date || '|' || platform"}
    columns:
      - name: run_date
        description: A stored weekly run. The latest is the run being built (as_of_run, else the latest stored).
        data_tests: [not_null]
      - name: platform
        description: "'all' for the SLO itself, else a connector (crawl_slo_roasters.platform)."
        data_tests: [not_null]
      - name: roasters
        description: The roasters counted (the denominator).
        data_tests: [not_null]
      - name: ok
        description: Those fetched ok.
        data_tests: [not_null]
      - name: failed
        description: Those not fetched ok (roasters - ok).
      - name: sli
        description: ok / roasters.
        data_tests: [not_null]
      - name: sli_low
        description: The lower end of the share's Wilson 95% interval.
      - name: sli_high
        description: The upper end of the share's Wilson 95% interval.
      - name: target
        description: The SLO's target (var crawl_slo_target).
      - name: met
        description: The share is above the target (more than 99%; exactly 99% is a miss).
        data_tests: [not_null]
      - name: burn_rate
        description: >-
          How fast this run spent error budget: (1 - sli) / (1 - target). 1 is exactly the rate the target allows;
          crawl_slo_window_runs is a whole window's budget in one run.
      - name: window_runs
        description: The runs in the window, which ends at this row's run (it and the stored runs before it, at
          most crawl_slo_window_runs). Never anchored on a calendar date or the day of the build.
      - name: window_roasters
        description: The roasters counted over the window's runs.
      - name: window_failed
        description: Those not fetched ok over the window's runs.
      - name: window_sli
        description: The share fetched ok over the window.
      - name: window_budget
        description: The failures the target allows over the window, (1 - target) x window_roasters.
      - name: budget_remaining
        description: >-
          The share of the window's error budget left, 1 - window_failed / window_budget. 1: nothing spent; 0: all
          of it; below 0: overspent (the window is under the target).

unit_tests:
  - name: crawl_slo_counts_every_known_roaster_the_run_should_fetch
    description: >-
      The SLO's definition, case by case (#96), for the run being built (2026-11-02). Counted, and ok: a fetch that
      worked, one whose retry worked (int_roaster_runs.ok), a store with no products, a chain. Counted, and not ok:
      a failed fetch, a store found closed this run, a quarantined one, a challenged one, one the run's manifest
      listed and the run never reached (its connector is its last run's), and one the crawl has stopped trying
      (unreachable: no manifest row, no fetch). Not counted: an opted-out roaster even though the run fetched it, an
      alias, a roaster with no platform that the run didn't list, and a roaster the registry added after the run
      started (no row at all). A roaster with no platform that the run did try counts, and so does one the run
      tried that the registry lacks. The earlier run (10-26) has its own rows, with what was known then; the run
      stored after as_of_run (11-09) has none, and its failed fetch of ok.com changes nothing.
    model: crawl_slo_roasters
    overrides:
      vars:
        as_of_run: "2026-11-02"
      macros:
        # The lake's run manifests, the only lake table the model reads.
        lake: >-
          (select run_date::date as run_date, roaster_id, 'full' as mode
           from (values ('2026-11-02', 'ok.com'), ('2026-11-02', 'skipped.com'), ('2026-11-02', 'failed.com'),
                        ('2026-11-09', 'ok.com')) t(run_date, roaster_id))
    given:
      - input: ref('int_roaster_runs')
        rows:
          - {roaster_id: ok.com, run_date: 2026-11-02, adapter: shopify, ok: true, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: retried.com, run_date: 2026-11-02, adapter: shopify, ok: true, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: nocatalog.com, run_date: 2026-11-02, adapter: generic, ok: true, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: chain.com, run_date: 2026-11-02, adapter: shopify, ok: true, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: failed.com, run_date: 2026-11-02, adapter: woocommerce, ok: false, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: closed.com, run_date: 2026-11-02, adapter: shopify, ok: false, unavailable: true, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: crashed.com, run_date: 2026-11-02, adapter: generic, ok: false, unavailable: false, quarantined: true, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: challenged.com, run_date: 2026-11-02, adapter: woocommerce, ok: false, unavailable: false, quarantined: false, challenge: siteground, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: optedout.com, run_date: 2026-11-02, adapter: shopify, ok: true, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: tried-noplatform.com, run_date: 2026-11-02, adapter: generic, ok: false, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: unlisted.com, run_date: 2026-11-02, adapter: shopify, ok: true, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-02 09:00:00+00"}
          - {roaster_id: skipped.com, run_date: 2026-10-26, adapter: woocommerce, ok: true, unavailable: false, quarantined: false, challenge: null, first_at: "2026-10-26 09:00:00+00"}
          - {roaster_id: ok.com, run_date: 2026-11-09, adapter: shopify, ok: false, unavailable: false, quarantined: false, challenge: null, first_at: "2026-11-09 09:00:00+00"}
      - input: ref('dim_roaster')
        rows:
          - {roaster_id: ok.com, status: active, platform: shopify}
          - {roaster_id: retried.com, status: active, platform: shopify}
          - {roaster_id: nocatalog.com, status: no_catalog, platform: "wix?"}
          - {roaster_id: chain.com, status: active, platform: shopify}
          - {roaster_id: failed.com, status: active, platform: woocommerce}
          - {roaster_id: closed.com, status: active, platform: shopify}
          - {roaster_id: crashed.com, status: active, platform: "wix?"}
          - {roaster_id: challenged.com, status: active, platform: woocommerce}
          - {roaster_id: skipped.com, status: active, platform: "squarespace?"}
          - {roaster_id: optedout.com, status: opted_out, platform: shopify}
          - {roaster_id: tried-noplatform.com, status: unreachable, platform: null}
          - {roaster_id: givenup.com, status: unreachable, platform: "square_online?"}
          - {roaster_id: alias.com, status: alias, platform: shopify}
          - {roaster_id: noplatform.com, status: unreachable, platform: null}
          - {roaster_id: httperror.com, status: unreachable, platform: http_503}
          - {roaster_id: late.com, status: pending, platform: shopify}
      - input: ref('stg_registry')
        rows:
          - {roaster_id: ok.com, first_added: null}
          - {roaster_id: retried.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: nocatalog.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: chain.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: failed.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: closed.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: crashed.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: challenged.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: skipped.com, first_added: "2026-10-01 00:00:00+00"}
          - {roaster_id: optedout.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: tried-noplatform.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: givenup.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: alias.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: noplatform.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: httperror.com, first_added: "2026-10-27 00:00:00+00"}
          - {roaster_id: late.com, first_added: "2026-11-02 10:00:00+00"}
    expect:
      rows:
        - {run_date: 2026-10-26, roaster_id: ok.com, platform: shopify, counted: true, excluded_reason: null, expected_by_run: false, ok: false, outcome: not_attempted}
        - {run_date: 2026-10-26, roaster_id: skipped.com, platform: woocommerce, counted: true, excluded_reason: null, expected_by_run: true, ok: true, outcome: ok}
        - {run_date: 2026-11-02, roaster_id: ok.com, platform: shopify, counted: true, excluded_reason: null, expected_by_run: true, ok: true, outcome: ok}
        - {run_date: 2026-11-02, roaster_id: retried.com, platform: shopify, counted: true, excluded_reason: null, expected_by_run: true, ok: true, outcome: ok}
        - {run_date: 2026-11-02, roaster_id: nocatalog.com, platform: generic, counted: true, excluded_reason: null, expected_by_run: true, ok: true, outcome: ok}
        - {run_date: 2026-11-02, roaster_id: chain.com, platform: shopify, counted: true, excluded_reason: null, expected_by_run: true, ok: true, outcome: ok}
        - {run_date: 2026-11-02, roaster_id: failed.com, platform: woocommerce, counted: true, excluded_reason: null, expected_by_run: true, ok: false, outcome: failed}
        - {run_date: 2026-11-02, roaster_id: closed.com, platform: shopify, counted: true, excluded_reason: null, expected_by_run: true, ok: false, outcome: unavailable}
        - {run_date: 2026-11-02, roaster_id: crashed.com, platform: generic, counted: true, excluded_reason: null, expected_by_run: true, ok: false, outcome: quarantined}
        - {run_date: 2026-11-02, roaster_id: challenged.com, platform: woocommerce, counted: true, excluded_reason: null, expected_by_run: true, ok: false, outcome: challenged}
        - {run_date: 2026-11-02, roaster_id: skipped.com, platform: woocommerce, counted: true, excluded_reason: null, expected_by_run: true, ok: false, outcome: not_attempted}
        - {run_date: 2026-11-02, roaster_id: givenup.com, platform: square_online, counted: true, excluded_reason: null, expected_by_run: false, ok: false, outcome: not_attempted}
        - {run_date: 2026-11-02, roaster_id: tried-noplatform.com, platform: generic, counted: true, excluded_reason: null, expected_by_run: true, ok: false, outcome: failed}
        - {run_date: 2026-11-02, roaster_id: unlisted.com, platform: shopify, counted: true, excluded_reason: null, expected_by_run: true, ok: true, outcome: ok}
        - {run_date: 2026-11-02, roaster_id: optedout.com, platform: shopify, counted: false, excluded_reason: opted_out, expected_by_run: true, ok: true, outcome: ok}
        - {run_date: 2026-11-02, roaster_id: alias.com, platform: shopify, counted: false, excluded_reason: alias, expected_by_run: false, ok: false, outcome: not_attempted}
        - {run_date: 2026-11-02, roaster_id: noplatform.com, platform: generic, counted: false, excluded_reason: no_platform, expected_by_run: false, ok: false, outcome: not_attempted}
        - {run_date: 2026-11-02, roaster_id: httperror.com, platform: generic, counted: false, excluded_reason: no_platform, expected_by_run: false, ok: false, outcome: not_attempted}

  - name: crawl_slo_share_interval_and_target
    description: >-
      The share, its Wilson 95% interval and the target, on the week the issue records (#96: 2,424 of 2,540, 95.43%,
      94.6-96.2%), and the target's edge: 199 of 200 (99.5%) meets it, 198 of 200 (exactly 99%) doesn't ("more than
      99%"). The overall row adds the platforms up, and leaves out the rows that aren't counted. With no earlier
      run the window is this run alone, so the budget left is 1 minus the burn rate.
    model: mart_crawl_slo
    given:
      - input: ref('crawl_slo_roasters')
        format: sql
        rows: |
          select date '2026-11-02' as run_date, 'shopify' as platform, true as counted, i <= 2424 as ok
          from range(1, 2541) t(i)
          union all select date '2026-11-02', 'woocommerce', true, i <= 199 from range(1, 201) t(i)
          union all select date '2026-11-02', 'generic', true, i <= 198 from range(1, 201) t(i)
          union all select date '2026-11-02', 'generic', false, false from range(1, 50) t(i)
    expect:
      rows:
        - {platform: shopify, roasters: 2540, ok: 2424, failed: 116, sli: 0.954331, sli_low: 0.945503, sli_high: 0.961786, met: false, burn_rate: 4.566929, window_runs: 1, budget_remaining: -3.566929}
        - {platform: woocommerce, roasters: 200, ok: 199, failed: 1, sli: 0.995, sli_low: 0.972226, sli_high: 0.999117, met: true, burn_rate: 0.5, window_runs: 1, budget_remaining: 0.5}
        - {platform: generic, roasters: 200, ok: 198, failed: 2, sli: 0.99, sli_low: 0.964278, sli_high: 0.997253, met: false, burn_rate: 1.0, window_runs: 1, budget_remaining: 0.0}
        - {platform: all, roasters: 2940, ok: 2821, failed: 119, sli: 0.959524, sli_low: 0.95178, sli_high: 0.966068, met: false, burn_rate: 4.047619, window_runs: 1, budget_remaining: -3.047619}

  - name: crawl_slo_error_budget_ends_at_each_run
    description: >-
      The error budget's window ends at the row's run: that run and the stored runs before it, crawl_slo_window_runs
      (4) in all, whatever the day of the build. 1,000 roasters a run allow 10 failures a run. Five stored runs fail
      500, 0, 5, 25 and 20. The oldest has left the window by the fifth, whose window allows 40 failures and spent
      50: overspent by a quarter, with this run burning at twice the allowed rate. Each earlier run keeps the
      numbers of the window that ended at it.
    model: mart_crawl_slo
    given:
      - input: ref('crawl_slo_roasters')
        format: sql
        rows: |
          select r.run_date, 'shopify' as platform, true as counted, i > r.failed as ok
          from (values (date '2026-10-05', 500), (date '2026-10-12', 0), (date '2026-10-19', 5),
                       (date '2026-10-26', 25), (date '2026-11-02', 20)) r(run_date, failed)
          cross join range(1, 1001) t(i)
    expect:
      rows:
        - {run_date: 2026-10-05, platform: all, roasters: 1000, failed: 500, met: false, burn_rate: 50.0, window_runs: 1, window_roasters: 1000, window_failed: 500, window_budget: 10.0, budget_remaining: -49.0}
        - {run_date: 2026-10-12, platform: all, roasters: 1000, failed: 0, met: true, burn_rate: 0.0, window_runs: 2, window_roasters: 2000, window_failed: 500, window_budget: 20.0, budget_remaining: -24.0}
        - {run_date: 2026-10-19, platform: all, roasters: 1000, failed: 5, met: true, burn_rate: 0.5, window_runs: 3, window_roasters: 3000, window_failed: 505, window_budget: 30.0, budget_remaining: -15.833333}
        - {run_date: 2026-10-26, platform: all, roasters: 1000, failed: 25, met: false, burn_rate: 2.5, window_runs: 4, window_roasters: 4000, window_failed: 530, window_budget: 40.0, budget_remaining: -12.25}
        - {run_date: 2026-11-02, platform: all, roasters: 1000, failed: 20, met: false, burn_rate: 2.0, window_runs: 4, window_roasters: 4000, window_failed: 50, window_budget: 40.0, budget_remaining: -0.25}
        - {run_date: 2026-10-05, platform: shopify, roasters: 1000, failed: 500, met: false, burn_rate: 50.0, window_runs: 1, window_roasters: 1000, window_failed: 500, window_budget: 10.0, budget_remaining: -49.0}
        - {run_date: 2026-10-12, platform: shopify, roasters: 1000, failed: 0, met: true, burn_rate: 0.0, window_runs: 2, window_roasters: 2000, window_failed: 500, window_budget: 20.0, budget_remaining: -24.0}
        - {run_date: 2026-10-19, platform: shopify, roasters: 1000, failed: 5, met: true, burn_rate: 0.5, window_runs: 3, window_roasters: 3000, window_failed: 505, window_budget: 30.0, budget_remaining: -15.833333}
        - {run_date: 2026-10-26, platform: shopify, roasters: 1000, failed: 25, met: false, burn_rate: 2.5, window_runs: 4, window_roasters: 4000, window_failed: 530, window_budget: 40.0, budget_remaining: -12.25}
        - {run_date: 2026-11-02, platform: shopify, roasters: 1000, failed: 20, met: false, burn_rate: 2.0, window_runs: 4, window_roasters: 4000, window_failed: 50, window_budget: 40.0, budget_remaining: -0.25}
