# The emergency route for the ingestion jobs' image (ingest.Dockerfile). Normally deploy.yml builds, pushes and
# attests it for every commit it deploys (job ingest-image); use this only when that can't run, from a clean
# checkout of main (docs/ingestion/RUNBOOK.md §1, "By hand"):
#   gcloud builds submit --project "$PROJECT" --config ingest.cloudbuild.yaml \
#     --substitutions "_IMAGE=$IMAGE,_GIT_SHA=$(git rev-parse HEAD)" .
#
# - `images:` makes Cloud Build push the image itself, and `requestedVerifyOption: VERIFIED` makes it write signed
#   SLSA build provenance for that image, and fail the build if it can't. Provenance is only written for images
#   pushed through `images:`, never for a `docker push` step, and it needs the Container Analysis API on the
#   project (RUNBOOK.md §1 checks it).
# - DOCKER_BUILDKIT=1: only BuildKit reads ingest.Dockerfile.dockerignore.
# - _GIT_SHA is passed to the build as GIT_SHA; Docker ignores it until ingest.Dockerfile reads it (#124).
steps:
  # Google's docker builder as of 2026-11-13 (`latest` then). Nothing updates this pin: refresh it when you use it.
  - name: gcr.io/cloud-builders/docker@sha256:dccbdf9b7877dc1b66427d769a55fe9d82c21655a88301e5eba3d0754c76d146
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "ingest.Dockerfile", "--build-arg", "GIT_SHA=$_GIT_SHA", "-t", "$_IMAGE", "."]
images: ["$_IMAGE"]
substitutions:
  _GIT_SHA: unknown
options:
  requestedVerifyOption: VERIFIED
