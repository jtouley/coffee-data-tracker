{% extends "base.html" %}
{% block title %}Reset password · registry.coffee{% endblock %}
{% block main %}
  <div class="top"><a class="back" href="/signin">‹ Sign in</a></div>
  <h1 class="serif title mt8">Reset your password</h1>
  <p class="body">Ask {{ owner }} for a reset code. It works once and signs you out everywhere else.</p>
  <form id="reset" class="fill" data-api="/api/reset" novalidate>
    <label class="flabel" for="code">Reset code</label>
    <input class="input code" id="code" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required>
    <label class="flabel" for="password">New password</label>
    <div class="pw">
      <input class="input" id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-h" required>
      <button type="button" data-show aria-controls="password" aria-pressed="false">Show</button>
    </div>
    <div class="fhint" id="password-h">At least 10 characters.</div>
    <div class="hint" id="signin-hint" data-hint role="alert"></div>
    <div class="spacer"></div>
    <div class="dock"><button class="btn primary" type="submit">Set password</button></div>
  </form>
{% endblock %}
