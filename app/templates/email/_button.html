{%- macro button(href, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;"><tr><td style="background:#8a4b1d;border-radius:8px;">
<a href="{{ href }}" style="display:inline-block;padding:14px 24px;font:600 16px/1.2 Archivo,Helvetica,Arial,sans-serif;color:#fff8f0;text-decoration:none;">{{ label }}</a>
</td></tr></table>
{%- endmacro -%}
