  - name: royal_labels_are_read_from_tags_and_body_lines
    description: >-
      "Label: value" at the start of a tag or body line, or of a sentence in one; trailing punctuation dropped, so
      "Region: Huila." and "Region: Huila" are one value; the tags first; prose isn't a label. A non-breaking or other
      Unicode space is whitespace, as it is to Python.
    model: int_royal_labels
    given:
      - input: ref('stg_importer_vocab')
        format: sql
        rows: select * from main.stg_importer_vocab
      - input: ref('stg_importer_cells')
        rows:
          - {week: 2026-11-09, row: 1, importer: royal_coffee, column_name: tags, cell_text: "Region: Huila\nOrganic"}
          - {week: 2026-11-09, row: 1, importer: royal_coffee, column_name: body_text, cell_text: "Region: Huila. Process: Washed.\nAltitude： 1,800 masl"}
          - {week: 2026-11-09, row: 2, importer: royal_coffee, column_name: body_text, cell_text: "Varieties grown nearby include Gesha"}
          - {week: 2026-11-09, row: 3, importer: interamerican, column_name: body_text, cell_text: "Region: Huila"}
          - {week: 2026-11-09, row: 4, importer: royal_coffee, column_name: tags, cell_text: "Origin:\u00a0Colombia\nRegion:\u00a0Huila\u2009\nProcess: Natural\u00a0"}
    expect:
      rows:
        - {row: 1, label: region, label_value: Huila}
        - {row: 1, label: process, label_value: Washed}
        - {row: 1, label: altitude, label_value: "1,800 masl"}
        - {row: 4, label: origin, label_value: Colombia}
        - {row: 4, label: region, label_value: Huila}
        - {row: 4, label: process, label_value: Natural}

