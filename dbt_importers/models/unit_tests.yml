  - name: interamerican_name_states_origin_region_process_grade_and_screen
    description: >-
      The country leads (an alias read as its country); a region of that country from the catalog's list, else an
      island alias after the country; the process words as written ("Decaf" for a decaf); grade and preparation words;
      one screen range. Abstains on a misspelled country, a blend, two countries, a region of another country or not in
      the catalog's list, a farm named after a region, a bare letter grade and a number that isn't a screen range or
      may be a crop year (19/20). Java and Flores are a variety and a farm name there, never a second country.
    model: int_importer_name_rules
    given:
      - input: ref('stg_importer_vocab')
        format: sql
        rows: select * from main.stg_importer_vocab
