  # Royal Coffee: titles in the real listing's shapes, every value invented (no real title, lot ID, warehouse or
  # producer). The shapes: "<ORIGIN ...name> - [*contract*] - <lot ID> - [bags] - [shipment or ETA] - [SPOT] <WAREHOUSE>".
  - name: royal_title_states_lot_warehouse_status_and_arrival
    description: >-
      Royal's lot ID is the part that is five digits (a split lot's suffix kept), never a producer's "Lot 3" or a
      starred contract number; two different IDs abstain. The warehouse is the last part in capitals, without SPOT,
      only on a title with a lot ID part (a year isn't one); SPOT is status spot. An ETA date or a delivery month is the arrival, as written,
      when it parses; a shipment month is when the lot leaves origin, so it gives none.
    model: int_royal_rules
    given:
      - input: ref('stg_importer_vocab')
        format: sql
        rows: select * from main.stg_importer_vocab
      - input: ref('stg_importer_cells')
        rows:
          - {week: 2026-11-09, row: 1, importer: royal_coffee, column_name: title, cell_text: "COLOMBIA FT-FLO/USA ORGANIC HUILA EXAMPLE - *54321* - 12345 - 69.0 kg GrainPro Bags - SPOT EXAMPLEWHSE"}
