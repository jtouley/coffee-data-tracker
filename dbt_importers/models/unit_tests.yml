  - name: royal_process_and_certifications_from_title_and_tags
    description: >-
      The process tag as written; decaf only from the title, tags or product type (sugar cane in the body's prose
      doesn't null a natural lot); anaerobic wins; a title naming another process than its tag abstains. FT, FT-FLO,
      FT-USA and FT-FLO/USA are fair trade; a program we don't model (Bird Friendly) makes the list unknown.
    model: int_royal_rules
    given:
      - input: ref('stg_importer_vocab')
        format: sql
        rows: select * from main.stg_importer_vocab
      - input: ref('stg_importer_cells')
