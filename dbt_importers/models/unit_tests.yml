  - name: offers_origin_is_one_convention
    description: >-
      Every importer's origin is the catalog's country: Cafe Imports' "Sumatra" is Indonesia and "DR Congo" the
      Democratic Republic of the Congo, kept as written in origin_as_written; a spelling the catalog doesn't know is
      null. Every lot stays a row, with its key and flags carried from int_importer_lots and dim_importer_lot.
    model: importer_offers
    given:
      - input: ref('stg_importer_vocab')
        format: sql
        rows: select * from main.stg_importer_vocab
      - input: ref('stg_importer_lots')
        rows:
          - {week: 2026-11-09, importer: cafe_imports, row: 1}
          - {week: 2026-11-09, importer: cafe_imports, row: 2}
          - {week: 2026-11-09, importer: cafe_imports, row: 3}
          - {week: 2026-11-09, importer: interamerican, row: 4}
          - {week: 2026-11-09, importer: royal_coffee, row: 5}
      - input: ref('int_importer_stated')
        rows:
          - {week: 2026-11-09, importer: cafe_imports, row: 1, origin: Sumatra}
          - {week: 2026-11-09, importer: cafe_imports, row: 2, origin: "DR Congo "}
          - {week: 2026-11-09, importer: cafe_imports, row: 3, origin: Atlantis}
          - {week: 2026-11-09, importer: interamerican, row: 4, origin: null}
          - {week: 2026-11-09, importer: royal_coffee, row: 5, origin: null}
      - input: ref('int_importer_rules')
        rows:
          - {week: 2026-11-09, importer: cafe_imports, row: 1}
          - {week: 2026-11-09, importer: cafe_imports, row: 2}
          - {week: 2026-11-09, importer: cafe_imports, row: 3}
          - {week: 2026-11-09, importer: interamerican, row: 4}
          - {week: 2026-11-09, importer: royal_coffee, row: 5}
      - input: ref('int_importer_name_rules')
        rows:
          - {week: 2026-11-09, importer: interamerican, row: 4, origin: Brazil}
      - input: ref('int_royal_rules')
        rows:
          - {week: 2026-11-09, importer: royal_coffee, row: 5, origin: Timor-Leste}
      - input: ref('int_importer_lots')
        rows:
          - {week: 2026-11-09, importer: cafe_imports, row: 1, lot_key: "cafe_imports:10001", is_available: true}
          - {week: 2026-11-09, importer: cafe_imports, row: 2, lot_key: "cafe_imports:10002", is_available: false}
          - {week: 2026-11-09, importer: cafe_imports, row: 3, lot_key: "cafe_imports:10003", is_available: null}
          - {week: 2026-11-09, importer: interamerican, row: 4, lot_key: "interamerican:x#1", is_available: true}
          - {week: 2026-11-09, importer: royal_coffee, row: 5, lot_key: "royal_coffee:9001", is_available: false}
      - input: ref('dim_importer_lot')
        rows:
          - {importer: cafe_imports, lot_key: "cafe_imports:10001", currently_offered: true}
          - {importer: cafe_imports, lot_key: "cafe_imports:10002", currently_offered: false}
          - {importer: cafe_imports, lot_key: "cafe_imports:10003", currently_offered: false}
          - {importer: interamerican, lot_key: "interamerican:x#1", currently_offered: true}
          - {importer: royal_coffee, lot_key: "royal_coffee:9001", currently_offered: false}
    expect:
      rows:
        - {row: 1, origin: Indonesia, origin_as_written: Sumatra, is_available: true, currently_offered: true}
        - {row: 2, origin: Democratic Republic of the Congo, origin_as_written: "DR Congo ", is_available: false, currently_offered: false}
        - {row: 3, origin: null, origin_as_written: Atlantis, is_available: null, currently_offered: false}
        - {row: 4, origin: Brazil, origin_as_written: null, is_available: true, currently_offered: true}
        - {row: 5, origin: Timor-Leste, origin_as_written: null, is_available: false, currently_offered: false}

  - name: lots_keep_a_stable_key_and_say_whether_offered
    description: >-
      Royal's key is its Shopify id, Cafe Imports' its lot ID, InterAmerican's its name, warehouse and bag size with
      an ordinal for identical rows. Royal is available when a variant is; the others when bags remain.
    model: int_importer_lots
    given:
      - input: ref('stg_importer_lots')
        rows:
          - {week: 2026-11-09, importer: royal_coffee, row: 1, source_key: "9000000000001"}
          - {week: 2026-11-09, importer: cafe_imports, row: 2, source_key: "2"}
          - {week: 2026-11-09, importer: interamerican, row: 3, source_key: "3"}
          - {week: 2026-11-09, importer: interamerican, row: 4, source_key: "4"}
          - {week: 2026-11-09, importer: cafe_imports, row: 5, source_key: "5"}
      - input: ref('int_importer_stated')
        rows:
          - {week: 2026-11-09, importer: royal_coffee, row: 1, lot_id: null, name: Example, bags: null}
          - {week: 2026-11-09, importer: cafe_imports, row: 2, lot_id: 12345-2, name: Example, bags: 0}
          - {week: 2026-11-09, importer: interamerican, row: 3, name: Brazil Example Natural, warehouse: Example Port, bag_size: 60 Kg, bags: 4}
          - {week: 2026-11-09, importer: interamerican, row: 4, name: Brazil Example Natural, warehouse: Example Port, bag_size: 60 Kg, bags: 2}
          - {week: 2026-11-09, importer: cafe_imports, row: 5, lot_id: null, name: Example Lot, bags: null}
      - input: ref('int_royal_rules')
        rows:
          - {week: 2026-11-09, importer: royal_coffee, row: 1, available: true}
    expect:
      rows:
        - {row: 1, lot_key: "royal_coffee:9000000000001", is_available: true}
        - {row: 2, lot_key: "cafe_imports:12345-2", is_available: false}
        - {row: 3, lot_key: "interamerican:brazil example natural|example port|60 kg#1", is_available: true}
        - {row: 4, lot_key: "interamerican:brazil example natural|example port|60 kg#2", is_available: true}
        - {row: 5, lot_key: "cafe_imports:name:example lot", is_available: null}

  - name: dim_lot_keeps_every_lot_and_flags_the_ones_offered_now
    description: >-
      Every lot ever stored is a row, available or not. is_available is its last seen week's; currently_offered only
      when that week is its importer's latest and it was available then.
    model: dim_importer_lot
    given:
      - input: ref('int_importer_lots')
        rows:
          - {week: 2026-11-09, importer: royal_coffee, row: 1, lot_key: "royal_coffee:1", is_available: true}
          - {week: 2026-11-16, importer: royal_coffee, row: 1, lot_key: "royal_coffee:1", is_available: false}
          - {week: 2026-11-09, importer: royal_coffee, row: 2, lot_key: "royal_coffee:2", is_available: true}
          - {week: 2026-11-16, importer: royal_coffee, row: 3, lot_key: "royal_coffee:3", is_available: true}
          - {week: 2026-11-09, importer: cafe_imports, row: 1, lot_key: "cafe_imports:1", is_available: true}
    expect:
      rows:
        - {lot_key: "royal_coffee:1", first_seen_week: 2026-11-09, last_seen_week: 2026-11-16, weeks_seen: 2, is_available: false, currently_offered: false}
        - {lot_key: "royal_coffee:2", first_seen_week: 2026-11-09, last_seen_week: 2026-11-09, weeks_seen: 1, is_available: true, currently_offered: false}
        - {lot_key: "royal_coffee:3", first_seen_week: 2026-11-16, last_seen_week: 2026-11-16, weeks_seen: 1, is_available: true, currently_offered: true}
        - {lot_key: "cafe_imports:1", first_seen_week: 2026-11-09, last_seen_week: 2026-11-09, weeks_seen: 1, is_available: true, currently_offered: true}
