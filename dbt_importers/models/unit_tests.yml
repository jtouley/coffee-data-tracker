# The importer rules on hand-written lots: where each decides and where it abstains (not how often it is right: that
# needs a CLAUDE.md evaluation). The rules' vocabulary is the real one (stg_importer_vocab, built from importer_rules,
# extract.py and origins.py before these run), never a copy. Product names are trimmed from real lots' names or made
# up; Royal's are invented.
unit_tests:
  - name: importer_process_decides_or_abstains
    description: >-
      process_type: anaerobic wins; pulped natural, semi-washed and wet-hulled are honey; the process column decides,
      else the name; decaf, a mix, a misspelling or nothing stated abstains.
    model: int_importer_rules
    given:
      - input: ref('stg_importer_vocab')
        format: sql
        rows: select * from main.stg_importer_vocab
      - input: ref('int_importer_inputs')
        rows:
          - {week: 2026-11-09, importer: cafe_imports, row: 1, rule_stated_process: Natural, rule_name: "Karana - Carbonic Maceration - Anaerobic - Natural"}
          - {week: 2026-11-09, importer: cafe_imports, row: 2, rule_stated_process: Wet-Hulled, rule_name: Sumatra Lintong}
          - {week: 2026-11-09, importer: cafe_imports, row: 3, rule_stated_process: Pulped Natural, rule_name: Fazenda X}
          - {week: 2026-11-09, importer: cafe_imports, row: 4, rule_stated_process: Semi-Washed, rule_name: Sumatra}
          - {week: 2026-11-09, importer: cafe_imports, row: 5, rule_stated_process: Washed, rule_name: "Gakenke - Kayanza - Washed"}
          - {week: 2026-11-09, importer: cafe_imports, row: 6, rule_stated_process: null, rule_name: Ethiopia Yirgacheffe G2 Washed}
          - {week: 2026-11-09, importer: cafe_imports, row: 7, rule_stated_process: Decaf, rule_name: Mountain Water Process}
          - {week: 2026-11-09, importer: cafe_imports, row: 8, rule_stated_process: Washed, rule_name: Colombia Decaf Sugarcane}
          - {week: 2026-11-09, importer: cafe_imports, row: 9, rule_stated_process: null, rule_name: Mexico Mountain Water Decaf Natural}
          - {week: 2026-11-09, importer: cafe_imports, row: 10, rule_stated_process: null, rule_name: Costa Rica Sonora Honey Natural}
          - {week: 2026-11-09, importer: cafe_imports, row: 11, rule_stated_process: null, rule_name: Brazil Cerrado 17/18 Natrual}
          - {week: 2026-11-09, importer: cafe_imports, row: 12, rule_stated_process: null, rule_name: Colombia Supremo}
          - {week: 2026-11-09, importer: cafe_imports, row: 13, rule_stated_process: null, rule_name: null}
    expect:
      rows:
        - {row: 1, process_type: anaerobic}
        - {row: 2, process_type: honey}
        - {row: 3, process_type: honey}
        - {row: 4, process_type: honey}
        - {row: 5, process_type: washed}
        - {row: 6, process_type: washed}
        - {row: 7, process_type: null}
        - {row: 8, process_type: null}
        - {row: 9, process_type: null}
        - {row: 10, process_type: null}
        - {row: 11, process_type: null}
        - {row: 12, process_type: null}
        - {row: 13, process_type: null}

