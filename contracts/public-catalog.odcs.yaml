# ODCS data contract for the public catalog tables. dbt enforces it: tests/test_contracts.py fails when
# dbt's contracts, tests or thresholds disagree with this file, so change this file first.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-public-catalog
name: Coffee Data public catalog
version: 2.2.2
status: active
domain: coffee
tags: [coffee, specialty-coffee, prices, weekly, open-data]
description:
  purpose: 'Weekly facts about US specialty coffee roasters'' catalogs: what is listed, in stock, at what price,
    and how that changes.'
  usage: Analysis of the specialty coffee market. Every coffee links back to its roaster.
  limitations: Weekly snapshots. Attributes come from rules and an LLM over roasters' own text. catalog_status 'archived'
    relies on roasters' tags; untagged back catalog shows as sold_out.
context:
  instructions: >-
    Weekly facts about the public catalogs of US specialty coffee roasters in this project's registry, not every US
    roaster. Every row is as of one weekly run (release_run_date), which was at most max_run_age_days (8) days old
    when its release was built; it is never live, and if a later release fails its checks the previous one stays
    served, so always say which release_run_date a row is as of. Prices are USD as listed on the roaster's own store.
    Origin, process, varietals, roast level and tasting notes come from rules or an LLM reading the roaster's own
    text (attributes_source), so they can be wrong or missing; a null means not stated, never "none" (is_blend and
    is_decaf read false, and flavor_categories empty, when the text doesn't say). When recommending a coffee, give
    its source_url so the user can check the roaster's own page. public_coffee and public_price_event join to
    public_roaster on roaster_id; public_price_event joins to public_coffee on coffee_id. The data is licensed
    under CDLA-Permissive-2.0 (https://github.com/jtouley/coffee-data-tracker/blob/main/LICENSE-DATA), with
    attribution in docs/ATTRIBUTION.md; the code is MIT.
  constraints:
  - id: not-live
    constraint: Do not present any row as current stock or price; say which release_run_date it is as of.
  - id: facts-only
    constraint: Do not reproduce or reconstruct roasters' product descriptions, images or store handles, and do not
      look for personal data.
  - id: no-quality-verdicts
    constraint: Do not rank or judge roasters or coffees as best or worst; the data holds catalog facts, not quality.
  - id: no-purchasing
    constraint: Do not claim to buy, order or reserve coffee; point to the coffee's source_url on the roaster's store.
  - id: no-opted-out-roasters
    constraint: Never mention roasters with status opted_out, or their coffees, or count them, even in questions
      about the registry.
  verifiedStatements:
  - id: new-this-week
    question: What coffees appeared this week?
schema:
- name: public_coffee
  physicalName: public_coffee
  physicalType: table
  description: One row per coffee ever seen from a public roaster, with its latest listing. Delisted and archived
    coffees stay, marked by catalog_status.
  synonyms:
  - synonym: beans
  - synonym: coffees
  - synonym: listings
  context:
    instructions: >-
      One row per coffee ever seen, including sold out, archived and delisted ones. For coffees someone can buy
      now, filter catalog_status IN ('available', 'preorder') AND is_wholesale = false; wholesale listings are also
      left out of market counts and new arrivals. Match broad flavours (e.g. fruity) on flavor_categories.
      tasting_notes are normalized descriptors taken from the roaster's text (lowercased, split and shortened),
      not the roaster's exact words. For price questions give both, labelled: price_per_100g
      (the cheapest available retail bag of 150 g to 2.5 kg, per 100 g) to compare coffees, and min_price_usd for
      the cheapest listed bag (any size, possibly sold out).
    verifiedStatements:
    - id: washed-ethiopian-now
      question: Which washed Ethiopian coffees can I buy right now?
    - id: fruity-light-under-20
      question: Show me fruity light roasts under $20 a bag.
    - id: single-origin-decaf
      question: Which roasters sell a single-origin decaf?
  properties:
  - name: coffee_id
    logicalType: string
    physicalType: varchar
    description: <roaster domain>:<store product id>; stable across runs and renames.
    primaryKey: true
    primaryKeyPosition: 1
    unique: true
    required: true
  - name: roaster_id
    logicalType: string
    physicalType: varchar
    description: The roaster's normalized domain.
    required: true
  - name: roaster_name
    logicalType: string
    physicalType: varchar
    description: Roaster name.
  - name: roaster_state
    logicalType: string
    physicalType: varchar
    description: US state code of the roaster, where known.
  - name: coffee_name
    logicalType: string
    physicalType: varchar
    description: The coffee's name as the roaster lists it, cleaned of markup.
  - name: source_url
    logicalType: string
    physicalType: varchar
    description: The coffee's page on the roaster's own store (http or https only).
    required: true
  - name: is_listed
    logicalType: boolean
    physicalType: boolean
    description: In the roaster's latest successful catalog fetch, or, when the fetches since then read only part
      of the catalog (partial), in one of those or in the latest complete fetch before them. A roaster whose
      fetches have all been partial keeps every coffee it ever listed until a complete fetch lands.
    required: true
  - name: in_stock
    logicalType: boolean
    physicalType: boolean
    description: Listed, with at least one bag size available.
    required: true
  - name: catalog_status
    logicalType: string
    physicalType: varchar
    description: available or preorder (buyable now), sold_out, archived (the roaster's own back-catalog tag), or
      delisted.
    required: true
    enum:
    - value: available
    - value: preorder
    - value: sold_out
    - value: archived
    - value: delisted
  - name: published_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: The store's latest publish time for the product (Shopify stores only).
  - name: first_seen
    logicalType: date
    physicalType: date
    description: First weekly run that listed it.
    required: true
  - name: last_seen
    logicalType: date
    physicalType: date
    description: Latest weekly run that listed it.
    required: true
  - name: weeks_listed
    logicalType: integer
    physicalType: bigint
    description: Weekly runs that listed it.
  - name: origin_country
    logicalType: string
    physicalType: varchar
    description: Origin country, from the rules or Claude's extraction.
  - name: origin_region
    logicalType: string
    physicalType: varchar
    description: Origin region.
  - name: process
    logicalType: string
    physicalType: varchar
    description: washed, natural, honey, anaerobic or other.
    synonyms:
    - synonym: processing method
  - name: varietals
    logicalType: array
    physicalType: varchar[]
    description: Coffee varietals.
    items:
      logicalType: string
  - name: elevation_masl_min
    logicalType: integer
    physicalType: integer
    description: Lowest growing elevation, metres above sea level.
    customProperties:
    - property: unit
      value: m
      description: UCUM unit code (metres above sea level).
  - name: elevation_masl_max
    logicalType: integer
    physicalType: integer
    description: Highest growing elevation, metres above sea level.
    customProperties:
    - property: unit
      value: m
      description: UCUM unit code (metres above sea level).
  - name: roast_level
    logicalType: string
    physicalType: varchar
    description: light, medium or dark.
    synonyms:
    - synonym: roast
  - name: tasting_notes
    logicalType: array
    physicalType: varchar[]
    description: Tasting notes as normalized descriptors taken from the roaster's text (lowercased, split, shortened).
    items:
      logicalType: string
  - name: flavor_categories
    logicalType: array
    physicalType: varchar[]
    description: Flavor-wheel categories of the tasting notes.
    items:
      logicalType: string
  - name: is_blend
    logicalType: boolean
    physicalType: boolean
    description: A blend of origins.
  - name: is_decaf
    logicalType: boolean
    physicalType: boolean
    description: Decaffeinated.
  - name: min_price_usd
    logicalType: number
    physicalType: double
    description: Cheapest listed bag of any size, USD; the bag may be sold out.
    customProperties:
    - property: currency
      value: USD
      description: ISO 4217 currency code.
    synonyms:
    - synonym: bag price
    - synonym: cheapest bag
  - name: price_per_100g
    logicalType: number
    physicalType: double
    description: Cheapest available retail bag (150 g to 2.5 kg) per 100 g, USD.
    customProperties:
    - property: currency
      value: USD
      description: ISO 4217 currency code.
    - property: perQuantity
      value: '100.g'
      description: UCUM unit code; the price is per 100 grams of coffee.
    synonyms:
    - synonym: unit price
  - name: bag_sizes_g
    logicalType: array
    physicalType: integer[]
    description: Bag sizes on offer, grams.
    customProperties:
    - property: unit
      value: g
      description: UCUM unit code (grams, for each bag size).
    items:
      logicalType: integer
  - name: attributes_source
    logicalType: string
    physicalType: varchar
    description: 'Where origin, process and notes came from: rules, or llm (Claude).'
    enum:
    - value: rules
    - value: llm
  - name: is_wholesale
    logicalType: boolean
    physicalType: boolean
    description: >-
      A wholesale listing: a bulk bag or case the roaster sells to cafes, often the twin of one of its retail
      coffees. Kept here, flagged; left out of the site, the app's picker, market counts and new arrivals.
    required: true
  - name: release_build_id
    logicalType: string
    physicalType: varchar
    description: The build that produced this row (coffeedata build-diff and rollback refer to it).
  - name: release_run_date
    logicalType: date
    physicalType: date
    description: The weekly run that build checked; every row of a release has the same value.
  quality:
  - type: custom
    engine: dbt
    implementation: tests/catalog_volume_vs_last_build.sql
    dimension: consistency
    severity: error
    description: Listed coffees, in-stock coffees and roasters move at most volume_tolerance from the last passing
      release.
  - type: custom
    engine: dbt
    implementation: tests/run_is_complete.sql
    dimension: completeness
    severity: error
    description: Every roaster the weekly run should have tried has an attempt (share >= min_attempted_share).
  - type: custom
    engine: dbt
    implementation: tests/run_ok_rate.sql
    dimension: completeness
    severity: error
    description: At least min_ok_share of the expected roasters that have a catalog were fetched with products
      (no_catalog stores are not counted).
  - type: custom
    engine: dbt
    implementation: tests/adapter_ok_rate.sql
    dimension: completeness
    severity: error
    description: Each adapter with at least min_adapter_roasters roasters that have a catalog fetched at least
      min_adapter_ok_share of them, so one platform's outage fails the run.
  - type: custom
    engine: dbt
    implementation: tests/build_metrics_in_band.sql
    dimension: consistency
    severity: warning
    description: The ok shares (overall and per adapter, low side) and the volume metrics lie within median +/-
      band_k x 1.4826 x MAD of the recent passing builds since the last accepted change; active per metric once it
      has band_min_builds builds of history, with the fixed thresholds as hard floors either way. Warns only;
      band_k is recalibrated on 8-12 weeks of real history before a band can block a release.
  - type: custom
    engine: dbt
    implementation: tests/latest_run_is_fresh.sql
    dimension: timeliness
    severity: error
    description: The newest counted run is at most max_run_age_days old.
  - type: custom
    engine: dbt
    implementation: tests/public_tables_are_facts_only.sql
    dimension: conformity
    severity: error
    description: No descriptions, images, store handles or personal data in any public table.
- name: public_roaster
  physicalName: public_roaster
  physicalType: table
  description: >-
    One row per published roaster from the registry: not opted out, with at least one coffee seen, and known from a
    source that may be redistributed (Overture, the curated seed or a manual add, not OpenStreetMap alone).
  synonyms:
  - synonym: roasteries
  - synonym: coffee roasters
  context:
    instructions: >-
      One row per published roaster in the registry (opted-out roasters are never in it). Treat only status =
      'active' as current roasters; mention other statuses only if asked, and never opted_out. state is a US state
      code.
    verifiedStatements:
    - id: colorado-in-stock
      question: Which roasters in Colorado have coffee in stock?
    - id: roaster-current-catalog
      question: What does a given roaster currently sell?
  properties:
  - name: roaster_id
    logicalType: string
    physicalType: varchar
    description: The roaster's normalized domain.
    primaryKey: true
    primaryKeyPosition: 1
    unique: true
    required: true
  - name: roaster_name
    logicalType: string
    physicalType: varchar
    description: Roaster name.
  - name: city
    logicalType: string
    physicalType: varchar
    description: City.
  - name: state
    logicalType: string
    physicalType: varchar
    description: US state code.
  - name: platform
    logicalType: string
    physicalType: varchar
    description: Store platform (shopify, woocommerce, squarespace, square_online, generic).
  - name: status
    logicalType: string
    physicalType: varchar
    description: Derived from probe and fetch history.
    enum:
    - value: opted_out
    - value: unreachable
    - value: pending
    - value: active
    - value: no_coffee
    - value: no_catalog
  - name: coffees_listed
    logicalType: integer
    physicalType: bigint
    description: Coffees in its current catalog (listed, not archived).
  - name: coffees_in_stock
    logicalType: integer
    physicalType: bigint
    description: Coffees in stock.
  - name: last_ok_run
    logicalType: date
    physicalType: date
    description: Latest weekly run with a successful catalog fetch.
  - name: release_build_id
    logicalType: string
    physicalType: varchar
    description: The build that produced this row (coffeedata build-diff and rollback refer to it).
  - name: release_run_date
    logicalType: date
    physicalType: date
    description: The weekly run that build checked; every row of a release has the same value.
- name: public_price_event
  physicalName: public_price_event
  physicalType: table
  description: Price, availability and listing changes between consecutive successful weekly fetches, per bag size.
    A fetch that read only part of a catalog (partial) never removes a bag; removals and relistings are read
    against complete fetches, so they agree with public_coffee.is_listed.
  properties:
  - name: run_date
    logicalType: date
    physicalType: date
    description: Weekly run in which the change was seen.
    primaryKey: true
    primaryKeyPosition: 3
    required: true
  - name: coffee_id
    logicalType: string
    physicalType: varchar
    description: The coffee (public_coffee.coffee_id).
    primaryKey: true
    primaryKeyPosition: 1
    required: true
  - name: roaster_id
    logicalType: string
    physicalType: varchar
    description: The roaster (public_roaster.roaster_id).
    required: true
  - name: variant_id
    logicalType: string
    physicalType: varchar
    description: >-
      The store's own id for one bag size of the coffee (its Shopify or WooCommerce "variant" id), so price changes
      to the 10 oz and the 2 lb bag are told apart. A store fact, not personal data.
    primaryKey: true
    primaryKeyPosition: 2
    required: true
  - name: event
    logicalType: string
    physicalType: varchar
    description: new, relisted, price, availability or removed.
    primaryKey: true
    primaryKeyPosition: 4
    required: true
    enum:
    - value: new
    - value: relisted
    - value: price
    - value: availability
    - value: removed
  - name: price_usd
    logicalType: number
    physicalType: double
    description: Price after the change, USD.
    customProperties:
    - property: currency
      value: USD
      description: ISO 4217 currency code.
  - name: previous_price_usd
    logicalType: number
    physicalType: double
    description: Price before the change, USD.
    customProperties:
    - property: currency
      value: USD
      description: ISO 4217 currency code.
  - name: available
    logicalType: boolean
    physicalType: boolean
    description: Availability after the change.
  - name: release_build_id
    logicalType: string
    physicalType: varchar
    description: The build that produced this row (coffeedata build-diff and rollback refer to it).
  - name: release_run_date
    logicalType: date
    physicalType: date
    description: The weekly run that build checked; every row of a release has the same value.
- name: public_market_weekly
  physicalName: public_market_weekly
  physicalType: table
  description: 'The current catalog by origin and process: breadth and price spread.'
  properties:
  - name: as_of_run
    logicalType: date
    physicalType: date
    description: Weekly run the summary describes.
    required: true
  - name: origin_country
    logicalType: string
    physicalType: varchar
    description: Origin country.
    primaryKey: true
    primaryKeyPosition: 1
    required: true
  - name: process
    logicalType: string
    physicalType: varchar
    description: Process, or unknown.
    primaryKey: true
    primaryKeyPosition: 2
    required: true
  - name: coffees
    logicalType: integer
    physicalType: bigint
    description: Coffees in the current catalog (single origins, not archived).
    required: true
  - name: roasters
    logicalType: integer
    physicalType: bigint
    description: Roasters offering them.
  - name: in_stock
    logicalType: integer
    physicalType: bigint
    description: Of which in stock.
  - name: median_price_per_100g
    logicalType: number
    physicalType: double
    description: Median price per 100 g, USD.
    customProperties:
    - property: currency
      value: USD
      description: ISO 4217 currency code.
    - property: perQuantity
      value: '100.g'
      description: UCUM unit code; the price is per 100 grams of coffee.
  - name: p10_price_per_100g
    logicalType: number
    physicalType: double
    description: 10th percentile price per 100 g, USD.
    customProperties:
    - property: currency
      value: USD
      description: ISO 4217 currency code.
    - property: perQuantity
      value: '100.g'
      description: UCUM unit code; the price is per 100 grams of coffee.
  - name: p90_price_per_100g
    logicalType: number
    physicalType: double
    description: 90th percentile price per 100 g, USD.
    customProperties:
    - property: currency
      value: USD
      description: ISO 4217 currency code.
    - property: perQuantity
      value: '100.g'
      description: UCUM unit code; the price is per 100 grams of coffee.
  - name: release_build_id
    logicalType: string
    physicalType: varchar
    description: The build that produced this row (coffeedata build-diff and rollback refer to it).
  - name: release_run_date
    logicalType: date
    physicalType: date
    description: The weekly run that build checked; every row of a release has the same value.
slaProperties:
- property: frequency
  value: 7
  unit: d
  description: A weekly run (Mondays).
- property: latency
  value: 8
  unit: d
  description: Served data comes from a run at most this old (max_run_age_days).
- property: retention
  value: 4
  unit: w
  description: 'Rollback window: the last 4 weekly releases can be served again (coffeedata rollback).'
customProperties:
- property: volume_tolerance
  value: 0.2
- property: min_attempted_share
  value: 1.0
- property: min_ok_share
  value: 0.9
- property: min_adapter_ok_share
  value: 0.5
- property: min_adapter_roasters
  value: 20
- property: band_k
  value: 1.5
- property: band_min_builds
  value: 6
- property: max_run_age_days
  value: 8
- property: servingPolicy
  value: A release is served only when every quality rule passes; otherwise the previous release stays served.
- property: license
  value: CDLA-Permissive-2.0
  description: SPDX identifier of the public data's licence (LICENSE-DATA). The code is MIT.
authoritativeDefinitions:
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/LICENSE-DATA
  type: license
  description: CDLA-Permissive-2.0, the licence of the public data (these tables, their exports, the site's catalog
    JSON and the marketplace shares). The code is MIT.
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/docs/ATTRIBUTION.md
  type: attribution
  description: Data attribution (Overture Maps, OpenStreetMap, roasters' storefronts). The data is licensed under
    CDLA-Permissive-2.0 (LICENSE-DATA); the code is MIT.
servers:
- id: huggingface
  server: huggingface-public-dataset
  type: custom
  environment: planned
  description: 'Planned, not yet published: the public Hugging Face dataset jtouley/us-coffee-market, one Parquet
    file per table under data/ and manifest.json, replaced by each weekly release. Read it over HTTPS or as
    hf://datasets/jtouley/us-coffee-market/data/<table>.parquet.'
  location: https://huggingface.co/datasets/jtouley/us-coffee-market
  path: data/{model}.parquet
  format: parquet
  customProperties:
  - property: status
    value: planned
- id: snowflake-share
  server: snowflake-marketplace
  type: custom
  environment: planned
  description: 'Planned: the Snowflake share COFFEE_DATA_SHARE of COFFEE_DATA.SHARE, secure views over the loaded
    tables in COFFEE_DATA.MARKET (marketplace/snowflake/admin_setup.sql). The views drop the public_ prefix:
    coffee_data.share.coffee is public_coffee, share.price_event is public_price_event, share.market_weekly is
    public_market_weekly and share.roaster is public_roaster (see the viewMapping property). The Marketplace listing
    is a draft (marketplace/LISTING.md).'
  database: COFFEE_DATA
  schema: SHARE
  customProperties:
  - property: status
    value: planned
  - property: platform
    value: snowflake
  - property: share
    value: COFFEE_DATA_SHARE
  - property: viewMapping
    value:
      coffee_data.share.coffee: public_coffee
      coffee_data.share.price_event: public_price_event
      coffee_data.share.market_weekly: public_market_weekly
      coffee_data.share.roaster: public_roaster
team:
  name: registry.coffee
  members:
  - username: jtouley
    name: Jason Touleyrou
    role: owner
support:
- channel: issues
  url: https://github.com/jtouley/coffee-data-tracker/issues
  description: Questions and data issues
