# Internal ODCS contract, generated by src/coffeedata/raw_contracts.py from lake.SCHEMAS and contract_docs.py.
# Do not edit: change those and run `make contracts`, or python -m coffeedata.raw_contracts --write <name>
# <new version> after a change to names, types, required or enums. tests/test_raw_contracts.py fails when this
# file and the code disagree.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-internal-usage
version: 1.0.0
name: Coffee Data internal usage contract
status: active
domain: coffee
tags:
- internal
description:
  purpose: 'Internal contract between services: the usage collector (app/usage.py, POST /e on its run.app address) -> dbt
    (models/usage/: stg_usage_events, int_usage_location).'
  usage: Internal to the pipeline; not published, and not a public interface. Readers outside the pipeline use the public
    catalog contract (contracts/public-catalog.odcs.yaml).
  limitations: Every lake column is nullable in the Arrow schema so that older files read back; required marks the columns
    a quality rule holds non-null.
schema:
- name: usage_events
  physicalName: usage_events
  physicalType: table
  description: 'One anonymous search, filter, click-out or page-view event from registry.coffee or app.registry.coffee,
    as the collector accepted it: private, append-only, never published. No identifier of a person, browser, device, session
    or page load; no full IP, user agent, cookie, or referrer path or query.'
  properties:
  - name: event_id
    logicalType: string
    physicalType: string
    required: false
    description: A random version-4 UUID the page makes per event, or null when it sent none (the collector never makes
      one up); only for dropping a retried duplicate, never a visitor, session or page-load id.
  - name: received_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When the collector received it (UTC), truncated to the hour.
  - name: event
    logicalType: string
    physicalType: string
    required: false
    description: page_view, search (results settled), filter_state (filters settled) or click_out (a link to a roaster's
      or coffee's store).
    enum:
    - value: page_view
    - value: search
    - value: filter_state
    - value: click_out
  - name: surface
    logicalType: string
    physicalType: string
    required: false
    description: 'Where it happened: a site page (landing, catalog, privacy, terms, bot) or the app (app_search: the bag
      page''s catalog search; app_coffee: a coffee page''s Shop link).'
    enum:
    - value: landing
    - value: catalog
    - value: privacy
    - value: terms
    - value: bot
    - value: app_search
    - value: app_coffee
  - name: release
    logicalType: string
    physicalType: string
    required: false
    description: The catalog build the page was showing (its build id); null in the app.
  - name: device
    logicalType: string
    physicalType: string
    required: false
    description: phone or desktop, as the page judged it from its width.
    enum:
    - value: phone
    - value: desktop
  - name: query
    logicalType: string
    physicalType: string
    required: false
    description: The search text as typed, capped at 100 characters; not scrubbed. A dbt detector counts any that look like
      an email, phone or card number and alerts on the count, never the text.
  - name: cities
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: Catalog cities the page's parser read in the search text (no '@' or runs of 7+ digits).
  - name: states
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: Catalog states the page's parser read in the search text, as two-letter codes.
  - name: origin
    logicalType: string
    physicalType: string
    required: false
    description: The Origin filter (a country), or null for all (no '@' or runs of 7+ digits).
  - name: process
    logicalType: string
    physicalType: string
    required: false
    description: The Process filter, or null for all (no '@' or runs of 7+ digits).
  - name: state
    logicalType: string
    physicalType: string
    required: false
    description: The State filter (the roaster's state, a two-letter code), or null for all.
  - name: in_stock
    logicalType: boolean
    physicalType: bool
    required: false
    description: The In stock filter.
  - name: sort
    logicalType: string
    physicalType: string
    required: false
    description: 'The Sort select: roaster, asc or desc (price per 100 g).'
    enum:
    - value: roaster
    - value: asc
    - value: desc
  - name: results_n
    logicalType: integer
    physicalType: int32
    required: false
    description: Coffees shown for the search and filters.
  - name: zero_results
    logicalType: boolean
    physicalType: bool
    required: false
    description: Whether the search and filters found nothing.
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: A click_out's roaster (its normalized domain, the catalog's roaster id), as the page sent it; checked against
      the release in dbt.
  - name: coffee_id
    logicalType: string
    physicalType: string
    required: false
    description: 'A click_out''s coffee, if the link was a coffee''s: <roaster_id>:<the store''s product id>.'
  - name: rank
    logicalType: integer
    physicalType: int32
    required: false
    description: A click_out's position in the result list, from 1; null off a result list.
  - name: source
    logicalType: string
    physicalType: string
    required: false
    description: 'On a page load''s first event only: utm (it had utm_* tags), referrer, direct or internal (one of our
      own hosts); null on every later event.'
    enum:
    - value: utm
    - value: referrer
    - value: direct
    - value: internal
  - name: referrer_domain
    logicalType: string
    physicalType: string
    required: false
    description: The referring site's host name only (never its path or query); null unless source is referrer, or when
      the referrer had no usable host name.
  - name: utm_source
    logicalType: string
    physicalType: string
    required: false
    description: The landing URL's utm_source (lower-case, at most 40 of a-z 0-9 . _ -).
  - name: utm_medium
    logicalType: string
    physicalType: string
    required: false
    description: The landing URL's utm_medium, same rules.
  - name: utm_campaign
    logicalType: string
    physicalType: string
    required: false
    description: The landing URL's utm_campaign, same rules.
  - name: ip_prefix
    logicalType: string
    physicalType: string
    required: false
    description: 'The caller''s IP masked at collection, before anything was written: IPv4 /24, IPv6 /40, as a network (203.0.113.0/24).
      Personal data: used only to derive country, region and city in dbt (int_usage_location) and for nothing else. The
      full IP is never stored or logged.'
  - name: bot
    logicalType: boolean
    physicalType: bool
    required: false
    description: 'A known bot''s user agent, no user agent, or navigator.webdriver: excluded in dbt. The user agent itself
      is never kept.'
  quality:
  - id: writer_columns
    description: the collector writes exactly the contract's columns, and its coded columns only the contract's values.
    type: custom
    engine: pytest
    implementation: tests/test_usage_collector.py::test_rows_follow_the_usage_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_usage_collector.py::test_rows_follow_the_usage_contract
  - id: ip_prefix_is_masked
    description: ip_prefix is an IPv4 /24 or IPv6 /40 network, never a full address, and no other column holds one.
    type: custom
    engine: pytest
    implementation: tests/test_usage_collector.py::test_no_row_can_hold_a_full_address
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_usage_collector.py::test_no_row_can_hold_a_full_address
  - id: query_capped
    description: query is at most 100 characters.
    type: custom
    engine: pytest
    implementation: tests/test_usage_collector.py::test_query_is_kept_as_typed_and_capped
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_usage_collector.py::test_query_is_kept_as_typed_and_capped
  - id: no_identifier
    description: nothing written or logged holds the full IP, a cookie or the user agent.
    type: custom
    engine: pytest
    implementation: tests/test_usage_collector.py::test_canary_leaves_no_ip_or_cookie_in_the_lake_or_logs
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_usage_collector.py::test_canary_leaves_no_ip_or_cookie_in_the_lake_or_logs
  customProperties:
  - property: lakeGlob
    value: events/*/*.parquet
