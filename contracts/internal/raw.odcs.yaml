# Internal ODCS contract, generated by src/coffeedata/raw_contracts.py from lake.SCHEMAS and contract_docs.py.
# Do not edit: change those and run `make contracts`, or python -m coffeedata.raw_contracts --write <name>
# <new version> after a change to names, types, required or enums. tests/test_raw_contracts.py fails when this
# file and the code disagree.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-internal-raw
version: 1.5.0
name: Coffee Data internal raw contract
status: active
domain: coffee
tags:
- internal
description:
  purpose: 'Internal contract between services: connector ingest jobs (crawl, crawl-retry), via the weekly merge -> dbt
    (stg_snapshots, stg_product_inputs, stg_fetches, int_fetch_product_inputs), enrichment job, registry.'
  usage: Internal to the pipeline; not published, and not a public interface. Readers outside the pipeline use the public
    catalog contract (contracts/public-catalog.odcs.yaml).
  limitations: Every lake column is nullable in the Arrow schema so that older files read back; required marks the columns
    a quality rule holds non-null.
schema:
- name: snapshots
  physicalName: snapshots
  physicalType: table
  description: 'Every product a store listed at one fetch, coffee or not: one row per (fetch batch, product).'
  properties:
  - name: run_date
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The weekly run (the Monday of its ISO week).
  - name: batch_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The write batch: one per checkpoint of a job, shared by a fetch''s row and its snapshots.'
  - name: fetched_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When the fetch started (UTC).
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's normalized domain.
  - name: product_id
    logicalType: string
    physicalType: string
    required: false
    description: The store's product id.
  - name: handle
    logicalType: string
    physicalType: string
    required: false
    description: The store's URL handle for the product.
  - name: url
    logicalType: string
    physicalType: string
    required: false
    description: The product's page on the store.
  - name: title
    logicalType: string
    physicalType: string
    required: false
    description: The product's title as listed.
  - name: platform
    logicalType: string
    physicalType: string
    required: false
    description: The store's platform (shopify, woocommerce, squarespace, square_online, generic).
  - name: vendor
    logicalType: string
    physicalType: string
    required: false
    description: The store's vendor field.
  - name: product_type
    logicalType: string
    physicalType: string
    required: false
    description: The store's product type.
  - name: tags
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: The store's tags.
  - name: image
    logicalType: string
    physicalType: string
    required: false
    description: The product's first image URL.
  - name: body_hash
    logicalType: string
    physicalType: string
    required: false
    description: Hash of the description; its text is in bodies.
  - name: variants
    logicalType: array
    physicalType: 'list<item: struct<variant_id: string, title: string, price_usd: double, grams: int32, available: bool>>'
    items:
      logicalType: object
      physicalType: 'struct<variant_id: string, title: string, price_usd: double, grams: int32, available: bool>'
      properties:
      - name: variant_id
        logicalType: string
        physicalType: string
      - name: title
        logicalType: string
        physicalType: string
      - name: price_usd
        logicalType: number
        physicalType: double
      - name: grams
        logicalType: integer
        physicalType: int32
      - name: available
        logicalType: boolean
        physicalType: bool
    required: false
    description: 'Each bag size or option: variant id, title, price (USD), grams where known, availability.'
  - name: is_coffee
    logicalType: boolean
    physicalType: bool
    required: false
    description: Whether the crawl's rules called it coffee. Null from an ELT crawl, which doesn't classify.
  - name: published_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: The store's latest publish time (Shopify only).
  - name: payload_hash
    logicalType: string
    physicalType: string
    required: false
    description: 'Hash of the store''s raw product payload: tells a real change from a repeated fetch.'
  quality:
  - id: snapshots_writer_columns
    description: a writer writes exactly the contract's columns.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ingest_writes_exactly_the_raw_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ingest_writes_exactly_the_raw_contract
  customProperties:
  - property: lakeGlob
    value: snapshots/*/*.parquet
- name: bodies
  physicalName: bodies
  physicalType: table
  description: Product descriptions as text, once per distinct description (body_hash).
  properties:
  - name: body_hash
    logicalType: string
    physicalType: string
    required: false
    description: Hash of the description text.
  - name: body_text
    logicalType: string
    physicalType: string
    required: false
    description: The description as plain text.
  - name: first_seen_run
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The run that first stored it.
  quality:
  - id: bodies_writer_columns
    description: a writer writes exactly the contract's columns.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ingest_writes_exactly_the_raw_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ingest_writes_exactly_the_raw_contract
  customProperties:
  - property: lakeGlob
    value: bodies/*/*.parquet
- name: fetches
  physicalName: fetches
  physicalType: table
  description: One row per fetch attempt of a roaster's catalog, ok or not, with what it asked of the store.
  properties:
  - name: run_date
    logicalType: date
    physicalType: date32[day]
    required: true
    description: The weekly run (the Monday of its ISO week).
  - name: batch_id
    logicalType: string
    physicalType: string
    required: true
    description: 'The write batch: one per checkpoint of a job, shared by a fetch''s row and its snapshots.'
  - name: fetched_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When the attempt started (UTC).
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: true
    description: The roaster's normalized domain.
  - name: adapter
    logicalType: string
    physicalType: string
    required: false
    description: The catalog adapter used.
  - name: status
    logicalType: string
    physicalType: string
    required: false
    description: 'ok; error (any failure or block, retried in later passes); unavailable (closed store); crashed (not fetched:
      quarantined for the week after it was in flight in two attempts of its crawl that died).'
    enum:
    - value: ok
    - value: error
    - value: unavailable
    - value: crashed
  - name: error
    logicalType: string
    physicalType: string
    required: false
    description: The failure, when status is not ok.
  - name: products
    logicalType: integer
    physicalType: int32
    required: false
    description: Products the attempt read.
  - name: coffees
    logicalType: integer
    physicalType: int32
    required: false
    description: Coffees among them as the crawl counted them; null from an ELT crawl.
  - name: pages
    logicalType: integer
    physicalType: int32
    required: false
    description: Catalog pages (200 responses other than robots.txt) read.
  - name: requests
    logicalType: integer
    physicalType: int32
    required: false
    description: HTTP requests made, retries and robots.txt included.
  - name: http_statuses
    logicalType: array
    physicalType: 'list<item: struct<status: int32, responses: int32>>'
    items:
      logicalType: object
      physicalType: 'struct<status: int32, responses: int32>'
      properties:
      - name: status
        logicalType: integer
        physicalType: int32
      - name: responses
        logicalType: integer
        physicalType: int32
    required: false
    description: Responses per HTTP status.
  - name: retries
    logicalType: integer
    physicalType: int32
    required: false
    description: Attempts after the first for one URL.
  - name: rate_limited
    logicalType: integer
    physicalType: int32
    required: false
    description: 429 responses.
  - name: duration_s
    logicalType: number
    physicalType: double
    required: false
    description: How long the attempt took.
  - name: code_version
    logicalType: string
    physicalType: string
    required: false
    description: The code that made it (git sha).
  - name: blocks
    logicalType: array
    physicalType: 'list<item: struct<at: timestamp[s, tz=UTC], status: int32, host: string, path: string, server: string,
      cf_mitigated: string, content_type: string, retry_after: string, cf_ray: string, x_request_id: string, egress_ip:
      string, sg_captcha: string>>'
    items:
      logicalType: object
      physicalType: 'struct<at: timestamp[s, tz=UTC], status: int32, host: string, path: string, server: string, cf_mitigated:
        string, content_type: string, retry_after: string, cf_ray: string, x_request_id: string, egress_ip: string, sg_captcha:
        string>'
      properties:
      - name: at
        logicalType: timestamp
        logicalTypeOptions:
          timezone: true
          defaultTimezone: UTC
        physicalType: timestamp[s, tz=UTC]
      - name: status
        logicalType: integer
        physicalType: int32
      - name: host
        logicalType: string
        physicalType: string
      - name: path
        logicalType: string
        physicalType: string
      - name: server
        logicalType: string
        physicalType: string
      - name: cf_mitigated
        logicalType: string
        physicalType: string
      - name: content_type
        logicalType: string
        physicalType: string
      - name: retry_after
        logicalType: string
        physicalType: string
      - name: cf_ray
        logicalType: string
        physicalType: string
      - name: x_request_id
        logicalType: string
        physicalType: string
      - name: egress_ip
        logicalType: string
        physicalType: string
      - name: sg_captcha
        logicalType: string
        physicalType: string
    required: false
    description: Each refused or blocked response (202/403/429/430/503, or another edge challenge) with its diagnostic headers
      (sg_captcha from raw 1.4.0) and egress IP.
  - name: partial
    logicalType: boolean
    physicalType: bool
    required: false
    description: True when an ok fetch read only part of the catalog; null (complete) before raw 1.2.0.
  - name: crawl_delays
    logicalType: array
    physicalType: 'list<item: struct<host: string, asked: string, applied_s: double, capped: bool>>'
    items:
      logicalType: object
      physicalType: 'struct<host: string, asked: string, applied_s: double, capped: bool>'
      properties:
      - name: host
        logicalType: string
        physicalType: string
      - name: asked
        logicalType: string
        physicalType: string
      - name: applied_s
        logicalType: number
        physicalType: double
      - name: capped
        logicalType: boolean
        physicalType: bool
    required: false
    description: 'Each host whose robots.txt asked us a Crawl-delay: the value as written, the spacing used between its
      requests (the delay, at least 1 s, capped at 60 s) and whether the cap applied; null when none asked, and before raw
      1.5.0.'
  quality:
  - id: fetch_status_values
    description: fetches.status is one of the contract's values.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: stg_fetches
      columns:
      - status
      test: accepted_values
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt stg_fetches accepted_values
  - id: fetch_keys_not_null
    description: fetches.roaster_id, run_date and batch_id are not null.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: stg_fetches
      columns:
      - run_date
      - batch_id
      - roaster_id
      test: not_null
    dimension: completeness
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt stg_fetches not_null
  - id: fetches_writer_columns
    description: a writer writes exactly the contract's columns.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ingest_writes_exactly_the_raw_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ingest_writes_exactly_the_raw_contract
  - id: run_is_complete
    description: every expected roaster of a full run has a fetch.
    type: custom
    engine: dbt
    implementation: tests/run_is_complete.sql
    dimension: completeness
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt run_is_complete
  - id: run_ok_rate
    description: the run's overall ok share is above its floor (unavailable and crashed stores left out).
    type: custom
    engine: dbt
    implementation: tests/run_ok_rate.sql
    dimension: completeness
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt run_ok_rate
  - id: adapter_ok_rate
    description: each adapter's ok share is above its floor (unavailable and crashed stores left out).
    type: custom
    engine: dbt
    implementation: tests/adapter_ok_rate.sql
    dimension: completeness
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt adapter_ok_rate
  - id: suspect_runs_need_review
    description: a roaster's product count doesn't collapse against its baseline unless accepted.
    type: custom
    engine: dbt
    implementation: tests/suspect_runs_need_review.sql
    dimension: consistency
    severity: warning
    customProperties:
    - property: enforcedBy
      value: dbt suspect_runs_need_review (warn)
  customProperties:
  - property: lakeGlob
    value: fetches/*/*.parquet
- name: parked
  physicalName: parked/run_date=<date>/<roaster_id>.json
  physicalType: file
  description: 'A store parked mid-catalog for crawl-retry: where to resume and what was read.'
  properties:
  - name: page
    logicalType: integer
    required: true
    description: The catalog page that stayed blocked.
  - name: items
    logicalType: array
    required: true
    description: The catalog items read before the block (CatalogItem fields).
    items:
      logicalType: object
      properties:
      - name: body_hash
      - name: body_text
      - name: handle
      - name: image
      - name: payload_hash
      - name: platform
      - name: product_id
      - name: product_type
      - name: published_at
      - name: roaster_id
      - name: tags
      - name: title
      - name: url
      - name: variants
      - name: vendor
- name: inflight
  physicalName: raw/connector=<name>/run_date=<week>/_inflight/attempt=<attempt_id>/<roaster_id>.json
  physicalType: file
  description: 'A roaster in flight in a crawl attempt (crashguard): written before its fetch, removed when it returns,
    and the attempt''s folder removed when it ends normally. The folder of an attempt without a done or deadline end row
    holds the roasters in flight when it died; the next attempt of the week quarantines one found in two such folders (fetches.status
    crashed).'
  properties:
  - name: roaster_id
    logicalType: string
    required: true
    description: The roaster (also the file name).
  - name: started_at
    logicalType: string
    required: true
    description: When its fetch started (ISO 8601, UTC).
authoritativeDefinitions:
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/lake.py
  type: implementation
  description: 'lake.SCHEMAS: the Arrow schemas the columns and types come from'
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/contract_docs.py
  type: businessDefinition
  description: Table and column descriptions, and quality rules
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/raw_contracts.py
  type: implementation
  description: The generator of this file
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/ingest.py
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/connectors.py
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/tests/test_raw_contracts.py
  type: implementation
  description: Tests that hold producers and this contract together
customProperties:
- property: audience
  value: internal
- property: producer
  value: connector ingest jobs (crawl, crawl-retry), via the weekly merge
- property: consumers
  value:
  - dbt (stg_snapshots, stg_product_inputs, stg_fetches, int_fetch_product_inputs)
  - enrichment job
  - registry
- property: interfaceFingerprint
  value: 1ab99e0abd460ae3
- property: docsFingerprint
  value: acd2240bbfd48692
