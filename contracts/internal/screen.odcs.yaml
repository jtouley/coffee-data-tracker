# Internal ODCS contract, generated by src/coffeedata/raw_contracts.py from lake.SCHEMAS and contract_docs.py.
# Do not edit: change those and run `make contracts`, or python -m coffeedata.raw_contracts --write <name>
# <new version> after a change to names, types, required or enums. tests/test_raw_contracts.py fails when this
# file and the code disagree.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-internal-screen
version: 1.0.0
name: Coffee Data internal screen contract
status: active
domain: coffee
tags:
- internal
description:
  purpose: 'Internal contract between services: the roaster screen job (coffeedata screen), one state per run -> dbt (stg_screens,
    stg_screen_products), the screen job''s own selection (screen.select).'
  usage: Internal to the pipeline; not published, and not a public interface. Readers outside the pipeline use the public
    catalog contract (contracts/public-catalog.odcs.yaml).
  limitations: Every lake column is nullable in the Arrow schema so that older files read back; required marks the columns
    a quality rule holds non-null.
schema:
- name: screens
  physicalName: screens
  physicalType: table
  description: 'One screen of one discovery candidate''s site: what it answered to robots.txt, the home page and one product
    page. Raw and append-only: nothing derived is stored, and a re-screen is a new row. Private: these places aren''t in
    the registry, and the table is never exported or released.'
  properties:
  - name: run_date
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The day the screen job ran.
  - name: batch_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The write batch: one per checkpoint of the job, shared with its screen_products file.'
  - name: screen_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The screen: one visit to one place (a uuid). A re-screen is a new row with a new id.'
  - name: screened_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When the screen finished.
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The place's normalized domain, as in candidates.
  - name: state
    logicalType: string
    physicalType: string
    required: false
    description: The US state the run screened.
  - name: status
    logicalType: string
    physicalType: string
    required: false
    description: 'What the site answered, in the probe''s words: ok, blocked (robots.txt disallows us, or an edge challenged),
      unreachable, robots_unavailable, or http_<code>.'
  - name: refusal
    logicalType: string
    physicalType: string
    required: false
    description: 'How the site, or its edge, refused us, if it did: robots_disallow, robots_401_403, challenge or http_429.
      Nothing more was fetched after it.'
    enum:
    - value: robots_disallow
    - value: robots_401_403
    - value: challenge
    - value: http_429
  - name: http_status
    logicalType: integer
    physicalType: int32
    required: false
    description: The home page's HTTP status, or a challenge's; null when nothing answered.
  - name: final_host
    logicalType: string
    physicalType: string
    required: false
    description: The host the home page was served from, after redirects.
  - name: platform
    logicalType: string
    physicalType: string
    required: false
    description: shopify or woocommerce when its catalog API answered; else the home page's marker with a question mark
      (wix?), or other.
  - name: page_size
    logicalType: integer
    physicalType: int32
    required: false
    description: The page size the product page was asked at; null when none was read.
  - name: products_read
    logicalType: integer
    physicalType: int32
    required: false
    description: Products on the one page read.
  - name: page_full
    logicalType: boolean
    physicalType: bool
    required: false
    description: The page was full, so the catalog may hold more.
  - name: page_timeout
    logicalType: boolean
    physicalType: bool
    required: false
    description: The product page timed out at every size tried.
  - name: edge
    logicalType: string
    physicalType: string
    required: false
    description: 'The edge that challenged us, from the challenge''s headers: siteground, cloudflare or other.'
    enum:
    - value: siteground
    - value: cloudflare
    - value: other
  - name: home_title
    logicalType: string
    physicalType: string
    required: false
    description: The home page's title.
  - name: home_text
    logicalType: string
    physicalType: string
    required: false
    description: The home page's visible text, its first 50,000 characters.
  - name: requests
    logicalType: integer
    physicalType: int32
    required: false
    description: HTTP requests the screen sent, robots.txt, redirects and retries included (at most 6).
  - name: bytes
    logicalType: integer
    physicalType: int64
    required: false
    description: Bytes of the home page and product page bodies read.
  - name: crawl_delay_s
    logicalType: number
    physicalType: double
    required: false
    description: The longest spacing a host's robots.txt Crawl-delay gave this screen's requests, if any.
  - name: duration_s
    logicalType: number
    physicalType: double
    required: false
    description: Seconds the screen took.
  - name: code_version
    logicalType: string
    physicalType: string
    required: false
    description: The code that ran.
  quality:
  - id: screens_writer_columns
    description: the screen job writes exactly the contract's columns.
    type: custom
    engine: pytest
    implementation: tests/test_screen.py::test_a_run_writes_exactly_the_contracts_columns
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_screen.py::test_a_run_writes_exactly_the_contracts_columns
  - id: screens_append_only
    description: 'a run only adds files: no earlier file is rewritten, and a re-screen is a new row.'
    type: custom
    engine: pytest
    implementation: tests/test_screen.py::test_a_second_run_adds_files_and_rewrites_none
    dimension: consistency
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_screen.py::test_a_second_run_adds_files_and_rewrites_none
  - id: screen_keys
    description: screens.screen_id is unique and not null, and roaster_id is not null.
    type: custom
    engine: dbt
    implementation:
      file: models/staging/_staging__models.yml
      model: stg_screens
      columns:
      - screen_id
      test: unique
    dimension: completeness
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt stg_screens unique, not_null
  - id: screen_values
    description: screens.refusal and screens.edge are null or one of the contract's values.
    type: custom
    engine: dbt
    implementation:
      file: models/staging/_staging__models.yml
      model: stg_screens
      columns:
      - refusal
      - edge
      test: accepted_values
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt stg_screens accepted_values
  - id: request_cap
    description: a screen sends at most 6 requests, robots.txt and redirects included.
    type: custom
    engine: pytest
    implementation: tests/test_screen.py::test_a_screen_never_sends_a_seventh_request
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_screen.py::test_a_screen_never_sends_a_seventh_request
  - id: request_cap_recorded
    description: no recorded screen shows more than 6 requests.
    type: custom
    engine: dbt
    implementation: tests/screen_request_cap.sql
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt screen_request_cap
  - id: screens_private
    description: the tables are never part of a release or an export.
    type: custom
    engine: pytest
    implementation: tests/test_screen.py::test_screen_tables_are_never_released
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_screen.py::test_screen_tables_are_never_released
  customProperties:
  - property: lakeGlob
    value: screens/*/*.parquet
- name: screen_products
  physicalName: screen_products
  physicalType: table
  description: The products on the one catalog page a screen read, as the store listed them. Raw, append-only and private,
    as screens.
  properties:
  - name: screen_id
    logicalType: string
    physicalType: string
    required: false
    description: The screen these rows belong to (screens.screen_id).
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The place's normalized domain.
  - name: product_id
    logicalType: string
    physicalType: string
    required: false
    description: The store's product id.
  - name: handle
    logicalType: string
    physicalType: string
    required: false
    description: The store's product handle or slug.
  - name: title
    logicalType: string
    physicalType: string
    required: false
    description: The product's title.
  - name: vendor
    logicalType: string
    physicalType: string
    required: false
    description: The product's vendor, as the store states it (Shopify).
  - name: product_type
    logicalType: string
    physicalType: string
    required: false
    description: The product's type, as the store states it.
  - name: tags
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: The product's tags (and categories, on WooCommerce).
  - name: variants
    logicalType: array
    physicalType: 'list<item: struct<title: string, grams: int32, price: double, currency: string, available: bool>>'
    items:
      logicalType: object
      physicalType: 'struct<title: string, grams: int32, price: double, currency: string, available: bool>'
      properties:
      - name: title
        logicalType: string
        physicalType: string
      - name: grams
        logicalType: integer
        physicalType: int32
      - name: price
        logicalType: number
        physicalType: double
      - name: currency
        logicalType: string
        physicalType: string
      - name: available
        logicalType: boolean
        physicalType: bool
    required: false
    description: 'Each size or option: its title, grams, price and currency as stated, and whether it is available.'
  - name: body_hash
    logicalType: string
    physicalType: string
    required: false
    description: A hash of the product's description text.
  - name: body_text
    logicalType: string
    physicalType: string
    required: false
    description: The description's text, its first 1,500 characters.
  quality:
  - id: screen_products_writer_columns
    description: the screen job writes exactly the contract's columns.
    type: custom
    engine: pytest
    implementation: tests/test_screen.py::test_a_run_writes_exactly_the_contracts_columns
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_screen.py::test_a_run_writes_exactly_the_contracts_columns
  - id: screen_products_append_only
    description: 'a run only adds files: no earlier file is rewritten, and a re-screen is a new row.'
    type: custom
    engine: pytest
    implementation: tests/test_screen.py::test_a_second_run_adds_files_and_rewrites_none
    dimension: consistency
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_screen.py::test_a_second_run_adds_files_and_rewrites_none
  - id: screen_products_private
    description: the tables are never part of a release or an export.
    type: custom
    engine: pytest
    implementation: tests/test_screen.py::test_screen_tables_are_never_released
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_screen.py::test_screen_tables_are_never_released
  customProperties:
  - property: lakeGlob
    value: screen_products/*/*.parquet
