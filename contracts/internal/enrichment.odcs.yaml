# Internal ODCS contract, generated by src/coffeedata/raw_contracts.py from lake.SCHEMAS and contract_docs.py.
# Do not edit: change those and run `make contracts`, or python -m coffeedata.raw_contracts --write <name>
# <new version> after a change to names, types, required or enums. tests/test_raw_contracts.py fails when this
# file and the code disagree.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-internal-enrichment
version: 1.1.0
name: Coffee Data internal enrichment contract
status: active
domain: coffee
tags:
- internal
description:
  purpose: 'Internal contract between services: post-load enrichment job (enrich-week) -> dbt (stg_enrichments, dim_coffee).'
  usage: Internal to the pipeline; not published, and not a public interface. Readers outside the pipeline use the public
    catalog contract (contracts/public-catalog.odcs.yaml).
  limitations: Every lake column is nullable in the Arrow schema so that older files read back; required marks the columns
    a quality rule holds non-null.
schema:
- name: enrichments
  physicalName: enrichments
  physicalType: table
  description: Claude's extracted attributes per product description (llm rows; older lakes also hold rules rows).
  properties:
  - name: extracted_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When it was extracted.
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's normalized domain.
  - name: product_id
    logicalType: string
    physicalType: string
    required: false
    description: The store's product id.
  - name: body_hash
    logicalType: string
    physicalType: string
    required: false
    description: The description it was extracted from.
  - name: method
    logicalType: string
    physicalType: string
    required: false
    description: llm (Claude), or rules in older lakes.
  - name: needs_llm
    logicalType: boolean
    physicalType: bool
    required: false
    description: The rules left the coffee incompletely described.
  - name: origin_country
    logicalType: string
    physicalType: string
    required: false
    description: Origin country.
  - name: origin_region
    logicalType: string
    physicalType: string
    required: false
    description: Origin region.
  - name: producer
    logicalType: string
    physicalType: string
    required: false
    description: Farm, washing station or producer.
  - name: process
    logicalType: string
    physicalType: string
    required: false
    description: washed, natural, honey, anaerobic or other.
  - name: varietals
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: Varietals.
  - name: elevation_masl_min
    logicalType: integer
    physicalType: int32
    required: false
    description: Lowest growing elevation (m).
  - name: elevation_masl_max
    logicalType: integer
    physicalType: int32
    required: false
    description: Highest growing elevation (m).
  - name: roast_level
    logicalType: string
    physicalType: string
    required: false
    description: light, medium or dark.
  - name: tasting_notes
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: The roaster's tasting notes.
  - name: is_blend
    logicalType: boolean
    physicalType: bool
    required: false
    description: A blend.
  - name: is_decaf
    logicalType: boolean
    physicalType: bool
    required: false
    description: Decaffeinated.
  quality:
  - id: writer_columns
    description: rows have exactly the contract's columns.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_enrichment_rows_follow_the_enrichment_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_enrichment_rows_follow_the_enrichment_contract
  - id: accepted_attribute_values
    description: process and roast_level take the dbt-accepted values.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: dim_coffee
      columns:
      - process
      - roast_level
      test: accepted_values
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt dim_coffee accepted_values
  customProperties:
  - property: lakeGlob
    value: enrichments/*/*/*.parquet
authoritativeDefinitions:
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/lake.py
  type: implementation
  description: 'lake.SCHEMAS: the Arrow schemas the columns and types come from'
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/contract_docs.py
  type: businessDefinition
  description: Table and column descriptions, and quality rules
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/raw_contracts.py
  type: implementation
  description: The generator of this file
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/enrich.py
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/tests/test_raw_contracts.py
  type: implementation
  description: Tests that hold producers and this contract together
customProperties:
- property: audience
  value: internal
- property: producer
  value: post-load enrichment job (enrich-week)
- property: consumers
  value:
  - dbt (stg_enrichments, dim_coffee)
- property: interfaceFingerprint
  value: 476da22198cd35e9
- property: docsFingerprint
  value: 1763fc3abb0f2c82
