# Internal ODCS contract, generated by src/coffeedata/raw_contracts.py from lake.SCHEMAS and contract_docs.py.
# Do not edit: change those and run `make contracts`, or python -m coffeedata.raw_contracts --write <name>
# <new version> after a change to names, types, required or enums. tests/test_raw_contracts.py fails when this
# file and the code disagree.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-internal-manifest
version: 1.1.0
name: Coffee Data internal manifest contract
status: active
domain: coffee
tags:
- internal
description:
  purpose: 'Internal contract between services: every job (crawl, crawl-retry, merge, enrich, crawl-dq) -> dbt (run_completeness),
    merge, enrichment job, egress-check, crawl-dq (when a pass ended), and the crawl passes after it (its repull list, only
    with re-fetch on: COFFEEDATA_DQ_REFETCH, off by default).'
  usage: Internal to the pipeline; not published, and not a public interface. Readers outside the pipeline use the public
    catalog contract (contracts/public-catalog.odcs.yaml).
  limitations: Every lake column is nullable in the Arrow schema so that older files read back; required marks the columns
    a quality rule holds non-null.
schema:
- name: run_manifests
  physicalName: run_manifests
  physicalType: table
  description: 'What an ingest set out to fetch, written before its first request: one row per roaster.'
  properties:
  - name: run_date
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The weekly run (the Monday of its ISO week).
  - name: manifest_id
    logicalType: string
    physicalType: string
    required: false
    description: One ingest invocation.
  - name: started_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When it was written, before the first request.
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's normalized domain.
  - name: status
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's registry status at that moment.
  - name: platform
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's platform.
  - name: adapter
    logicalType: string
    physicalType: string
    required: false
    description: The adapter that will fetch it.
  - name: mode
    logicalType: string
    physicalType: string
    required: false
    description: full, sample, only or retry_failed; only a full manifest is the run's expected set.
  - name: code_version
    logicalType: string
    physicalType: string
    required: false
    description: The code that wrote it.
  quality:
  - id: run_manifest_mode_values
    description: run_manifests.mode is full, sample, only, retry_failed or null.
    type: text
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: the writers (ingest.select_states, connectors.crawl, crawl-retry)
  customProperties:
  - property: lakeGlob
    value: run_manifests/*/*.parquet
- name: job_manifests
  physicalName: job_manifests
  physicalType: table
  description: 'The control plane: one row when a job starts and one when it ends, per connector and week.'
  properties:
  - name: run_date
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The weekly run (the Monday of its ISO week).
  - name: job
    logicalType: string
    physicalType: string
    required: false
    description: crawl, crawl-retry, merge, enrich or dq (the post-crawl check, crawl-dq).
  - name: connector
    logicalType: string
    physicalType: string
    required: false
    description: The connector (adapter) the job served, if any.
  - name: shard
    logicalType: string
    physicalType: string
    required: false
    description: The shard, if the job was sharded.
  - name: attempt_id
    logicalType: string
    physicalType: string
    required: false
    description: One execution of the job; its start and end rows share it.
  - name: started_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When the attempt started.
  - name: ended_at
    logicalType: timestamp
    logicalTypeOptions:
      timezone: true
      defaultTimezone: UTC
    physicalType: timestamp[s, tz=UTC]
    required: false
    description: When it ended (null on the start row).
  - name: status
    logicalType: string
    physicalType: string
    required: false
    description: running (start row), done, deadline or failed. An attempt with only a running row died.
  - name: todo
    logicalType: integer
    physicalType: int32
    required: false
    description: Roasters it set out to fetch.
  - name: ok
    logicalType: integer
    physicalType: int32
    required: false
    description: Roasters fetched.
  - name: errors
    logicalType: integer
    physicalType: int32
    required: false
    description: Roasters that failed.
  - name: parked
    logicalType: integer
    physicalType: int32
    required: false
    description: Stores parked mid-catalog for crawl-retry.
  - name: skipped
    logicalType: integer
    physicalType: int32
    required: false
    description: Roasters not started before the deadline.
  - name: requests
    logicalType: integer
    physicalType: int32
    required: false
    description: HTTP requests made.
  - name: http_429
    logicalType: integer
    physicalType: int32
    required: false
    description: 429 responses.
  - name: http_430
    logicalType: integer
    physicalType: int32
    required: false
    description: 430 responses (Shopify's IP-wide block).
  - name: egress_ips
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: The egress IPs the job's requests left from.
  - name: refusals
    logicalType: array
    physicalType: 'list<item: struct<ip: string, stores: int32, refused: int32>>'
    items:
      logicalType: object
      physicalType: 'struct<ip: string, stores: int32, refused: int32>'
      properties:
      - name: ip
        logicalType: string
        physicalType: string
      - name: stores
        logicalType: integer
        physicalType: int32
      - name: refused
        logicalType: integer
        physicalType: int32
    required: false
    description: 'Per egress IP: stores contacted, and those that refused their first catalog request.'
  - name: code_version
    logicalType: string
    physicalType: string
    required: false
    description: The code that ran.
  - name: detail
    logicalType: string
    physicalType: string
    required: false
    description: 'JSON: the job''s own summary (arm, egress, rps, slice and salt for the confirmation run; for dq, its verdict:
      systemic problems and the repull list, roaster_id, adapter, reasons and the DQ rules that gave them).'
  quality:
  - id: job_start_and_end_rows
    description: a job writes a running row at its start and one end row (done, deadline or failed).
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_control_rows_follow_the_manifest_contract
    dimension: completeness
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_control_rows_follow_the_manifest_contract
  customProperties:
  - property: lakeGlob
    value: job_manifests/*/*.parquet
authoritativeDefinitions:
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/lake.py
  type: implementation
  description: 'lake.SCHEMAS: the Arrow schemas the columns and types come from'
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/contract_docs.py
  type: businessDefinition
  description: Table and column descriptions, and quality rules
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/raw_contracts.py
  type: implementation
  description: The generator of this file
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/control.py
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/ingest.py
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/crawldq.py
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/tests/test_raw_contracts.py
  type: implementation
  description: Tests that hold producers and this contract together
customProperties:
- property: audience
  value: internal
- property: producer
  value: every job (crawl, crawl-retry, merge, enrich, crawl-dq)
- property: consumers
  value:
  - dbt (run_completeness)
  - merge
  - enrichment job
  - egress-check
  - 'crawl-dq (when a pass ended), and the crawl passes after it (its repull list, only with re-fetch on: COFFEEDATA_DQ_REFETCH,
    off by default)'
- property: interfaceFingerprint
  value: d775e9935559e256
