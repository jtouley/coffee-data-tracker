# Internal ODCS contract, generated by src/coffeedata/raw_contracts.py from lake.SCHEMAS and contract_docs.py.
# Do not edit: change those and run `make contracts`, or python -m coffeedata.raw_contracts --write <name>
# <new version> after a change to names, types, required or enums. tests/test_raw_contracts.py fails when this
# file and the code disagree.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-internal-ops
version: 1.2.0
name: Coffee Data internal ops contract
status: active
domain: coffee
tags:
- internal
description:
  purpose: 'Internal contract between services: coffeedata build (quality.write_ops: the build''s dbt models, beside its
    release under ops/) -> the owner''s command center (admin.registry.coffee).'
  usage: Internal to the pipeline; not published, and not a public interface. Readers outside the pipeline use the public
    catalog contract (contracts/public-catalog.odcs.yaml).
  limitations: Every lake column is nullable in the Arrow schema so that older files read back; required marks the columns
    a quality rule holds non-null.
schema:
- name: run_completeness
  physicalName: run_completeness
  physicalType: table
  description: 'Ops: one row per roaster the build''s run should have tried, and how its fetch went (dbt run_completeness,
    as the build saw it).'
  properties:
  - name: build_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The build that wrote it (builds.build_id, the folder''s build=<id>): every row names its build.'
  - name: run_date
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The run the build judged (as_of_run, else the latest run).
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: A roaster the run should have tried.
  - name: attempted
    logicalType: boolean
    physicalType: bool
    required: false
    description: The run has a fetch for it.
  - name: ok
    logicalType: boolean
    physicalType: bool
    required: false
    description: An attempt in the run was ok.
  - name: expected_from
    logicalType: string
    physicalType: string
    required: false
    description: 'Where the expected set came from: manifest or reconstructed.'
  - name: adapter
    logicalType: string
    physicalType: string
    required: false
    description: The adapter that counts for it in adapter_ok_rate.
  - name: has_catalog
    logicalType: boolean
    physicalType: bool
    required: false
    description: 'It counts in the ok rates: not known to have no catalog, not unavailable, not quarantined.'
  - name: catalog_ok
    logicalType: boolean
    physicalType: bool
    required: false
    description: The run fetched it and got products.
  - name: unavailable
    logicalType: boolean
    physicalType: bool
    required: false
    description: Found closed in this run (fetch status unavailable, no ok attempt).
  - name: quarantined
    logicalType: boolean
    physicalType: bool
    required: false
    description: 'Quarantined in this run (fetch status crashed, no ok attempt): not fetched.'
  - name: partial
    logicalType: boolean
    physicalType: bool
    required: false
    description: This run read only part of its catalog.
  - name: partial_reason
    logicalType: string
    physicalType: string
    required: false
    description: Why it is partial; null otherwise.
  - name: challenge
    logicalType: string
    physicalType: string
    required: false
    description: The edge whose challenge it failed behind (siteground or cloudflare); null otherwise.
  quality:
  - id: run_completeness_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  - id: one_row_per_roaster
    description: run_completeness.roaster_id is unique and not null.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: run_completeness
      columns:
      - roaster_id
      test: unique
    dimension: uniqueness
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt run_completeness unique, not_null
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/run_completeness.parquet
- name: release_changes
  physicalName: release_changes
  physicalType: table
  description: 'Ops: every row the build''s public tables add, remove or change against the release served before it, with
    the reason (dbt release_changes); empty when nothing was served.'
  properties:
  - name: build_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The build that wrote it (builds.build_id, the folder''s build=<id>): every row names its build.'
  - name: table_name
    logicalType: string
    physicalType: string
    required: false
    description: The public table, or 'release' when the served release couldn't be read.
  - name: item
    logicalType: string
    physicalType: string
    required: false
    description: The row's key in that table; for a schema row the missing column or table.
  - name: change
    logicalType: string
    physicalType: string
    required: false
    description: added, removed, changed, schema or not_reconciled.
  - name: reason
    logicalType: string
    physicalType: string
    required: false
    description: Why, from the two releases and the build; unexplained when nothing shows why.
  quality:
  - id: release_changes_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  - id: change_values
    description: release_changes.change is added, removed, changed, schema or not_reconciled.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: release_changes
      columns:
      - change
      test: accepted_values
    dimension: conformity
    severity: warning
    customProperties:
    - property: enforcedBy
      value: 'dbt release_changes accepted_values (report only: never gates a release)'
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/release_changes.parquet
- name: product_decisions
  physicalName: product_decisions
  physicalType: table
  description: 'Ops: every product a store lists, coffee or not, as of its latest record, with the build''s coffee decision,
    what decided it and why (dbt product_decisions).'
  properties:
  - name: build_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The build that wrote it (builds.build_id, the folder''s build=<id>): every row names its build.'
  - name: coffee_id
    logicalType: string
    physicalType: string
    required: false
    description: <roaster domain>:<store product id> (dim_coffee's key, for the ones that are coffee).
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's normalized domain.
  - name: product_id
    logicalType: string
    physicalType: string
    required: false
    description: The store's product id.
  - name: title
    logicalType: string
    physicalType: string
    required: false
    description: The title as the store sent it (latest record).
  - name: product_type
    logicalType: string
    physicalType: string
    required: false
    description: The store's product type (latest record).
  - name: url
    logicalType: string
    physicalType: string
    required: false
    description: The product's page on the store, as sent.
  - name: first_seen
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The first run with a record of it.
  - name: last_seen
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The run of its latest record, which the decision is about.
  - name: is_listed
    logicalType: boolean
    physicalType: bool
    required: false
    description: Its latest record is from the roaster's current run.
  - name: input_hash
    logicalType: string
    physicalType: string
    required: false
    description: The product version the decision is about.
  - name: is_coffee
    logicalType: boolean
    physicalType: bool
    required: false
    description: The build counts it as coffee (dim_coffee holds it).
  - name: classified_by
    logicalType: string
    physicalType: string
    required: false
    description: claude (a stored verdict decided) or rules.
  - name: verdict_model
    logicalType: string
    physicalType: string
    required: false
    description: The verdict's model when classified_by is claude, else null.
  - name: verdict_label
    logicalType: string
    physicalType: string
    required: false
    description: Claude's stored label for the version (coffee, not_coffee or unsure), whether or not it decided; null without
      one.
  - name: reason
    logicalType: string
    physicalType: string
    required: false
    description: 'Why: verdict:<label> when Claude''s verdict decided, else the rule that did: excluded:<rule>, sauce, sweets,
      drinks, coffee_words, country, demonym, coffee_type or signals:<n>; decision:<action> when the owner''s decision overrides
      them. excluded:keyword:<field>:<phrase> names an owner''s keyword filter.'
  - name: tags
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: 'The store''s tags on its latest record, decoded: what a keyword filter on tags matches.'
  quality:
  - id: product_decisions_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  - id: one_row_per_product
    description: product_decisions.coffee_id is unique and not null, and every row has a decision and a reason.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: product_decisions
      columns:
      - coffee_id
      test: unique
    dimension: uniqueness
    severity: warning
    customProperties:
    - property: enforcedBy
      value: 'dbt product_decisions unique, not_null (report only: never gates a release)'
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/product_decisions.parquet
- name: mart_flags
  physicalName: mart_flags
  physicalType: table
  description: 'Ops: every flag a rule raised in the build, one row per rule and product, with its polarity, evidence and
    the product''s summary: ready to remove, and its evidence group (dbt mart_flags).'
  properties:
  - name: build_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The build that wrote it (builds.build_id, the folder''s build=<id>): every row names its build.'
  - name: rule
    logicalType: string
    physicalType: string
    required: false
    description: The rule that raised the flag (coffeedata.rules.RULE_TYPES).
  - name: family
    logicalType: string
    physicalType: string
    required: false
    description: 'The rule''s family (classifier, catalog or listing): readiness counts distinct families.'
  - name: polarity
    logicalType: string
    physicalType: string
    required: false
    description: supports (a removal), doubts (a removal) or restore, from the build's rule settings.
  - name: direction
    logicalType: string
    physicalType: string
    required: false
    description: 'The rule''s direction (verdict_flip: added or removed); empty for a rule with one.'
  - name: coffee_id
    logicalType: string
    physicalType: string
    required: false
    description: The product flagged.
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's normalized domain.
  - name: input_hash
    logicalType: string
    physicalType: string
    required: false
    description: The product version its latest record is (the owner can decide by it).
  - name: title
    logicalType: string
    physicalType: string
    required: false
    description: The title as the store sent it (latest record).
  - name: product_type
    logicalType: string
    physicalType: string
    required: false
    description: The store's product type (latest record).
  - name: evidence
    logicalType: string
    physicalType: string
    required: false
    description: What the rule saw, as JSON (shown on the admin's Case page).
  - name: evidence_key
    logicalType: string
    physicalType: string
    required: false
    description: The evidence without the product's identity.
  - name: evidence_hash
    logicalType: string
    physicalType: string
    required: false
    description: 'A hash of the store and every flag''s evidence_key on the product: a store''s products with equal evidence
      group.'
  - name: decision
    logicalType: string
    physicalType: string
    required: false
    description: The owner's decision the build applied (include or exclude), else null.
  - name: classifier_is_coffee
    logicalType: boolean
    physicalType: bool
    required: false
    description: The classifier's answer for the latest version, before any decision.
  - name: was_public
    logicalType: boolean
    physicalType: bool
    required: false
    description: In the served release's public_coffee.
  - name: ready_flags
    logicalType: boolean
    physicalType: bool
    required: false
    description: Its removal is ready as far as the build can tell (supports from enough families, no doubt, no coverage
      problem); the admin adds the live check.
  - name: coverage_problem
    logicalType: boolean
    physicalType: bool
    required: false
    description: This run failed to fetch the product's store although it has a catalog.
  - name: supports_families
    logicalType: integer
    physicalType: int64
    required: false
    description: Distinct families of its supports flags.
  - name: doubts
    logicalType: integer
    physicalType: int64
    required: false
    description: Its doubts flags.
  - name: restores
    logicalType: integer
    physicalType: int64
    required: false
    description: Its restore flags.
  - name: public_rows
    logicalType: integer
    physicalType: int64
    required: false
    description: 'Public rows a removal touches: its public_coffee row and its public_price_event rows.'
  - name: verdict_label
    logicalType: string
    physicalType: string
    required: false
    description: Claude's stored label for the latest version, if any.
  - name: classified_by
    logicalType: string
    physicalType: string
    required: false
    description: claude (a stored verdict decided) or rules.
  - name: reason
    logicalType: string
    physicalType: string
    required: false
    description: Why the classifier answered as it did (stg_products.reason).
  - name: url
    logicalType: string
    physicalType: string
    required: false
    description: The product's page on the store, as sent.
  - name: tags
    logicalType: array
    physicalType: 'list<item: string>'
    items:
      logicalType: string
      physicalType: string
    required: false
    description: The store's tags (latest record).
  - name: bag_sizes_g
    logicalType: array
    physicalType: 'list<item: int32>'
    items:
      logicalType: integer
      physicalType: int32
    required: false
    description: Each variant's weight in grams, as sent.
  - name: prices_usd
    logicalType: array
    physicalType: 'list<item: double>'
    items:
      logicalType: number
      physicalType: double
    required: false
    description: Each variant's price in USD (null when the store states another currency).
  - name: description
    logicalType: string
    physicalType: string
    required: false
    description: The description's text, first 2,000 characters.
  quality:
  - id: mart_flags_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/mart_flags.parquet
- name: eval_prefilter
  physicalName: eval_prefilter
  physicalType: table
  description: 'Ops: the evaluation of the build''s keyword filter change against Claude''s stored verdicts: a summary row,
    then each product the change newly excludes (dbt eval_prefilter; eval/prefilter/README.md).'
  properties:
  - name: build_id
    logicalType: string
    physicalType: string
    required: false
    description: 'The build that wrote it (builds.build_id, the folder''s build=<id>): every row names its build.'
  - name: kind
    logicalType: string
    physicalType: string
    required: false
    description: summary (the counts, one row) or product (one affected product).
  - name: coffee_id
    logicalType: string
    physicalType: string
    required: false
    description: The affected product; null on the summary row.
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's normalized domain.
  - name: title
    logicalType: string
    physicalType: string
    required: false
    description: The title as the store sent it (latest record).
  - name: url
    logicalType: string
    physicalType: string
    required: false
    description: The product's page on the store, as sent.
  - name: input_hash
    logicalType: string
    physicalType: string
    required: false
    description: The product version the filter newly excludes.
  - name: prefilter
    logicalType: string
    physicalType: string
    required: false
    description: 'The filter that excludes it: keyword:<field>:<phrase>.'
  - name: verdict_label
    logicalType: string
    physicalType: string
    required: false
    description: 'Claude''s stored label: not_coffee agrees, coffee is a confidently wrong candidate, unsure or null is
      unknown.'
  - name: affected
    logicalType: integer
    physicalType: int64
    required: false
    description: Products the change newly excludes (summary row).
  - name: claude_not_coffee
    logicalType: integer
    physicalType: int64
    required: false
    description: Of them, Claude also says not_coffee (summary row).
  - name: claude_coffee
    logicalType: integer
    physicalType: int64
    required: false
    description: 'Of them, Claude says coffee: the owner reviews each before Publish (summary row).'
  - name: no_verdict
    logicalType: integer
    physicalType: int64
    required: false
    description: 'Of them, no verdict or unsure: unknown, never agreement (summary row).'
  - name: share_not_coffee
    logicalType: number
    physicalType: double
    required: false
    description: claude_not_coffee / affected (summary row).
  - name: wilson_low
    logicalType: number
    physicalType: double
    required: false
    description: The share's Wilson 95% interval, lower bound (summary row).
  - name: wilson_high
    logicalType: number
    physicalType: double
    required: false
    description: The share's Wilson 95% interval, upper bound (summary row).
  quality:
  - id: eval_prefilter_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/eval_prefilter.parquet
