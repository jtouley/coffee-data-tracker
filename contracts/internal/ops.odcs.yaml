# Internal ODCS contract, generated by src/coffeedata/raw_contracts.py from lake.SCHEMAS and contract_docs.py.
# Do not edit: change those and run `make contracts`, or python -m coffeedata.raw_contracts --write <name>
# <new version> after a change to names, types, required or enums. tests/test_raw_contracts.py fails when this
# file and the code disagree.
apiVersion: v3.2.0
kind: DataContract
id: coffee-data-internal-ops
version: 1.0.0
name: Coffee Data internal ops contract
status: active
domain: coffee
tags:
- internal
description:
  purpose: 'Internal contract between services: coffeedata build (quality.write_ops: the build''s dbt models, beside its
    release under ops/) -> the owner''s command center (admin.registry.coffee).'
  usage: Internal to the pipeline; not published, and not a public interface. Readers outside the pipeline use the public
    catalog contract (contracts/public-catalog.odcs.yaml).
  limitations: Every lake column is nullable in the Arrow schema so that older files read back; required marks the columns
    a quality rule holds non-null.
schema:
- name: run_completeness
  physicalName: run_completeness
  physicalType: table
  description: 'Ops: one row per roaster the build''s run should have tried, and how its fetch went (dbt run_completeness,
    as the build saw it).'
  properties:
  - name: run_date
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The run the build judged (as_of_run, else the latest run).
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: A roaster the run should have tried.
  - name: attempted
    logicalType: boolean
    physicalType: bool
    required: false
    description: The run has a fetch for it.
  - name: ok
    logicalType: boolean
    physicalType: bool
    required: false
    description: An attempt in the run was ok.
  - name: expected_from
    logicalType: string
    physicalType: string
    required: false
    description: 'Where the expected set came from: manifest or reconstructed.'
  - name: adapter
    logicalType: string
    physicalType: string
    required: false
    description: The adapter that counts for it in adapter_ok_rate.
  - name: has_catalog
    logicalType: boolean
    physicalType: bool
    required: false
    description: 'It counts in the ok rates: not known to have no catalog, not unavailable, not quarantined.'
  - name: catalog_ok
    logicalType: boolean
    physicalType: bool
    required: false
    description: The run fetched it and got products.
  - name: unavailable
    logicalType: boolean
    physicalType: bool
    required: false
    description: Found closed in this run (fetch status unavailable, no ok attempt).
  - name: quarantined
    logicalType: boolean
    physicalType: bool
    required: false
    description: 'Quarantined in this run (fetch status crashed, no ok attempt): not fetched.'
  - name: partial
    logicalType: boolean
    physicalType: bool
    required: false
    description: This run read only part of its catalog.
  - name: partial_reason
    logicalType: string
    physicalType: string
    required: false
    description: Why it is partial; null otherwise.
  - name: challenge
    logicalType: string
    physicalType: string
    required: false
    description: The edge whose challenge it failed behind (siteground or cloudflare); null otherwise.
  quality:
  - id: run_completeness_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  - id: one_row_per_roaster
    description: run_completeness.roaster_id is unique and not null.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: run_completeness
      columns:
      - roaster_id
      test: unique
    dimension: uniqueness
    severity: error
    customProperties:
    - property: enforcedBy
      value: dbt run_completeness unique, not_null
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/run_completeness.parquet
- name: release_changes
  physicalName: release_changes
  physicalType: table
  description: 'Ops: every row the build''s public tables add, remove or change against the release served before it, with
    the reason (dbt release_changes); empty when nothing was served.'
  properties:
  - name: table_name
    logicalType: string
    physicalType: string
    required: false
    description: The public table, or 'release' when the served release couldn't be read.
  - name: item
    logicalType: string
    physicalType: string
    required: false
    description: The row's key in that table; for a schema row the missing column or table.
  - name: change
    logicalType: string
    physicalType: string
    required: false
    description: added, removed, changed, schema or not_reconciled.
  - name: reason
    logicalType: string
    physicalType: string
    required: false
    description: Why, from the two releases and the build; unexplained when nothing shows why.
  quality:
  - id: release_changes_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  - id: change_values
    description: release_changes.change is added, removed, changed, schema or not_reconciled.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: release_changes
      columns:
      - change
      test: accepted_values
    dimension: conformity
    severity: warning
    customProperties:
    - property: enforcedBy
      value: 'dbt release_changes accepted_values (report only: never gates a release)'
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/release_changes.parquet
- name: product_decisions
  physicalName: product_decisions
  physicalType: table
  description: 'Ops: every product a store lists, coffee or not, as of its latest record, with the build''s coffee decision,
    what decided it and why (dbt product_decisions).'
  properties:
  - name: coffee_id
    logicalType: string
    physicalType: string
    required: false
    description: <roaster domain>:<store product id> (dim_coffee's key, for the ones that are coffee).
  - name: roaster_id
    logicalType: string
    physicalType: string
    required: false
    description: The roaster's normalized domain.
  - name: product_id
    logicalType: string
    physicalType: string
    required: false
    description: The store's product id.
  - name: title
    logicalType: string
    physicalType: string
    required: false
    description: The title as the store sent it (latest record).
  - name: product_type
    logicalType: string
    physicalType: string
    required: false
    description: The store's product type (latest record).
  - name: url
    logicalType: string
    physicalType: string
    required: false
    description: The product's page on the store, as sent.
  - name: first_seen
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The first run with a record of it.
  - name: last_seen
    logicalType: date
    physicalType: date32[day]
    required: false
    description: The run of its latest record, which the decision is about.
  - name: is_listed
    logicalType: boolean
    physicalType: bool
    required: false
    description: Its latest record is from the roaster's current run.
  - name: input_hash
    logicalType: string
    physicalType: string
    required: false
    description: The product version the decision is about.
  - name: is_coffee
    logicalType: boolean
    physicalType: bool
    required: false
    description: The build counts it as coffee (dim_coffee holds it).
  - name: classified_by
    logicalType: string
    physicalType: string
    required: false
    description: claude (a stored verdict decided) or rules.
  - name: verdict_model
    logicalType: string
    physicalType: string
    required: false
    description: The verdict's model when classified_by is claude, else null.
  - name: verdict_label
    logicalType: string
    physicalType: string
    required: false
    description: Claude's stored label for the version (coffee, not_coffee or unsure), whether or not it decided; null without
      one.
  - name: reason
    logicalType: string
    physicalType: string
    required: false
    description: 'Why: verdict:<label> when Claude''s verdict decided, else the rule that did: excluded:<rule>, sauce, sweets,
      drinks, coffee_words, country, demonym, coffee_type or signals:<n>.'
  quality:
  - id: product_decisions_ops_columns
    description: each ops file has exactly the contract's columns and types, and none is a release table.
    type: custom
    engine: pytest
    implementation: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
    dimension: conformity
    severity: error
    customProperties:
    - property: enforcedBy
      value: tests/test_raw_contracts.py::test_ops_tables_follow_the_ops_contract
  - id: one_row_per_product
    description: product_decisions.coffee_id is unique and not null, and every row has a decision and a reason.
    type: custom
    engine: dbt
    implementation:
      file: models/schema.yml
      model: product_decisions
      columns:
      - coffee_id
      test: unique
    dimension: uniqueness
    severity: warning
    customProperties:
    - property: enforcedBy
      value: 'dbt product_decisions unique, not_null (report only: never gates a release)'
  customProperties:
  - property: lakeGlob
    value: releases/*/*/ops/product_decisions.parquet
authoritativeDefinitions:
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/lake.py
  type: implementation
  description: 'lake.SCHEMAS: the Arrow schemas the columns and types come from'
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/contract_docs.py
  type: businessDefinition
  description: Table and column descriptions, and quality rules
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/raw_contracts.py
  type: implementation
  description: The generator of this file
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/src/coffeedata/quality.py
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/dbt/models/marts/run_completeness.sql
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/dbt/models/marts/release_changes.sql
  type: implementation
  description: Producer
- url: https://github.com/jtouley/coffee-data-tracker/blob/main/dbt/models/marts/product_decisions.sql
  type: implementation
